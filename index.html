    <style>

        .modal-dialog .modal-btns { display:flex; gap:6px; }

        .btn-primary { background:linear-gradient(135deg, var(--accent), #b8903a); color:#1a1f0f; }
        .btn-dark { background:#4a3a2a; color:#eee; }

    </style>

<body>

<script>
(function(){'use strict';
// ==================== БЕЗОПАСНОЕ ХРАНИЛИЩЕ ====================
const SECURE_STORAGE_KEY = 'robincall_secure_v1';
async function getStorageKey(){let kb=localStorage.getItem(SECURE_STORAGE_KEY);if(!kb){const k=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt","decrypt"]);const r=await crypto.subtle.exportKey("raw",k);kb=btoa(String.fromCharCode(...new Uint8Array(r)));localStorage.setItem(SECURE_STORAGE_KEY,kb);return k}const r=Uint8Array.from(atob(kb),c=>c.charCodeAt(0));return await crypto.subtle.importKey("raw",r,{name:"AES-GCM"},false,["encrypt","decrypt"])}
async function secureSetItem(key,value){try{const sk=await getStorageKey();const iv=crypto.getRandomValues(new Uint8Array(12));const enc=new TextEncoder().encode(JSON.stringify(value));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},sk,enc);const combined=new Uint8Array(iv.length+new Uint8Array(ct).length);combined.set(iv);combined.set(new Uint8Array(ct),iv.length);localStorage.setItem(key,btoa(String.fromCharCode(...combined)))}catch(e){}}
async function secureGetItem(key){try{const stored=localStorage.getItem(key);if(!stored)return null;const sk=await getStorageKey();const combined=Uint8Array.from(atob(stored),c=>c.charCodeAt(0));const iv=combined.slice(0,12);const ct=combined.slice(12);const dec=await crypto.subtle.decrypt({name:"AES-GCM",iv},sk,ct);return JSON.parse(new TextDecoder().decode(dec))}catch(e){return null}}
function secureRemoveItem(key){localStorage.removeItem(key)}

// ==================== СИСТЕМА БЛОКИРОВКИ ====================
const LOCK_KEY='robincall_lock_v1';
let lockType=null,lockPin='',lockPattern=[],pinInput='',patternInput=[],isSettingUp=false,tempPin='',tempPattern=[];
const lockScreen=document.getElementById('lock-screen'),appContainer=document.getElementById('app-container');
const lockSubtitle=document.getElementById('lock-subtitle'),lockPinDots=document.getElementById('lock-pin-dots');
const lockNumpad=document.getElementById('lock-numpad'),lockPatternCanvas=document.getElementById('lock-pattern-canvas');
const lockError=document.getElementById('lock-error'),lockActions=document.getElementById('lock-actions');
const lockPinHint=document.getElementById('lock-pin-hint'),lockPatternHint=document.getElementById('lock-pattern-hint');
const patternCtx=lockPatternCanvas?.getContext('2d');
const patternPoints=[{x:52,y:52},{x:130,y:52},{x:208,y:52},{x:52,y:130},{x:130,y:130},{x:208,y:130},{x:52,y:208},{x:130,y:208},{x:208,y:208}];

async function loadLockSettings(){const saved=await secureGetItem(LOCK_KEY);if(saved){lockType=saved.type;lockPin=saved.pin||'';lockPattern=saved.pattern||[]}if(!lockType){lockScreen.style.display='none';appContainer.style.display='flex';initApp()}else{lockScreen.style.display='flex';appContainer.style.display='none';setupLockUI()}}
function setupLockUI(){document.querySelectorAll('.lock-tab').forEach(t=>t.classList.remove('active'));if(lockType==='pin'){document.querySelector('[data-tab="pin"]').classList.add('active');document.getElementById('lock-pin-section').style.display='';document.getElementById('lock-pattern-section').style.display='none';drawNumpad();updatePinDots();lockSubtitle.textContent=isSettingUp?'Задайте новый пин-код':'Введите пин-код'}else{document.querySelector('[data-tab="pattern"]').classList.add('active');document.getElementById('lock-pin-section').style.display='none';document.getElementById('lock-pattern-section').style.display='';drawPatternGrid();lockSubtitle.textContent=isSettingUp?'Нарисуйте новый ключ':'Нарисуйте ключ'}lockError.textContent='';lockActions.style.display=isSettingUp?'flex':'none';pinInput='';patternInput=[];updatePinDots();drawPatternGrid()}
function drawNumpad(){lockNumpad.innerHTML='';for(let i=1;i<=9;i++){const btn=document.createElement('button');btn.className='lock-num';btn.textContent=i;btn.addEventListener('click',()=>onPinDigit(i));lockNumpad.appendChild(btn)}const btn0=document.createElement('button');btn0.className='lock-num zero';btn0.textContent='0';btn0.addEventListener('click',()=>onPinDigit(0));lockNumpad.appendChild(btn0);const btnDel=document.createElement('button');btnDel.className='lock-num del';btnDel.textContent='⌫';btnDel.addEventListener('click',()=>{pinInput=pinInput.slice(0,-1);updatePinDots()});lockNumpad.appendChild(btnDel)}
function onPinDigit(d){if(pinInput.length>=4)return;pinInput+=d;updatePinDots();if(pinInput.length===4)verifyPin()}
function updatePinDots(){const dots=lockPinDots.querySelectorAll('.lock-pin-dot');dots.forEach((d,i)=>d.classList.toggle('filled',i<pinInput.length))}
function verifyPin(){if(isSettingUp){if(!tempPin){tempPin=pinInput;pinInput='';updatePinDots();lockSubtitle.textContent='Повторите пин-код';lockPinHint.textContent='Введите ещё раз'}else{if(pinInput===tempPin){saveLock('pin',pinInput)}else{lockError.textContent='Пин-коды не совпадают';tempPin='';pinInput='';updatePinDots();lockSubtitle.textContent='Задайте новый пин-код'}}}else{if(pinInput===lockPin){unlock()}else{lockError.textContent='Неверный пин-код';pinInput='';updatePinDots()}}}
function drawPatternGrid(highlightPoints=[]){if(!patternCtx)return;const w=lockPatternCanvas.width,h=lockPatternCanvas.height;patternCtx.clearRect(0,0,w,h);patternCtx.fillStyle='rgba(0,0,0,0.3)';patternCtx.fillRect(0,0,w,h);patternPoints.forEach((p,i)=>{patternCtx.beginPath();patternCtx.arc(p.x,p.y,16,0,Math.PI*2);patternCtx.strokeStyle='var(--border)';patternCtx.lineWidth=2;patternCtx.stroke();if(highlightPoints.includes(i)){patternCtx.fillStyle='var(--accent-light)';patternCtx.fill()}});if(highlightPoints.length>1){patternCtx.strokeStyle='var(--accent-light)';patternCtx.lineWidth=3;patternCtx.beginPath();patternCtx.moveTo(patternPoints[highlightPoints[0]].x,patternPoints[highlightPoints[0]].y);for(let i=1;i<highlightPoints.length;i++)patternCtx.lineTo(patternPoints[highlightPoints[i]].x,patternPoints[highlightPoints[i]].y);patternCtx.stroke()}}
function getPatternPoint(x,y){for(let i=0;i<patternPoints.length;i++){const p=patternPoints[i];if(Math.sqrt((x-p.x)**2+(y-p.y)**2)<22)return i}return-1}
lockPatternCanvas?.addEventListener('pointerdown',e=>{patternInput=[];const rect=lockPatternCanvas.getBoundingClientRect();const pt=getPatternPoint(e.clientX-rect.left,e.clientY-rect.top);if(pt>=0)patternInput.push(pt);drawPatternGrid(patternInput)});
lockPatternCanvas?.addEventListener('pointermove',e=>{if(patternInput.length===0)return;const rect=lockPatternCanvas.getBoundingClientRect();const pt=getPatternPoint(e.clientX-rect.left,e.clientY-rect.top);if(pt>=0&&!patternInput.includes(pt))patternInput.push(pt);drawPatternGrid(patternInput)});
lockPatternCanvas?.addEventListener('pointerup',()=>{if(patternInput.length>=3)verifyPattern();else{lockError.textContent='Минимум 3 точки';patternInput=[];drawPatternGrid()}});
function verifyPattern(){if(isSettingUp){if(!tempPattern.length){tempPattern=[...patternInput];patternInput=[];drawPatternGrid();lockSubtitle.textContent='Повторите ключ';lockPatternHint.textContent='Нарисуйте ещё раз'}else{if(JSON.stringify(patternInput)===JSON.stringify(tempPattern)){saveLock('pattern',null,patternInput)}else{lockError.textContent='Ключи не совпадают';tempPattern=[];patternInput=[];drawPatternGrid();lockSubtitle.textContent='Нарисуйте новый ключ'}}}else{if(JSON.stringify(patternInput)===JSON.stringify(lockPattern)){unlock()}else{lockError.textContent='Неверный ключ';patternInput=[];drawPatternGrid()}}}
async function saveLock(type,pin,pattern){lockType=type;lockPin=pin||'';lockPattern=pattern||[];await secureSetItem(LOCK_KEY,{type,pin:lockPin,pattern:lockPattern});isSettingUp=false;tempPin='';tempPattern=[];pinInput='';patternInput=[];unlock()}
function unlock(){lockScreen.style.display='none';appContainer.style.display='flex';initApp()}
document.getElementById('lock-tabs')?.addEventListener('click',e=>{if(e.target.classList.contains('lock-tab')){lockType=e.target.dataset.tab;setupLockUI()}});
document.getElementById('lock-reset')?.addEventListener('click',()=>{tempPin='';tempPattern=[];pinInput='';patternInput=[];updatePinDots();drawPatternGrid();lockError.textContent='';lockSubtitle.textContent=lockType==='pin'?'Задайте новый пин-код':'Нарисуйте новый ключ'});
document.getElementById('lock-skip')?.addEventListener('click',()=>{isSettingUp=false;tempPin='';tempPattern=[];unlock()});

// ==================== КОНФИГУРАЦИЯ ====================
const P2PPONG_URL='https://stepweather-prog.github.io/P2PPong/';
const RENDER_SERVER='https://p2ppong.onrender.com';
const WORKERS_URL='https://robincall.stephanclaps-491.workers.dev';
let pongFrame,robinMessage,callStatus,callTimer,connectionDot,connectionLabel;
let btnMainAction,btnAnswer,btnReject,btnEndCall,btnMic,btnSpeaker,btnArrowCreate,btnCallMain,btnVideoCircle,btnClearReset,btnCopyLink,btnShare,btnJoin,joinInput,btnServerRender,btnServerWorkers;
let incomingRow,activeRow,audioControls,joinRow,refModal,refLinkDisplay,btnCheckServer;
let avatarSelector,avatarList,overlay,profileAvatarSmall,nickLabel,nickModal,nickInput;

const ICE=[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:["turn:openrelay.metered.ca:80?transport=tcp","turn:openrelay.metered.ca:443?transport=tcp"],username:"openrelayproject",credential:"openrelayproject"}];
let pc=null,stream=null,handshake=null,chId=null,sec=null,srv='render',active=!1,tStart=null,tInt=null,mic=!0,spk=!0,offer=null,link=null,ready=!1,online=!1;
let videoCircleRecorder=null,videoCircleChunks=[],autoConnectDone=!1,audioPool={};
const MAX_VIDEO_CIRCLE_DURATION=30,MAX_NICK_LENGTH=12;
try{srv=localStorage.getItem('robinhood_server')||'render'}catch(e){}

function $(s){return document.getElementById(s)}
function log(m){console.log('[RC]',m)}
function rMsg(m){if(robinMessage)robinMessage.textContent=m;log(m)}
function conn(s){if(connectionDot)connectionDot.className='connection-dot '+s;if(connectionLabel)connectionLabel.textContent=s==='online'?'Готов':s==='offline'?'Нет связи':'Проверка...'}
function getAudio(filename){if(!audioPool[filename]){audioPool[filename]=new Audio('assets/sounds/'+filename);audioPool[filename].volume=0.5}const a=audioPool[filename];a.currentTime=0;return a}
function playSound(filename){try{getAudio(filename).play().catch(()=>{})}catch(e){}}

async function api(m,p,b){const url=srv==='workers'?WORKERS_URL:RENDER_SERVER;const c=new AbortController(),t=setTimeout(()=>c.abort(),srv==='workers'?5000:10000);try{const o={method:m,headers:{'Content-Type':'application/json'},signal:c.signal};if(b)o.body=JSON.stringify(b);const r=await fetch(url+p,o);clearTimeout(t);return r.ok?await r.json():null}catch(e){clearTimeout(t);return null}}
async function chkSrv(){conn('checking');online=(await api('GET','/ping'))!==null;conn(online?'online':'offline');return online}
function swSrv(s){if(s===srv)return;srv=s;try{localStorage.setItem('robinhood_server',srv)}catch(e){}if(btnServerRender)btnServerRender.classList.toggle('active',srv==='render');if(btnServerWorkers)btnServerWorkers.classList.toggle('active',srv==='workers');rMsg('🔄 Сервер: '+(s==='workers'?'Workers':'Render'))}

function send(m){if(!m)return;if(chId&&sec){m.secret=sec;m.channelId=chId}if(handshake&&m.action==='handshake')m.handshake=handshake;pongFrame.contentWindow?.postMessage(m,'*')}
async function getStream(video=false){try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:!0,noiseSuppression:!0,autoGainControl:!0},video:video});return!0}catch(e){rMsg('❌ Нет доступа');return!1}}
function mkPC(){if(pc){pc.close();pc=null}pc=new RTCPeerConnection({iceServers:ICE,iceTransportPolicy:'all'});if(stream)stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{if(e.streams[0]){const a=new Audio();a.srcObject=e.streams[0];a.play().catch(()=>{})}};pc.onicecandidate=e=>{if(e.candidate)send({action:'send',text:'__ICE__'+JSON.stringify(e.candidate),channelId:chId})};pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){active=!0;tStart=Date.now();timer();ui('active');if(callStatus)callStatus.textContent='✅ Разговор';playSound('open.mp3')}else if(pc.connectionState==='disconnected'||pc.connectionState==='failed')hang(!1)};return pc}

function mkQ(){if(!online){rMsg('⚠ Сервер офлайн');return}rMsg('⚒ Куём стрелу...');btnMainAction.disabled=!0;send({action:'create'})}
async function call(){if(!ready||!chId){rMsg('⚠ Создайте стрелу');return}if(callStatus)callStatus.textContent='📞 Вызов...';ui('calling');if(!await getStream(!1)){ui('ready');return}mkPC();try{const o=await pc.createOffer();await pc.setLocalDescription(o);send({action:'send',text:'__OFFER__'+JSON.stringify(o),channelId:chId});playSound('Welk.mp3')}catch(e){hang(!0)}}
async function accept(){if(!offer)return;ui('active');if(!await getStream(!1)){ui('ready');return}mkPC();try{await pc.setRemoteDescription(new RTCSessionDescription(offer));const a=await pc.createAnswer();await pc.setLocalDescription(a);send({action:'send',text:'__ANSWER__'+JSON.stringify(a),channelId:chId});offer=null}catch(e){hang(!0)}}
function hang(sig=!0){active=!1;if(tInt){clearInterval(tInt);tInt=null}if(callTimer){callTimer.classList.add('hidden');callTimer.textContent='00:00'}if(sig&&chId)send({action:'send',text:'__HANGUP__',channelId:chId});if(pc){pc.close();pc=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}offer=null;if(callStatus)callStatus.textContent='';ui('ready');playSound('exet.mp3')}
function timer(){if(callTimer)callTimer.classList.remove('hidden');tInt=setInterval(()=>{const e=Math.floor((Date.now()-tStart)/1000);if(callTimer)callTimer.textContent=Math.floor(e/60).toString().padStart(2,'0')+':'+(e%60).toString().padStart(2,'0')},1000)}
function accArrow(id,key){if(!id){rMsg('⚠ ID колчана');return}rMsg('🔍 Поиск...');send({action:'accept',id:id,key:key||''})}
function resetSession(){if(active)hang(!0);chId=null;sec=null;link=null;ready=!1;offer=null;autoConnectDone=!1;ui('idle');rMsg('🏹 Канал сброшен')}
function cp(){if(link){navigator.clipboard.writeText(link).then(()=>rMsg('📋 Скопировано')).catch(()=>{});refModal.classList.add('active')}else rMsg('⚠ Создайте стрелу')}
async function shr(){if(link&&navigator.share)try{await navigator.share({title:'RobinCall',text:'Звонок!',url:link})}catch(e){}else cp()}

function sendVideoCircle(videoData){if(!chId||!sec)return;send({action:'send',text:'__FILE__'+JSON.stringify({type:'video-circle',name:'video_circle.webm',size:videoData.size,mime:'video/webm',data:videoData.data}),channelId:chId});rMsg('📹 Кружок отправлен')}
function startVideoCircle(){if(videoCircleRecorder?.state==='recording'){videoCircleRecorder.stop();btnVideoCircle.style.background='';return}navigator.mediaDevices.getUserMedia({video:!0,audio:!0}).then(st=>{videoCircleRecorder=new MediaRecorder(st,{mimeType:'video/webm; codecs=vp8,opus'});videoCircleChunks=[];videoCircleRecorder.ondataavailable=e=>videoCircleChunks.push(e.data);videoCircleRecorder.onstop=()=>{const blob=new Blob(videoCircleChunks,{type:'video/webm'});const reader=new FileReader();reader.onload=()=>{sendVideoCircle({size:blob.size,data:reader.result.split(',')[1]})};reader.readAsDataURL(blob);st.getTracks().forEach(t=>t.stop());videoCircleRecorder=null;btnVideoCircle.style.background=''};videoCircleRecorder.start();btnVideoCircle.style.background='#f44336';setTimeout(()=>{if(videoCircleRecorder?.state==='recording')videoCircleRecorder.stop()},MAX_VIDEO_CIRCLE_DURATION*1000)}).catch(()=>rMsg('❌ Нет камеры'))}

function ui(s){btnMainAction.classList.add('hidden');incomingRow.classList.add('hidden');activeRow.classList.add('hidden');audioControls.classList.add('hidden');btnMainAction.disabled=!1;if(s==='idle'){btnMainAction.classList.remove('hidden');if(callStatus)callStatus.textContent='🏹 Создайте стрелу'}else if(s==='ready'){btnMainAction.classList.remove('hidden');if(callStatus)callStatus.textContent='📞 Готово!'}else if(s==='calling'){activeRow.classList.remove('hidden');audioControls.classList.remove('hidden')}else if(s==='incoming'){incomingRow.classList.remove('hidden');if(callStatus)callStatus.textContent='📞 Входящий!'}else if(s==='active'){activeRow.classList.remove('hidden');audioControls.classList.remove('hidden')}}

const avatars=['assets/avatars/001-.png','assets/avatars/002--1.png','assets/avatars/003-icon-8033085.png','assets/avatars/009--7.png','assets/avatars/010--8.png','assets/avatars/018--16.png','assets/avatars/022--20.png','assets/avatars/037--35.png','assets/avatars/043--41.png','assets/avatars/048--46.png','assets/avatars/050--48.png','assets/avatars/052--50.png','assets/avatars/053--51.png','assets/avatars/056--54.png','assets/avatars/066--64.png','assets/avatars/077-icon-8033092.png','assets/avatars/083-icon-11885568.png','assets/avatars/094-icon-18926716.png','assets/avatars/108--83.png','assets/avatars/147-icon-6081840.png','assets/avatars/148-icon-5532632.png','assets/avatars/149-icon-4132697.png','assets/avatars/150-icon-10756654.png','assets/avatars/153-icon-4964924.png','assets/avatars/154-icon-4261075.png','assets/avatars/156-icon-4132828.png','assets/avatars/158--116.png','assets/avatars/160-icon-2332597.png','assets/avatars/162-icon-6237595.png','assets/avatars/167-icon-1920840.png','assets/avatars/168-icon-228268.png','assets/avatars/169-icon-5613167.png','assets/avatars/173-icon-1615623.png','assets/avatars/183-icon-5840846.png','assets/avatars/186-icon-6237499.png','assets/avatars/188-icon-6267517.png','assets/avatars/203-icon-3516506.png','assets/avatars/216-icon-5504960.png','assets/avatars/221-icon-9530256.png','assets/avatars/226-icon-9669507.png','assets/avatars/227-icon-9623471.png','assets/avatars/229-icon-10032172.png','assets/avatars/230-icon-10049316.png','assets/avatars/232-icon-11434002.png','assets/avatars/234-icon-10756328.png','assets/avatars/245-icon-16150697.png','assets/avatars/246-icon-16150730.png','assets/avatars/249-icon-17159913.png','assets/avatars/250-icon-17159758.png','assets/avatars/251-icon-17159744.png','assets/avatars/253-icon-18426073.png','assets/avatars/254-icon-18621065.png','assets/avatars/255-icon-18926692.png','assets/avatars/256--120.png'];
function loadAvatars(){if(!avatarList)return;avatarList.innerHTML='';avatars.forEach(src=>{const img=document.createElement('img');img.src=src;img.className='avatar-option';img.addEventListener('error',()=>{img.src='assets/avatars/001-.png'});img.addEventListener('click',()=>{if(profileAvatarSmall)profileAvatarSmall.src=src;const ra=document.getElementById('robin-avatar');if(ra)ra.src=src;localStorage.setItem('robinhood_avatar',src);avatarSelector.classList.remove('show');overlay.classList.remove('show');rMsg('🖼 Аватар обновлён')});avatarList.appendChild(img)})}

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
function initApp(){
    pongFrame=$('pong-frame');robinMessage=$('robin-message');callStatus=$('call-status');callTimer=$('call-timer');
    connectionDot=$('connection-dot');connectionLabel=$('connection-label');
    btnMainAction=$('btn-main-action');btnAnswer=$('btn-answer');btnReject=$('btn-reject');btnEndCall=$('btn-end-call');
    btnMic=$('btn-mic');btnSpeaker=$('btn-speaker');btnArrowCreate=$('btn-arrow-create');btnCallMain=$('btn-call-main');
    btnVideoCircle=$('btn-video-circle');btnClearReset=$('btn-clear-reset');btnCopyLink=$('btn-copy-link');btnShare=$('btn-share');
    btnJoin=$('btn-join');joinInput=$('join-input');btnServerRender=$('btn-server-render');btnServerWorkers=$('btn-server-workers');
    incomingRow=$('incoming-row');activeRow=$('active-row');audioControls=$('audio-controls');joinRow=$('join-row');
    refModal=$('ref-modal');refLinkDisplay=$('ref-link-display');btnCheckServer=$('btn-check-server');
    avatarSelector=$('avatar-selector');avatarList=$('avatar-list');overlay=$('overlay');
    profileAvatarSmall=$('profile-avatar-small');nickLabel=$('nick-label');nickModal=$('nick-modal');nickInput=$('nick-input');

    const savedAvatar=localStorage.getItem('robinhood_avatar');if(savedAvatar&&profileAvatarSmall){profileAvatarSmall.src=savedAvatar;const ra=document.getElementById('robin-avatar');if(ra)ra.src=savedAvatar}
    const savedNick=localStorage.getItem('robinhood_nick');if(savedNick&&nickLabel)nickLabel.textContent=savedNick.substring(0,MAX_NICK_LENGTH);
    const savedServer=localStorage.getItem('robinhood_server');if(savedServer){srv=savedServer;if(btnServerRender)btnServerRender.classList.toggle('active',srv==='render');if(btnServerWorkers)btnServerWorkers.classList.toggle('active',srv==='workers')}

    $('btn-avatar-menu').addEventListener('click',()=>{avatarSelector.classList.toggle('show');overlay.classList.toggle('show');if(avatarSelector.classList.contains('show'))loadAvatars()});
    overlay.addEventListener('click',()=>{avatarSelector.classList.remove('show');overlay.classList.remove('show')});
    nickLabel.addEventListener('click',()=>{nickInput.value=nickLabel.textContent;nickModal.classList.add('active')});
    $('btn-nick-cancel').addEventListener('click',()=>nickModal.classList.remove('active'));
    $('btn-nick-save').addEventListener('click',()=>{const nick=nickInput.value.trim().substring(0,MAX_NICK_LENGTH);if(nick){nickLabel.textContent=nick;localStorage.setItem('robinhood_nick',nick)}nickModal.classList.remove('active')});
    nickModal.addEventListener('click',e=>{if(e.target===nickModal)nickModal.classList.remove('active')});

    btnMainAction.addEventListener('click',()=>{if(!ready)mkQ();else call()});
    btnArrowCreate.addEventListener('click',mkQ);btnCallMain.addEventListener('click',call);
    btnClearReset.addEventListener('click',resetSession);
    btnVideoCircle.addEventListener('click',startVideoCircle);
    btnAnswer.addEventListener('click',accept);
    btnReject.addEventListener('click',()=>{send({action:'send',text:'__HANGUP__',channelId:chId});offer=null;ui('ready')});
    btnEndCall.addEventListener('click',()=>hang(!0));
    btnMic.addEventListener('click',()=>{if(stream){mic=!mic;stream.getAudioTracks().forEach(t=>t.enabled=mic);btnMic.textContent=mic?'🎤':'🔇'}});
    btnSpeaker.addEventListener('click',()=>{spk=!spk;btnSpeaker.textContent=spk?'🔊':'🔈'});
    $('btn-copy-link-modal')?.addEventListener('click',()=>{if(link)navigator.clipboard.writeText(link).catch(()=>{})});
    $('btn-share-link')?.addEventListener('click',shr);
    $('btn-close-modal')?.addEventListener('click',()=>refModal.classList.remove('active'));
    if(btnServerRender)btnServerRender.addEventListener('click',()=>swSrv('render'));
    if(btnServerWorkers)btnServerWorkers.addEventListener('click',()=>swSrv('workers'));
    if(btnCheckServer)btnCheckServer.addEventListener('click',()=>chkSrv().then(o=>rMsg(o?'✅ Доступен':'❌ Офлайн')));

    window.addEventListener('message',async e=>{
        if(e.source!==pongFrame.contentWindow)return;const d=e.data;
        if(d.type==='pong-ready'){handshake=d.handshake;send({action:'handshake'});conn('online');if(!autoConnectDone){ui('idle');rMsg('🏹 Готов!')}}
        else if(d.type==='handshake-ok'){if(!autoConnectDone){const urlParams=new URLSearchParams(location.search);const sid=urlParams.get('id');const key=urlParams.get('key');if(sid){const refServer=urlParams.get('server')||srv;if(refServer!==srv){srv=refServer;localStorage.setItem('robinhood_server',srv);if(btnServerRender)btnServerRender.classList.toggle('active',srv==='render');if(btnServerWorkers)btnServerWorkers.classList.toggle('active',srv==='workers')}autoConnectDone=true;accArrow(sid,key)}else{ui('idle')}}}
        else if(d.type==='session-created'){chId=d.sessionId;sec=d.secret;link=d.fullLink;ready=!0;rMsg('✅ Стрела!');conn('online');if(refLinkDisplay)refLinkDisplay.textContent=d.fullLink;refModal.classList.add('active');ui('ready');navigator.clipboard.writeText(link).catch(()=>{})}
        else if(d.type==='channel-open'){chId=d.channelId;sec=d.secret;ready=!0;rMsg('✅ Подключено!');conn('online');ui('ready')}
        else if(d.type==='message'&&d.text){
            if(d.text.startsWith('__OFFER__')){if(active||pc){send({action:'send',text:'__HANGUP__',channelId:chId});return}try{offer=JSON.parse(d.text.replace('__OFFER__',''));ui('incoming');playSound('melodi.mp3')}catch(e){}}
            else if(d.text.startsWith('__ANSWER__')&&pc){try{await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(d.text.replace('__ANSWER__',''))));active=!0;tStart=Date.now();timer();ui('active')}catch(e){}}
            else if(d.text.startsWith('__ICE__')&&pc){try{await pc.addIceCandidate(new RTCIceCandidate(JSON.parse(d.text.replace('__ICE__',''))))}catch(e){}}
            else if(d.text==='__HANGUP__'){if(active||pc){rMsg('📞 Собеседник завершил');hang(!1)}}
            else if(d.text.startsWith('__FILE__')){try{const fd=JSON.parse(d.text.replace('__FILE__',''));if(fd.type==='video-circle')rMsg('📹 Видео-кружок получен')}catch(e){}}
        }else if(d.type==='error'){rMsg('⚠ '+d.text);btnMainAction.disabled=!1;ui('idle')}
    });

    chkSrv().then(()=>{pongFrame.src=P2PPONG_URL+'?v='+Date.now();pongFrame.style.display='none';if(online){ui('idle');rMsg('🏹 Готов!')}else{rMsg('⚠ Сервер офлайн')}});
    window.addEventListener('beforeunload',()=>{if(active)send({action:'send',text:'__HANGUP__',channelId:chId});if(pc)pc.close();if(stream)stream.getTracks().forEach(t=>t.stop())});
}

loadLockSettings();
})();
</script>
