// ========== CRYPTO ==========
const CRYPTO = (() => {
    const KEY_NAME = 'robincall_key_v2';
    let key = null;
    async function sha256(t) { const d = new TextEncoder().encode(t); const h = await crypto.subtle.digest('SHA-256', d); return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join(''); }
    async function getKey() {
        if (key) return key;
        let raw = sessionStorage.getItem(KEY_NAME);
        if (raw) { const b = Uint8Array.from(atob(raw), c => c.charCodeAt(0)); key = await crypto.subtle.importKey('raw', b, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']); return key; }
        try {
            const db = await new Promise((r, j) => { const req = indexedDB.open('RobinCallSecure', 1); req.onupgradeneeded = () => req.result.createObjectStore('keys', { keyPath: 'id' }); req.onsuccess = () => r(req.result); req.onerror = () => j(req.error); });
            const result = await new Promise(r => { const req = db.transaction('keys','readonly').objectStore('keys').get(KEY_NAME); req.onsuccess = () => r(req.result); req.onerror = () => r(null); });
            if (result) { const b = Uint8Array.from(atob(result.value), c => c.charCodeAt(0)); key = await crypto.subtle.importKey('raw', b, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']); sessionStorage.setItem(KEY_NAME, result.value); return key; }
        } catch (e) {}
        key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
        const exported = await crypto.subtle.exportKey('raw', key);
        raw = btoa(String.fromCharCode(...new Uint8Array(exported)));
        sessionStorage.setItem(KEY_NAME, raw);
        try { const db = await new Promise((r, j) => { const req = indexedDB.open('RobinCallSecure', 1); req.onsuccess = () => r(req.result); req.onerror = () => j(req.error); }); const tx = db.transaction('keys', 'readwrite'); tx.objectStore('keys').put({ id: KEY_NAME, value: raw }); } catch (e) {}
        return key;
    }
    async function encrypt(text) { try { const k = await getKey(); const iv = crypto.getRandomValues(new Uint8Array(12)); const enc = new TextEncoder().encode(text); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, enc); const combined = new Uint8Array(iv.length + new Uint8Array(ct).length); combined.set(iv); combined.set(new Uint8Array(ct), iv.length); return '🔐' + btoa(String.fromCharCode(...combined)); } catch (e) { return text; } }
    async function decrypt(text) { if (!text || !text.startsWith('🔐')) return text; try { const k = await getKey(); const combined = Uint8Array.from(atob(text.slice(2)), c => c.charCodeAt(0)); const iv = combined.slice(0, 12); const ct = combined.slice(12); const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, k, ct); return new TextDecoder().decode(dec); } catch (e) { return text; } }
    return { sha256, getKey, encrypt, decrypt, setKey: (k) => { key = k; } };
})();

// ========== THEMES ==========
const THEMES = (() => {
    const themes = [{ id: 'forest', icon: '🌲', name: 'Лес' }, { id: 'sunset', icon: '🌅', name: 'Закат' }, { id: 'ocean', icon: '🌊', name: 'Океан' }, { id: 'night-ember', icon: '🔥', name: 'Костёр' }, { id: 'morning-mist', icon: '🌫️', name: 'Туман' }];
    return { getThemes: () => themes, apply: (id, iEl, nEl) => { document.documentElement.setAttribute('data-theme', id); localStorage.setItem('robinhood_theme', id); const t = themes.find(t => t.id === id) || themes[0]; if (iEl) iEl.textContent = t.icon; if (nEl) nEl.textContent = t.name; } };
})();

// ========== ОСНОВНОЙ КОД v5.2 ==========
(function() {
    const P2PPONG_URL = 'https://stepweather-prog.github.io/P2PPong/';
    const MAX_VOICE_DURATION = 60;

    let pongFrame, robinText, callTimer, connectionDot, connectionLabel;
    let btnMainAction, btnAnswer, btnReject, btnEndCall, btnSpeaker, btnMic;
    let incomingRow, activeRow;
    let channels = {}, activeChannelId = null, handshakeSecret = null;
    let pc = null, stream = null, callActive = false, tStart = null, tInt = null;
    let micOn = true, spkOn = true, offerReceived = null;
    let voiceRecorder = null, voiceChunks = [], voiceStream = null, voiceRecording = false;
    let voiceTimerInterval = null, voiceSeconds = 0;
    let obfuscationEnabled = false, peerHelpEnabled = true, toggleSoundState = true;
    let currentServer = 'render', pendingMessages = [];
    let peerRegistry = { count: () => 0, stats: { upload: 0, download: 0 } };
    let seedingIndicator = { update: () => {} };
    let currentContextContact = null;

    function $(id) { return document.getElementById(id); }
    function updateRobin(text, dur = 4000) { if (robinText) { robinText.textContent = text; if (dur > 0) { clearTimeout(window._rt); window._rt = setTimeout(() => { robinText.textContent = 'Рог готов!'; }, dur); } } }
    function getAudio(f) { if (!window._ap) window._ap = {}; if (!window._ap[f]) { window._ap[f] = new Audio('assets/sounds/' + f); window._ap[f].volume = 0.5; } const a = window._ap[f]; a.currentTime = 0; return a; }
    function playSound(f) { if (toggleSoundState) try { getAudio(f).play().catch(() => {}); } catch (e) {} }

    function sendToPong(msg) {
        if (!msg) return;
        if (activeChannelId && channels[activeChannelId]) { msg.secret = channels[activeChannelId].secret; msg.channelId = activeChannelId; }
        if (handshakeSecret && pongFrame?.contentWindow) { pongFrame.contentWindow.postMessage(msg, '*'); }
        else { pendingMessages.push(msg); if (pendingMessages.length > 50) pendingMessages.shift(); }
    }

    function ui(state) {
        btnMainAction.classList.add('hidden'); incomingRow.classList.add('hidden'); activeRow.classList.add('hidden');
        btnMainAction.disabled = false;
        if (state === 'idle' || state === 'ready') btnMainAction.classList.remove('hidden');
        else if (state === 'calling' || state === 'active') activeRow.classList.remove('hidden');
        else if (state === 'incoming') incomingRow.classList.remove('hidden');
    }

    async function getStream(video = false) {
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video }); return true; }
        catch (e) { updateRobin('❌ Нет доступа к микрофону', 3000); return false; }
    }

    function createPC() {
        if (pc) { pc.close(); pc = null; }
        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        if (stream) stream.getTracks().forEach(t => pc.addTrack(t, stream));
        pc.ontrack = e => { if (e.streams[0]) { const a = new Audio(); a.srcObject = e.streams[0]; a.play().catch(() => {}); } };
        pc.onicecandidate = e => { if (e.candidate) sendToPong({ action: 'send', text: '__ICE__' + JSON.stringify(e.candidate) }); };
        pc.onconnectionstatechange = () => {
            if (pc.connectionState === 'connected') { callActive = true; tStart = Date.now(); startTimer(); ui('active'); playSound('open.mp3'); showSafetyNumber(); }
            if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') hang(false);
        };
        return pc;
    }

    function showSafetyNumber() {
        const el = $('safety-number'); const code = $('safety-code');
        if (el && code && pc?.remoteDescription) {
            const fp = pc.remoteDescription.sdp.match(/a=fingerprint:sha-256\s+([A-F0-9:]+)/i);
            if (fp && fp[1]) { const nums = fp[1].replace(/[^0-9]/g, '').slice(0, 6); code.textContent = nums.slice(0, 3) + ' ' + nums.slice(3, 6); el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 8000); }
        }
    }

    function startTimer() { $('call-timer').style.display = ''; tInt = setInterval(() => { const e = Math.floor((Date.now() - tStart) / 1000); $('call-timer').textContent = Math.floor(e/60).toString().padStart(2,'0')+':'+(e%60).toString().padStart(2,'0'); }, 1000); }
    function stopTimer() { if (tInt) clearInterval(tInt); $('call-timer').style.display = 'none'; $('call-timer').textContent = '00:00'; }

    async function call() {
        if (!activeChannelId) { updateRobin('🏹 Сначала нужен колчан!', 3000); return; }
        if (!await getStream(false)) return;
        ui('calling'); createPC();
        try { const offer = await pc.createOffer(); await pc.setLocalDescription(offer); sendToPong({ action: 'send', text: '__OFFER__' + JSON.stringify(offer) }); playSound('Welk.mp3'); updateRobin('📯 Трублю в рог!', 3000); } catch (e) { hang(true); }
    }
    async function answer() {
        if (!offerReceived || !await getStream(false)) { ui('ready'); return; }
        ui('active'); createPC();
        try { await pc.setRemoteDescription(new RTCSessionDescription(offerReceived)); const ans = await pc.createAnswer(); await pc.setLocalDescription(ans); sendToPong({ action: 'send', text: '__ANSWER__' + JSON.stringify(ans) }); offerReceived = null; updateRobin('✅ На связи!', 3000); } catch (e) { hang(true); }
    }
    function hang(sig = true) {
        callActive = false; stopTimer();
        if (sig && activeChannelId) sendToPong({ action: 'send', text: '__HANGUP__' });
        if (pc) { pc.close(); pc = null; }
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        offerReceived = null; ui('ready'); playSound('exet.mp3');
    }

    function startVoiceRecording() {
        if (voiceRecording) return;
        navigator.mediaDevices.getUserMedia({ audio: true }).then(st => {
            voiceStream = st; voiceRecorder = new MediaRecorder(st, { mimeType: 'audio/webm', audioBitsPerSecond: 16000 }); voiceChunks = [];
            voiceRecorder.ondataavailable = e => voiceChunks.push(e.data);
            voiceRecorder.onstop = () => {
                const blob = new Blob(voiceChunks, { type: 'audio/webm' });
                if (blob.size > 100 && blob.size < 50000) { const reader = new FileReader(); reader.onload = () => sendToPong({ action: 'send', text: '__FILE__' + JSON.stringify({ type: 'audio', data: reader.result.split(',')[1], mime: 'audio/webm' }) }); reader.readAsDataURL(blob); }
                if (voiceStream) { voiceStream.getTracks().forEach(t => t.stop()); voiceStream = null; }
                voiceRecorder = null; voiceRecording = false; stopVoiceTimer(); $('btn-voice-main').style.background = '';
            };
            voiceRecorder.start(); voiceRecording = true; startVoiceTimer(); $('btn-voice-main').style.background = 'var(--danger)';
        }).catch(() => updateRobin('❌ Нет микрофона', 3000));
    }
    function stopVoiceRecording() { if (voiceRecorder?.state === 'recording') voiceRecorder.stop(); }
    function startVoiceTimer() { voiceSeconds = 0; $('voice-timer-overlay').style.display = 'block'; voiceTimerInterval = setInterval(() => { voiceSeconds++; $('voice-timer-overlay').textContent = '🎤 ' + Math.floor(voiceSeconds/60)+':'+(voiceSeconds%60).toString().padStart(2,'0'); if (voiceSeconds >= MAX_VOICE_DURATION) stopVoiceRecording(); }, 1000); }
    function stopVoiceTimer() { if (voiceTimerInterval) clearInterval(voiceTimerInterval); $('voice-timer-overlay').style.display = 'none'; }

    function showContextMenu(x, y, contact) {
        currentContextContact = contact;
        const menu = $('contact-context-menu');
        menu.classList.add('show');
        menu.style.left = Math.min(x, window.innerWidth - 240) + 'px';
        menu.style.top = Math.min(y, window.innerHeight - 200) + 'px';
    }

    async function loadContacts() {
        const list = $('contacts-list-inner');
        if (!list) return;
        try {
            const contacts = JSON.parse(localStorage.getItem('robinhood_contacts') || '[]');
            list.innerHTML = '';
            if (contacts.length === 0) { list.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:20px;">🏹 Пусто</div>'; return; }
            contacts.forEach(c => {
                const div = document.createElement('div'); div.className = 'contact-item';
                div.innerHTML = `<div class="contact-info"><span class="online-dot offline"></span><img src="${c.avatar || 'assets/avatars/001-.png'}" class="contact-avatar" onerror="this.src='assets/avatars/001-.png'"><span class="contact-name">${c.name || 'Лучник'}</span></div><button class="delete-contact" data-pubkey="${c.pubkey}">✖</button>`;
                let pressTimer;
                div.querySelector('.contact-info')?.addEventListener('pointerdown', e => { pressTimer = setTimeout(() => showContextMenu(e.clientX, e.clientY, c), 500); });
                div.querySelector('.contact-info')?.addEventListener('pointerup', () => clearTimeout(pressTimer));
                div.querySelector('.contact-info')?.addEventListener('click', () => { activeChannelId = c.pubkey; $('contacts-sheet').classList.remove('open'); $('overlay').classList.remove('show'); updateRobin('💬 Говорить с ' + c.name, 3000); });
                div.querySelector('.delete-contact')?.addEventListener('click', e => { e.stopPropagation(); if (confirm('Удалить контакт «' + c.name + '»?')) { const contacts = JSON.parse(localStorage.getItem('robinhood_contacts') || '[]').filter(co => co.pubkey !== c.pubkey); localStorage.setItem('robinhood_contacts', JSON.stringify(contacts)); loadContacts(); } });
                list.appendChild(div);
            });
        } catch (e) {}
    }

    // Обработка сообщений от P2PPong
    window.addEventListener('message', async (e) => {
        if (e.source !== pongFrame?.contentWindow) return;
        const d = e.data;
        switch (d.type) {
            case 'pong-ready': handshakeSecret = d.handshake; sendToPong({ action: 'handshake' }); connectionDot.className = 'connection-dot online'; connectionLabel.textContent = 'Готов'; updateRobin('🌐 Телеграф работает!', 3000); break;
            case 'handshake-ok': for (const m of pendingMessages) pongFrame.contentWindow.postMessage(m, '*'); pendingMessages = []; if (window._pendingRef) { const { id, key } = window._pendingRef; window._pendingRef = null; sendToPong({ action: 'accept', id, key }); } break;
            case 'session-created': $('ref-link-display').textContent = d.fullLink; $('ref-modal').classList.add('active'); navigator.clipboard.writeText(d.fullLink).catch(() => {}); updateRobin('✅ Колчан готов!', 5000); break;
            case 'channel-open': channels[d.channelId] = { secret: d.secret, role: d.role }; activeChannelId = d.channelId; ui('ready'); updateRobin('🏹 Колчан открыт!', 4000); $('ref-modal').classList.remove('active');
                // Сохраняем контакт
                try { const contacts = JSON.parse(localStorage.getItem('robinhood_contacts') || '[]'); if (!contacts.find(c => c.pubkey === d.channelId)) { contacts.push({ pubkey: d.channelId, name: 'Лучник', avatar: 'assets/avatars/001-.png', status: 'confirmed' }); localStorage.setItem('robinhood_contacts', JSON.stringify(contacts)); } } catch (er) {}
                break;
            case 'restored-channels': if (d.channels) d.channels.forEach(ch => { channels[ch.channelId] = { secret: ch.secret, role: ch.role }; if (!activeChannelId) activeChannelId = ch.channelId; }); updateRobin('🔄 Колчаны восстановлены!', 3000); break;
            case 'server-switched': currentServer = d.server || currentServer; updateRobin('🌐 Сервер: ' + currentServer, 2000); break;
            case 'message':
                if (!d.channelId || !d.text || !channels[d.channelId]) break;
                activeChannelId = d.channelId;
                if (d.text.startsWith('__OFFER__')) { offerReceived = JSON.parse(d.text.replace('__OFFER__', '')); ui('incoming'); playSound('melodi.mp3'); updateRobin('📯 Входящий звонок!', 0); }
                else if (d.text.startsWith('__ANSWER__') && pc) { pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(d.text.replace('__ANSWER__', '')))); callActive = true; tStart = Date.now(); startTimer(); ui('active'); }
                else if (d.text.startsWith('__ICE__') && pc) { try { pc.addIceCandidate(new RTCIceCandidate(JSON.parse(d.text.replace('__ICE__', '')))); } catch (er) {} }
                else if (d.text === '__HANGUP__') { if (callActive || pc) { updateRobin('📞 Разговор окончен', 3000); hang(false); } }
                else if (d.text.startsWith('__FILE__')) { try { const fd = JSON.parse(d.text.replace('__FILE__', '')); if (fd.mime === 'audio/webm') updateRobin('🎤 Голосовое получено', 3000); } catch (er) {} }
                break;
            case 'error': updateRobin('⚠ ' + (d.text || 'Ошибка'), 5000); break;
        }
    });

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    function setupEvents() {
        btnMainAction.addEventListener('click', () => { if (!activeChannelId) { const tk = crypto.randomUUID?.() || Math.random().toString(36).substring(2)+Date.now().toString(36); sendToPong({ action: 'create', tempKey: tk }); } else call(); });
        $('btn-arrow')?.addEventListener('click', () => { const tk = crypto.randomUUID?.() || Math.random().toString(36).substring(2)+Date.now().toString(36); sendToPong({ action: 'create', tempKey: tk }); });
        btnAnswer.addEventListener('click', answer);
        btnReject.addEventListener('click', () => { sendToPong({ action: 'send', text: '__HANGUP__' }); offerReceived = null; ui('ready'); });
        btnEndCall.addEventListener('click', () => hang(true));
        btnSpeaker.addEventListener('click', () => { spkOn = !spkOn; btnSpeaker.textContent = spkOn ? '🔊' : '🔇'; });
        btnMic.addEventListener('click', () => { if (stream) { micOn = !micOn; stream.getAudioTracks().forEach(t => t.enabled = micOn); btnMic.textContent = micOn ? '🎤' : '🔇'; } });
        $('btn-call-main')?.addEventListener('click', call);
        $('btn-voice-main')?.addEventListener('click', () => voiceRecording ? stopVoiceRecording() : startVoiceRecording());

        $('btn-copy-link')?.addEventListener('click', () => { const l = $('ref-link-display')?.textContent; if (l) navigator.clipboard.writeText(l).catch(() => {}); });
        $('btn-share-link')?.addEventListener('click', () => { const l = $('ref-link-display')?.textContent; if (l && navigator.share) navigator.share({ title: 'RobinCall', text: 'Звонок!', url: l }).catch(() => {}); });
        $('btn-close-ref-modal')?.addEventListener('click', () => $('ref-modal').classList.remove('active'));

        $('nick-label')?.addEventListener('click', () => { $('nick-input').value = $('nick-label').textContent; $('nick-modal').classList.add('active'); });
        $('btn-nick-save')?.addEventListener('click', () => { const n = $('nick-input').value.trim().substring(0, 12); if (n) { $('nick-label').textContent = n; localStorage.setItem('robinhood_nick', n); } $('nick-modal').classList.remove('active'); });
        $('btn-nick-cancel')?.addEventListener('click', () => $('nick-modal').classList.remove('active'));

        $('btn-settings-main')?.addEventListener('click', () => { const s = $('settings-sheet'); s.classList.toggle('open'); $('overlay').classList.toggle('show'); });
        $('settings-close')?.addEventListener('click', () => { $('settings-sheet').classList.remove('open'); $('overlay').classList.remove('show'); });
        $('setting-contacts')?.addEventListener('click', () => { $('settings-sheet').classList.remove('open'); loadContacts(); $('contacts-sheet').classList.add('open'); });
        $('contacts-close')?.addEventListener('click', () => { $('contacts-sheet').classList.remove('open'); $('overlay').classList.remove('show'); });
        $('overlay')?.addEventListener('click', () => { $('settings-sheet').classList.remove('open'); $('contacts-sheet').classList.remove('open'); $('ref-modal').classList.remove('active'); $('nick-modal').classList.remove('active'); $('contact-context-menu').classList.remove('show'); $('overlay').classList.remove('show'); });

        $('toggle-sound')?.addEventListener('change', function() { toggleSoundState = this.checked; localStorage.setItem('robinhood_sound', toggleSoundState); });
        $('toggle-peer-help')?.addEventListener('change', function() { peerHelpEnabled = this.checked; localStorage.setItem('sherwood_peer_help', peerHelpEnabled); $('seeding-indicator').style.display = peerHelpEnabled ? 'flex' : 'none'; });
        $('toggle-obfuscation')?.addEventListener('change', function() { obfuscationEnabled = this.checked; localStorage.setItem('robincall_obfuscation', obfuscationEnabled); });
        $('setting-theme')?.addEventListener('click', () => { const ts = THEMES.getThemes(); const ct = localStorage.getItem('robinhood_theme') || 'forest'; const i = ts.findIndex(t => t.id === ct); THEMES.apply(ts[(i+1)%ts.length].id, $('theme-icon'), $('theme-name')); });
        $('setting-clear')?.addEventListener('click', () => { if (confirm('⚠ Все данные будут удалены!')) { hang(true); channels = {}; activeChannelId = null; updateRobin('🚬 Всё сожжено!', 3000); } });

        // Контекстное меню
        $('ctx-rename')?.addEventListener('click', () => { $('contact-context-menu').classList.remove('show'); if (!currentContextContact) return; const name = prompt('Новое имя:', currentContextContact.name); if (name) { const contacts = JSON.parse(localStorage.getItem('robinhood_contacts') || '[]'); const c = contacts.find(c => c.pubkey === currentContextContact.pubkey); if (c) { c.name = name; localStorage.setItem('robinhood_contacts', JSON.stringify(contacts)); updateRobin('✏ Имя изменено!', 2000); loadContacts(); } } });
        $('ctx-fire-archer')?.addEventListener('click', () => { $('contact-context-menu').classList.remove('show'); if (currentContextContact && confirm('Уволить «' + currentContextContact.name + '»?')) { const contacts = JSON.parse(localStorage.getItem('robinhood_contacts') || '[]').filter(c => c.pubkey !== currentContextContact.pubkey); localStorage.setItem('robinhood_contacts', JSON.stringify(contacts)); loadContacts(); updateRobin('🔥 Уволен!', 3000); } });
        $('ctx-cancel')?.addEventListener('click', () => $('contact-context-menu').classList.remove('show'));
        document.addEventListener('click', e => { if (!$('contact-context-menu').contains(e.target)) $('contact-context-menu').classList.remove('show'); });

        window.addEventListener('online', () => { connectionDot.className = 'connection-dot online'; connectionLabel.textContent = 'Готов'; });
        window.addEventListener('offline', () => { connectionDot.className = 'connection-dot offline'; connectionLabel.textContent = 'Нет сети'; });
    }

    function initApp() {
        pongFrame = $('pong-frame'); robinText = $('robin-text'); callTimer = $('call-timer');
        connectionDot = $('connection-dot'); connectionLabel = $('connection-label');
        btnMainAction = $('btn-main-action'); btnAnswer = $('btn-answer'); btnReject = $('btn-reject');
        btnEndCall = $('btn-end-call'); btnSpeaker = $('btn-speaker'); btnMic = $('btn-mic');
        incomingRow = $('incoming-row'); activeRow = $('active-row');

        seedingIndicator = { update: (s) => { $('peer-count').textContent = s.peers || 0; } };

        THEMES.apply(localStorage.getItem('robinhood_theme') || 'forest', $('theme-icon'), $('theme-name'));
        pongFrame.src = P2PPONG_URL + '?v=' + Date.now();

        const savedNick = localStorage.getItem('robinhood_nick');
        if (savedNick) $('nick-label').textContent = savedNick.substring(0, 12);
        const savedAvatar = localStorage.getItem('robinhood_avatar');
        if (savedAvatar) { $('profile-avatar-small').src = savedAvatar; $('robin-avatar').src = savedAvatar; }

        const urlParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.replace('#', ''));
        const refId = urlParams.get('id');
        const refKey = hashParams.get('key') || urlParams.get('key');
        if (refId && refKey) window._pendingRef = { id: refId, key: refKey };

        peerHelpEnabled = localStorage.getItem('sherwood_peer_help') !== 'false';
        $('toggle-peer-help').checked = peerHelpEnabled;
        if (peerHelpEnabled) $('seeding-indicator').style.display = 'flex';

        setupEvents();
        ui('idle');
        updateRobin('Рог готов!', 0);

        // Листья
        setInterval(() => { if (document.querySelectorAll('.forest-particle').length > 3) return; const leaf = document.createElement('div'); leaf.className = 'forest-particle'; leaf.textContent = ['🍂','🍁','🌿','🍃'][Math.floor(Math.random()*4)]; leaf.style.left = Math.random()*100+'%'; leaf.style.animationDuration = (14+Math.random()*12)+'s'; document.body.appendChild(leaf); setTimeout(() => leaf.remove(), 26000); }, 8000);

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    initApp();
})();
</script>
