<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RobinCall 🏹</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/phone-go.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', 'Inter', 'Georgia', serif; }
        body {
            background: linear-gradient(135deg, #1a2a1f 0%, #0d1a0c 100%);
            color: #e8e2c7;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100dvh; position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://stepweather-prog.github.io/ROBINHOOD-P2P/assets/background.webp');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 0; opacity: 0.3;
        }
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(30,40,25,0.6), rgba(10,20,8,0.9));
            z-index: 0;
        }
        .container { position: relative; z-index: 1; text-align: center; padding: 20px; }
        h1 {
            font-size: 2em;
            background: linear-gradient(135deg, #e8d5a3, #c4a24b);
            -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 10px;
        }
        .status { color: #b8a87a; font-size: 1em; margin: 15px 0; min-height: 30px; }
        .btn {
            width: 120px; height: 120px; border-radius: 50%; border: 3px solid #c4a24b;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            margin: 20px auto; transition: all 0.3s;
            background: rgba(196, 162, 75, 0.15); padding: 20px;
        }
        .btn:hover { background: rgba(196, 162, 75, 0.35); box-shadow: 0 0 30px rgba(196, 162, 75, 0.4); transform: scale(1.1); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn:disabled:hover { background: rgba(196, 162, 75, 0.15); box-shadow: none; transform: none; }
        .btn img { width: 70px; height: 70px; object-fit: contain; }
        .hidden { display: none !important; }
        .controls { display: flex; gap: 30px; justify-content: center; margin-top: 20px; }
        .ripple { animation: ripple 1.5s infinite; }
        @keyframes ripple {
            0% { box-shadow: 0 0 0 0 rgba(196, 162, 75, 0.5); }
            70% { box-shadow: 0 0 0 30px rgba(196, 162, 75, 0); }
            100% { box-shadow: 0 0 0 0 rgba(196, 162, 75, 0); }
        }
        .debug { color: #666; font-size: 0.7em; margin-top: 30px; word-break: break-all; max-width: 300px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏹 RobinCall</h1>
        <div class="status" id="status">Ожидание...</div>
        <button class="btn hidden" id="btn-call" title="Позвонить"><img src="assets/phone-go.png" alt="Вызов"></button>
        <div class="controls hidden" id="incoming-controls">
            <button class="btn" id="btn-answer" title="Принять"><img src="assets/phone-go.png" alt="Принять"></button>
            <button class="btn" id="btn-reject" title="Отклонить"><img src="assets/phone-stop.png" alt="Отклонить"></button>
        </div>
        <div class="controls hidden" id="active-controls">
            <button class="btn ripple" id="btn-hangup" title="Завершить"><img src="assets/phone-stop.png" alt="Завершить"></button>
        </div>
        <div class="debug" id="debug"></div>
    </div>
    <iframe id="pong-frame" src="" style="display:none;" title="p2p engine"></iframe>
    <script>
        (function() {
            const statusDiv = document.getElementById('status');
            const debugDiv = document.getElementById('debug');
            const btnCall = document.getElementById('btn-call');
            const btnHangup = document.getElementById('btn-hangup');
            const btnAnswer = document.getElementById('btn-answer');
            const btnReject = document.getElementById('btn-reject');
            const incomingControls = document.getElementById('incoming-controls');
            const activeControls = document.getElementById('active-controls');
            const pongFrame = document.getElementById('pong-frame');

            const iceServers = [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
                { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
            ];

            let peerConnection = null, localStream = null, handshakeSecret = null;
            let channelId = null, sessionSecret = null, callActive = false;

            async function getLocalStream() {
                try { localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false }); return true; }
                catch (e) { log('Ошибка микрофона: ' + e.message); statusDiv.textContent = '❌ Нет доступа к микрофону'; return false; }
            }

            function createPeerConnection() {
                peerConnection = new RTCPeerConnection({ iceServers });
                if (localStream) localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
                peerConnection.ontrack = (e) => { const a = new Audio(); a.srcObject = e.streams[0]; a.play().catch(() => {}); };
                peerConnection.onicecandidate = (e) => { if (e.candidate && peerConnection.remoteDescription) { sendToPong({ action: 'send', text: '__ICE__' + JSON.stringify(e.candidate), channelId }); } };
                peerConnection.oniceconnectionstatechange = () => {
                    if (peerConnection.iceConnectionState === 'connected' || peerConnection.iceConnectionState === 'completed') statusDiv.textContent = '✅ Связь установлена';
                    if (peerConnection.iceConnectionState === 'disconnected' || peerConnection.iceConnectionState === 'failed') { statusDiv.textContent = '❌ Связь потеряна'; hangup(); }
                };
            }

            async function startCall() {
                if (callActive) return;
                statusDiv.textContent = '📞 Вызов...'; btnCall.classList.add('hidden'); activeControls.classList.remove('hidden');
                if (!await getLocalStream()) return;
                createPeerConnection();
                const offer = await peerConnection.createOffer(); await peerConnection.setLocalDescription(offer);
                sendToPong({ action: 'send', text: '__OFFER__' + JSON.stringify(offer), channelId }); callActive = true; log('Offer отправлен');
            }

            async function acceptCall() {
                if (callActive) return;
                statusDiv.textContent = '📞 Соединение...'; incomingControls.classList.add('hidden'); activeControls.classList.remove('hidden');
                if (!await getLocalStream()) return;
                createPeerConnection(); callActive = true;
            }

            function hangup() {
                callActive = false; statusDiv.textContent = '📞 Звонок завершён';
                activeControls.classList.add('hidden'); incomingControls.classList.add('hidden'); btnCall.classList.remove('hidden');
                sendToPong({ action: 'send', text: '__HANGUP__', channelId });
                if (peerConnection) { peerConnection.close(); peerConnection = null; }
                if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            }

            function sendToPong(msg) {
                if (sessionSecret) msg.secret = sessionSecret;
                if (channelId) msg.channelId = channelId;
                if (handshakeSecret && msg.action === 'handshake') msg.handshake = handshakeSecret;
                if (pongFrame.contentWindow) pongFrame.contentWindow.postMessage(msg, '*');
            }

            window.addEventListener('message', async (event) => {
                if (event.source !== pongFrame.contentWindow) return;
                const data = event.data;
                switch (data.type) {
                    case 'pong-ready': handshakeSecret = data.handshake; sendToPong({ action: 'handshake' }); statusDiv.textContent = '🏹 Готов к вызову'; btnCall.classList.remove('hidden'); break;
                    case 'channel-open': channelId = data.channelId; sessionSecret = data.secret; log('Канал открыт: ' + channelId); break;
                    case 'message':
                        if (!data.text || typeof data.text !== 'string') return;
                        if (data.text.startsWith('__OFFER__')) {
                            if (callActive) return;
                            const offer = JSON.parse(data.text.replace('__OFFER__', ''));
                            statusDiv.textContent = '📞 Входящий вызов...'; btnCall.classList.add('hidden'); incomingControls.classList.remove('hidden');
                            await acceptCall();
                            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                            const answer = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answer);
                            sendToPong({ action: 'send', text: '__ANSWER__' + JSON.stringify(answer), channelId }); log('Answer отправлен'); return;
                        }
                        if (data.text.startsWith('__ANSWER__')) { const answer = JSON.parse(data.text.replace('__ANSWER__', '')); if (peerConnection) peerConnection.setRemoteDescription(new RTCSessionDescription(answer)); log('Answer получен'); return; }
                        if (data.text.startsWith('__ICE__')) { const candidate = JSON.parse(data.text.replace('__ICE__', '')); if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) { peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => {}); } return; }
                        if (data.text === '__HANGUP__') { statusDiv.textContent = '📞 Собеседник завершил звонок'; hangup(); return; }
                        break;
                }
            });

            btnCall.addEventListener('click', startCall);
            btnHangup.addEventListener('click', hangup);
            btnAnswer.addEventListener('click', async () => { await startCall(); });
            btnReject.addEventListener('click', () => { sendToPong({ action: 'send', text: '__HANGUP__', channelId }); hangup(); });

            function log(msg) { console.log('[RobinCall]', msg); debugDiv.textContent += msg + '\n'; debugDiv.scrollTop = debugDiv.scrollHeight; }

            function getParams() { const p = new URLSearchParams(window.location.search); return { channel: p.get('channel'), secret: p.get('secret') }; }

            async function init() {
                const params = getParams(); channelId = params.channel; sessionSecret = params.secret;
                pongFrame.src = 'https://stepweather-prog.github.io/P2PPong/?v=' + Date.now();
                statusDiv.textContent = '🏹 Пробуждение...'; log('Канал: ' + (channelId || 'ожидание'));
            }
            window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
