<script>
// ========== CRYPTO ==========
const CRYPTO = (() => {
    const KEY_NAME = 'robincall_key_v2';
    let key = null;
    async function sha256(t) { const d = new TextEncoder().encode(t); const h = await crypto.subtle.digest('SHA-256', d); return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join(''); }
    async function getKey() { if (key) return key; let raw = sessionStorage.getItem(KEY_NAME); if (raw) { const b = Uint8Array.from(atob(raw), c => c.charCodeAt(0)); key = await crypto.subtle.importKey('raw', b, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']); return key; } try { const db = await new Promise((r, j) => { const req = indexedDB.open('RobinCallSecure', 1); req.onupgradeneeded = () => req.result.createObjectStore('keys', { keyPath: 'id' }); req.onsuccess = () => r(req.result); req.onerror = () => j(req.error); }); const result = await new Promise(r => { const req = db.transaction('keys','readonly').objectStore('keys').get(KEY_NAME); req.onsuccess = () => r(req.result); req.onerror = () => r(null); }); if (result) { const b = Uint8Array.from(atob(result.value), c => c.charCodeAt(0)); key = await crypto.subtle.importKey('raw', b, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']); sessionStorage.setItem(KEY_NAME, result.value); return key; } } catch (e) {} key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']); const exported = await crypto.subtle.exportKey('raw', key); raw = btoa(String.fromCharCode(...new Uint8Array(exported))); sessionStorage.setItem(KEY_NAME, raw); try { const db = await new Promise((r, j) => { const req = indexedDB.open('RobinCallSecure', 1); req.onsuccess = () => r(req.result); req.onerror = () => j(req.error); }); const tx = db.transaction('keys', 'readwrite'); tx.objectStore('keys').put({ id: KEY_NAME, value: raw }); } catch (e) {} return key; }
    async function encrypt(text) { try { const k = await getKey(); const iv = crypto.getRandomValues(new Uint8Array(12)); const enc = new TextEncoder().encode(text); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, enc); const combined = new Uint8Array(iv.length + new Uint8Array(ct).length); combined.set(iv); combined.set(new Uint8Array(ct), iv.length); return '🔐' + btoa(String.fromCharCode(...combined)); } catch (e) { return text; } }
    async function decrypt(text) { if (!text || !text.startsWith('🔐')) return text; try { const k = await getKey(); const combined = Uint8Array.from(atob(text.slice(2)), c => c.charCodeAt(0)); const iv = combined.slice(0, 12); const ct = combined.slice(12); const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, k, ct); return new TextDecoder().decode(dec); } catch (e) { return text; } }
    return { sha256, getKey, encrypt, decrypt, setKey: (k) => { key = k; } };
})();

// ========== THEMES ==========
const THEMES = (() => {
    const themes = [{ id: 'forest', icon: '🌲', name: 'Лес' }, { id: 'sunset', icon: '🌅', name: 'Закат' }, { id: 'ocean', icon: '🌊', name: 'Океан' }, { id: 'night-ember', icon: '🔥', name: 'Костёр' }, { id: 'morning-mist', icon: '🌫️', name: 'Туман' }];
    return { getThemes: () => themes, apply: (id, iEl, nEl) => { document.documentElement.setAttribute('data-theme', id); localStorage.setItem('robinhood_theme', id); const t = themes.find(t => t.id === id) || themes[0]; if (iEl) iEl.textContent = t.icon; if (nEl) nEl.textContent = t.name; } };
})();

// ========== ОСНОВНОЙ КОД ==========
(function() {

    async function initApp() {

        toggleSound.addEventListener('change', () => { toggleSoundState = toggleSound.checked; localStorage.setItem('robinhood_sound', toggleSoundState); });
