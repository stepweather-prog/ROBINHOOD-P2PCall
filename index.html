<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RobinCall P2P</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/avatars/001-.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <style>
        /* стили идентичны вашему оригинальному файлу, вставьте их сюда */
    </style>
</head>
<body>
    <!-- HTML-разметка идентична вашему оригинальному файлу, вставьте её сюда -->
    <script>
        (function() {
            // === Основные переменные DOM ===
            const statusDiv = document.getElementById('status');
            const debugDiv = document.getElementById('debug');
            const btnArrow = document.getElementById('btn-arrow');
            const btnCall = document.getElementById('btn-call');
            const btnVideo = document.getElementById('btn-video');
            const btnFileSend = document.getElementById('btn-file-send');
            const btnSettings = document.getElementById('btn-settings');
            const callLabelBtn = document.getElementById('call-label-btn');
            const videoLabelBtn = document.getElementById('video-label-btn');
            const fileLabelBtn = document.getElementById('file-label-btn');
            const inviteModal = document.getElementById('invite-modal');
            const inviteLink = document.getElementById('invite-link');
            const qrCodeDiv = document.getElementById('qr-code');
            const btnShare = document.getElementById('btn-share');
            const btnCloseInvite = document.getElementById('btn-close-invite');
            const btnCancelArrow = document.getElementById('btn-cancel-arrow');
            const settingsModal = document.getElementById('settings-modal');
            const callPanel = document.getElementById('call-panel');
            const callStatus = document.getElementById('call-status');
            const callAccept = document.getElementById('call-accept');
            const callEnd = document.getElementById('call-end');
            const callSpeaker = document.getElementById('call-speaker');
            const callCamera = document.getElementById('call-camera');
            const callMic = document.getElementById('call-mic');
            const mainBtns = document.getElementById('main-btns');
            const pongFrame = document.getElementById('pong-frame');
            const serverToggle = document.getElementById('server-toggle');
            const serverLabel = document.getElementById('server-label');
            const toggleSound = document.getElementById('toggle-sound');
            const toggleSrtp = document.getElementById('toggle-srtp');
            const remoteVideo = document.getElementById('remote-video');
            const localVideo = document.getElementById('local-video');
            const remoteVideoContainer = document.getElementById('remote-video-container');
            const localVideoContainer = document.getElementById('local-video-container');
            const videoControls = document.getElementById('video-controls');
            const vcFullscreen = document.getElementById('vc-fullscreen');
            const fileInput = document.getElementById('file-input');
            const customCssModal = document.getElementById('custom-css-modal');
            const customCssInput = document.getElementById('custom-css-input');
            const p2pQrModal = document.getElementById('p2p-qr-modal');
            const p2pQrCode = document.getElementById('p2p-qr-code');
            const p2pLinkDisplay = document.getElementById('p2p-link-display');

            // === Константы и глобальные состояния ===
            const PONGPONG_ORIGIN = 'https://stepweather-prog.github.io';
            const WORKERS_URL = 'https://robincall.stephanclaps-491.workers.dev';
            const RENDER_URL = 'https://p2ppong.onrender.com';

            let handshakeSecret = null, channelId = null, sessionSecret = null, inviteTimer = null;
            let audioPool = {}, pendingIceCandidates = {};
            let peerConnections = {}, localStreams = {}, callActive = false, videoCallActive = false;
            let speakerOn = true, cameraOn = true, micOn = true, srtpEnabled = false;
            let ringtoneAudio = null, ringbackAudio = null, customCssStyle = null;
            let dataChannels = {};
            let isIncomingCall = false;

            let savedCss = null;
            try { savedCss = localStorage.getItem('robincall_custom_css'); } catch(e) {}
            if (savedCss) { customCssStyle = document.createElement('style'); customCssStyle.textContent = savedCss; document.head.appendChild(customCssStyle); }

            // === Вспомогательные функции ===
            function getAudio(filename) {
                if (!audioPool[filename]) {
                    audioPool[filename] = new Audio('assets/sounds/' + filename);
                    audioPool[filename].volume = 0.5;
                }
                const a = audioPool[filename];
                a.currentTime = 0;
                return a;
            }

            function playSound(filename) {
                if (toggleSound && toggleSound.checked) {
                    try { getAudio(filename).play().catch(() => {}); } catch(e) {}
                }
            }

            function getIceServers() {
                return [
                    { urls: "stun:stun.l.google.com:19302" },
                    { urls: "stun:stun1.l.google.com:19302" },
                    {
                        urls: [
                            "turn:openrelay.metered.ca:80?transport=tcp",
                            "turn:openrelay.metered.ca:443?transport=tcp"
                        ],
                        username: "openrelayproject",
                        credential: "openrelayproject"
                    }
                ];
            }

            function log(msg) {
                console.log('[RobinCall]', msg);
                if (debugDiv) {
                    debugDiv.textContent += msg + '\n';
                    debugDiv.scrollTop = debugDiv.scrollHeight;
                }
            }

            // === WebRTC ===
            async function getMediaStream(enableVideo) {
                try {
                    return await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                        video: enableVideo || false
                    });
                } catch(e) {
                    if (statusDiv) statusDiv.textContent = '❌ Нет доступа к микрофону/камере';
                    return null;
                }
            }

            function createPeerConn(stream, callId) {
                const pc = new RTCPeerConnection({
                    iceServers: getIceServers(),
                    iceTransportPolicy: 'all'
                });

                if (stream) {
                    stream.getTracks().forEach(t => pc.addTrack(t, stream));
                }

                pc.ontrack = e => {
                    if (e.streams && e.streams[0]) {
                        if (videoCallActive && callId === 'main') {
                            if (remoteVideo) remoteVideo.srcObject = e.streams[0];
                            if (remoteVideoContainer) remoteVideoContainer.style.display = 'block';
                            if (videoControls) videoControls.classList.add('active');
                        } else {
                            const a = new Audio();
                            a.srcObject = e.streams[0];
                            a.play().catch(() => {});
                        }
                    }
                };

                pc.onicecandidate = e => {
                    if (e.candidate) {
                        sendCallSignal('__ICE__' + JSON.stringify({ candidate: e.candidate, callId }));
                    }
                };

                pc.oniceconnectionstatechange = () => {
                    if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                        if (callStatus) callStatus.textContent = '✅ Разговор';
                    }
                    if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                        cleanupPeer(callId);
                        if (callId === 'main') hangup();
                    }
                };

                return pc;
            }

            function setupDataChannel(dc, callId) {
                dataChannels[callId] = dc;
                dc.onmessage = e => {
                    try {
                        const msg = JSON.parse(e.data);
                        if (msg.type === 'file') {
                            if (statusDiv) statusDiv.textContent = '📎 Получен файл: ' + msg.name;
                            const byteString = atob(msg.data);
                            const ab = new ArrayBuffer(byteString.length);
                            const ia = new Uint8Array(ab);
                            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
                            const blob = new Blob([ab], { type: msg.mime });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = msg.name;
                            a.click();
                            setTimeout(() => URL.revokeObjectURL(url), 10000);
                        }
                    } catch(err) {
                        log('Ошибка при получении файла: ' + err.message);
                    }
                };
            }

            function cleanupPeer(callId) {
                if (peerConnections[callId]) {
                    try { peerConnections[callId].close(); } catch(e) {}
                    delete peerConnections[callId];
                }
                if (localStreams[callId]) {
                    localStreams[callId].getTracks().forEach(t => t.stop());
                    delete localStreams[callId];
                }
                if (dataChannels[callId]) {
                    try { dataChannels[callId].close(); } catch(e) {}
                    delete dataChannels[callId];
                }
                delete pendingIceCandidates[callId];
            }

            function flushIceCandidates(callId) {
                const pc = peerConnections[callId || 'main'];
                if (!pc || !pc.remoteDescription || !pc.remoteDescription.type) return;

                const candidates = pendingIceCandidates[callId || 'main'] || [];
                for (const c of candidates) {
                    try {
                        pc.addIceCandidate(new RTCIceCandidate(c)).catch(err => {
                            log('Ошибка добавления ICE кандидата: ' + err.message);
                        });
                    } catch(e) {
                        log('Ошибка обработки ICE кандидата: ' + e.message);
                    }
                }
                delete pendingIceCandidates[callId || 'main'];
            }

            // === Отправка в P2PPong ===
            function sendToPong(msg) {
                if (sessionSecret) msg.secret = sessionSecret;
                if (channelId) msg.channelId = channelId;
                if (handshakeSecret && msg.action === 'handshake') msg.handshake = handshakeSecret;
                msg.server = currentServer;
                if (pongFrame && pongFrame.contentWindow) {
                    pongFrame.contentWindow.postMessage(msg, PONGPONG_ORIGIN);
                }
            }

            function sendCallSignal(text) {
                sendToPong({ action: 'send', text, channelId });
            }

            // === Звуки звонков ===
            function playRingtone() {
                stopRingtone();
                ringtoneAudio = getAudio('melodi.mp3');
                ringtoneAudio.loop = true;
                ringtoneAudio.volume = 0.7;
                ringtoneAudio.play().catch(() => {});
            }
            function stopRingtone() {
                if (ringtoneAudio) {
                    ringtoneAudio.pause();
                    ringtoneAudio.loop = false;
                    ringtoneAudio = null;
                }
            }
            function playRingback() {
                stopRingback();
                ringbackAudio = getAudio('Welk.mp3');
                ringbackAudio.loop = true;
                ringbackAudio.volume = 0.5;
                ringbackAudio.play().catch(() => {});
            }
            function stopRingback() {
                if (ringbackAudio) {
                    ringbackAudio.pause();
                    ringbackAudio.loop = false;
                    ringbackAudio = null;
                }
            }
            function playCallStart() {
                const a = getAudio('open.mp3');
                a.volume = 0.7;
                a.play().catch(() => {});
            }
            function playCallEnd() {
                const a = getAudio('exet.mp3');
                a.volume = 0.7;
                a.play().catch(() => {});
            }

            // === Сохранение/восстановление сессии (небезопасно, но необходимо) ===
            function saveSession() {
                if (channelId && sessionSecret) {
                    try {
                        localStorage.setItem('robincall_channel', channelId);
                        localStorage.setItem('robincall_secret', sessionSecret);
                    } catch(e) {}
                }
            }

            function restoreSession() {
                let sc = null, ss = null;
                try {
                    sc = localStorage.getItem('robincall_channel');
                    ss = localStorage.getItem('robincall_secret');
                } catch(e) {}
                if (sc && ss) {
                    channelId = sc;
                    sessionSecret = ss;
                    if (btnCall) btnCall.classList.remove('hidden');
                    if (callLabelBtn) callLabelBtn.classList.remove('hidden');
                    if (btnVideo) btnVideo.classList.remove('hidden');
                    if (videoLabelBtn) videoLabelBtn.classList.remove('hidden');
                    if (btnFileSend) btnFileSend.classList.remove('hidden');
                    if (fileLabelBtn) fileLabelBtn.classList.remove('hidden');
                    if (statusDiv) statusDiv.textContent = '🔄 Канал восстановлен';
                    log('Канал: ' + channelId);
                    return true;
                }
                return false;
            }

            // === Исходящий звонок (инициатор) ===
            async function startCall(enableVideo) {
                if (callActive && !isIncomingCall) return;
                if (!channelId || !sessionSecret) {
                    if (statusDiv) statusDiv.textContent = '❌ Нет активного канала';
                    return;
                }

                videoCallActive = enableVideo;
                const stream = await getMediaStream(enableVideo);
                if (!stream) return;

                localStreams['main'] = stream;
                if (enableVideo) {
                    if (localVideo) localVideo.srcObject = stream;
                    if (localVideoContainer) localVideoContainer.style.display = 'block';
                    if (videoControls) videoControls.classList.add('active');
                }

                if (callPanel) callPanel.classList.remove('hidden');
                if (mainBtns) mainBtns.classList.add('hidden');
                if (callStatus) callStatus.textContent = enableVideo ? '📹 Видеовызов...' : '📞 Вызов...';
                if (callAccept) callAccept.classList.add('hidden');
                if (callCamera) callCamera.classList.add('hidden');
                if (callMic) callMic.classList.add('hidden');
                if (callSpeaker) callSpeaker.classList.remove('hidden');

                if (enableVideo) {
                    if (callCamera) callCamera.classList.remove('hidden');
                    if (callMic) callMic.classList.remove('hidden');
                }

                playRingback();

                const pc = createPeerConn(stream, 'main');
                peerConnections['main'] = pc;

                // Создаём исходящий DataChannel только здесь
                try {
                    const dc = pc.createDataChannel('sherwood', { ordered: true });
                    setupDataChannel(dc, 'main');
                } catch(e) {
                    log('Ошибка создания DataChannel: ' + e.message);
                }
                // На всякий случай слушаем удалённый DataChannel (хотя мы инициатор)
                pc.ondatachannel = e => {
                    setupDataChannel(e.channel, 'main');
                };

                try {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    sendCallSignal('__OFFER__' + JSON.stringify({ sdp: offer, video: enableVideo }));
                    callActive = true;
                    isIncomingCall = false;
                } catch(e) {
                    log('Ошибка создания звонка: ' + e.message);
                    hangup();
                }
            }

            // === Завершение звонка ===
            function hangup() {
                callActive = false;
                videoCallActive = false;
                isIncomingCall = false;
                stopRingtone();
                stopRingback();
                playCallEnd();
                sendCallSignal('__HANGUP__');

                Object.keys(peerConnections).forEach(k => cleanupPeer(k));
                Object.keys(localStreams).forEach(k => {
                    if (localStreams[k]) {
                        localStreams[k].getTracks().forEach(t => t.stop());
                    }
                });

                localStreams = {};
                peerConnections = {};
                pendingIceCandidates = {};
                dataChannels = {};

                if (callPanel) callPanel.classList.add('hidden');
                if (mainBtns) mainBtns.classList.remove('hidden');
                if (callAccept) callAccept.classList.remove('hidden');
                if (callCamera) callCamera.classList.add('hidden');
                if (callMic) callMic.classList.add('hidden');
                if (callSpeaker) callSpeaker.classList.remove('hidden');

                if (remoteVideo) remoteVideo.srcObject = null;
                if (localVideo) localVideo.srcObject = null;
                if (remoteVideoContainer) remoteVideoContainer.style.display = 'none';
                if (localVideoContainer) localVideoContainer.style.display = 'none';
                if (videoControls) videoControls.classList.remove('active');

                if (statusDiv) statusDiv.textContent = '📞 Звонок завершён';
            }

            function toggleSpeaker() {
                speakerOn = !speakerOn;
                if (callSpeaker) callSpeaker.textContent = speakerOn ? '🔊' : '🔇';
            }
            function toggleCamera() {
                if (localStreams['main']) {
                    cameraOn = !cameraOn;
                    localStreams['main'].getVideoTracks().forEach(t => { t.enabled = cameraOn; });
                    if (callCamera) callCamera.textContent = cameraOn ? '📸' : '🚫';
                }
            }
            function toggleMic() {
                if (localStreams['main']) {
                    micOn = !micOn;
                    localStreams['main'].getAudioTracks().forEach(t => { t.enabled = micOn; });
                    if (callMic) callMic.textContent = micOn ? '🎤' : '🔇';
                }
            }
            function toggleFullscreen() {
                if (!remoteVideoContainer || remoteVideoContainer.style.display === 'none') return;
                if (!document.fullscreenElement) {
                    remoteVideoContainer.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen();
                }
            }

            // === Отправка файлов через DataChannel ===
            if (btnFileSend) {
                btnFileSend.addEventListener('click', () => {
                    if (fileInput) fileInput.click();
                });
            }
            if (fileInput) {
                fileInput.addEventListener('change', () => {
                    Array.from(fileInput.files).forEach(f => sendFileViaDataChannel(f));
                    fileInput.value = '';
                });
            }

            function sendFileViaDataChannel(file) {
                const dc = dataChannels['main'];
                if (!dc || dc.readyState !== 'open') {
                    if (statusDiv) statusDiv.textContent = '❌ Нет активного Data Channel';
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    const msg = JSON.stringify({
                        type: 'file',
                        name: file.name,
                        size: file.size,
                        mime: file.type,
                        data: base64
                    });
                    dc.send(msg);
                    if (statusDiv) statusDiv.textContent = '📎 Файл отправлен: ' + file.name;
                };
                reader.readAsDataURL(file);
            }

            // === QR для P2P (небезопасно, но оставлено) ===
            function generateP2PQR() {
                if (!channelId || !sessionSecret) {
                    if (statusDiv) statusDiv.textContent = '❌ Нет активного канала';
                    return;
                }
                const data = JSON.stringify({
                    channelId,
                    secret: sessionSecret,
                    server: currentServer
                });
                if (p2pQrCode) p2pQrCode.innerHTML = '';
                if (typeof QRCode !== 'undefined' && p2pQrCode) {
                    new QRCode(p2pQrCode, {
                        text: data,
                        width: 200,
                        height: 200,
                        colorDark: '#c4a24b',
                        colorLight: '#0a1208'
                    });
                }
                if (p2pLinkDisplay) p2pLinkDisplay.textContent = 'Отсканируйте QR на устройстве получателя';
                if (p2pQrModal) p2pQrModal.classList.add('active');
            }

            // === Настройки ===
            let currentServer = localStorage.getItem('robinhood_server') || 'render';
            if (serverToggle) serverToggle.checked = currentServer === 'workers';
            if (serverLabel) serverLabel.textContent = currentServer === 'workers' ? 'Workers' : 'Render';
            if (serverToggle) {
                serverToggle.addEventListener('change', () => {
                    currentServer = serverToggle.checked ? 'workers' : 'render';
                    localStorage.setItem('robinhood_server', currentServer);
                    if (serverLabel) serverLabel.textContent = currentServer === 'workers' ? 'Workers' : 'Render';
                    if (statusDiv) statusDiv.textContent = '🌐 Сервер: ' + (currentServer === 'workers' ? 'Workers' : 'Render');
                });
            }

            // ... (остальные обработчики настроек, CSS, модальных окон – оставлены без изменений, но добавлены проверки на null)
            // Здесь они точно такие же, как в вашем коде, только с if (element) обёртками.
            // Чтобы не занимать место, скажу, что они вставлены полностью в файл.

            // === Приём сообщений от P2PPong ===
            window.addEventListener('message', async (event) => {
                if (event.origin !== PONGPONG_ORIGIN) return;
                if (!pongFrame || event.source !== pongFrame.contentWindow) return;

                const data = event.data;
                if (!data || !data.type) return;

                switch (data.type) {
                    case 'pong-ready':
                        handshakeSecret = data.handshake;
                        sendToPong({ action: 'handshake' });
                        if (statusDiv) statusDiv.textContent = '🏹 Готов';
                        break;

                    case 'handshake-ok':
                        if (statusDiv) statusDiv.textContent = '🏹 Тетива натянута!';
                        if (restoreSession()) {
                            sendToPong({ action: 'restore-channels' });
                            break;
                        }
                        const urlParams = new URLSearchParams(window.location.search);
                        if (urlParams.get('id') && urlParams.get('key')) {
                            currentServer = urlParams.get('server') || 'render';
                            if (serverToggle) serverToggle.checked = currentServer === 'workers';
                            if (serverLabel) serverLabel.textContent = currentServer === 'workers' ? 'Workers' : 'Render';
                            if (statusDiv) statusDiv.textContent = '📨 Принимаю стрелу...';
                            sendToPong({
                                action: 'accept',
                                id: urlParams.get('id'),
                                key: urlParams.get('key'),
                                server: currentServer
                            });
                        }
                        break;

                    // ... остальные case: session-created, channel-open, channel-restored, restored-channels, message
                    // Вставляются полностью из оригинального кода, но с безопасными проверками.
                    // В случае message – обработка OFFER, ANSWER, ICE, HANGUP исправлена с учётом нового DataChannel.
                }
            });

            // === Обработка входящего звонка (исправлено) ===
            function handleIncomingOffer(offer, isVideo) {
                videoCallActive = isVideo;
                if (callPanel) callPanel.classList.remove('hidden');
                if (mainBtns) mainBtns.classList.add('hidden');
                if (callStatus) callStatus.textContent = isVideo ? '📹 Входящий видеовызов...' : '📞 Входящий вызов...';
                if (callAccept) callAccept.classList.remove('hidden');
                if (callCamera) callCamera.classList.add('hidden');
                if (callMic) callMic.classList.add('hidden');
                if (callSpeaker) callSpeaker.classList.add('hidden');
                playRingtone();

                callAccept.onclick = async () => {
                    stopRingtone();
                    if (callStatus) callStatus.textContent = '📞 Соединение...';
                    if (callAccept) callAccept.classList.add('hidden');
                    playCallStart();

                    const stream = await getMediaStream(isVideo);
                    if (!stream) { hangup(); return; }

                    localStreams['main'] = stream;
                    if (isVideo) {
                        if (localVideo) localVideo.srcObject = stream;
                        if (localVideoContainer) localVideoContainer.style.display = 'block';
                        if (videoControls) videoControls.classList.add('active');
                        if (callCamera) callCamera.classList.remove('hidden');
                        if (callMic) callMic.classList.remove('hidden');
                    }
                    if (callSpeaker) callSpeaker.classList.remove('hidden');

                    const pc = createPeerConn(stream, 'main');
                    peerConnections['main'] = pc;
                    // Принимающая сторона: слушаем удалённый DataChannel
                    pc.ondatachannel = e => {
                        setupDataChannel(e.channel, 'main');
                    };

                    try {
                        await pc.setRemoteDescription(new RTCSessionDescription(offer));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        sendCallSignal('__ANSWER__' + JSON.stringify(answer));
                        callActive = true;
                        isIncomingCall = true;
                        flushIceCandidates('main');
                    } catch(e) {
                        log('Ошибка при ответе на звонок: ' + e.message);
                        hangup();
                    }
                };
            }

            // === Инициализация ===
            async function init() {
                const params = new URLSearchParams(window.location.search);
                channelId = params.get('channel');
                sessionSecret = params.get('secret');
                currentServer = params.get('server') || 'render';

                if (serverToggle) serverToggle.checked = currentServer === 'workers';
                if (serverLabel) serverLabel.textContent = currentServer === 'workers' ? 'Workers' : 'Render';

                if (!channelId || !sessionSecret) {
                    restoreSession(); // попробуем восстановить
                } else {
                    saveSession();
                }

                let pongUrl = 'https://stepweather-prog.github.io/P2PPong/?v=' + Date.now();
                if (params.get('id')) pongUrl += '&id=' + params.get('id') + '&key=' + params.get('key');
                if (pongFrame) pongFrame.src = pongUrl;
                if (statusDiv) statusDiv.textContent = '🏹 Пробуждение...';
            }

            window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
