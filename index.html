<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RobinCall</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/avatars/001-.png">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://stepweather-prog.github.io; media-src 'self' blob:; connect-src * blob:; img-src 'self' data: blob:;">
    <style>
        :root {
            --bg-primary: #1a2a1f;
            --bg-secondary: #0d1a0c;
            --accent: #c4a24b;
            --accent-light: #e8d5a3;
            --accent-glow: rgba(196,162,75,0.5);
            --text: #e8e2c7;
            --text-bright: #f5e6b8;
            --text-dim: #b8a87a;
            --border: #c4a24b;
            --btn-bg: rgba(196,162,75,0.1);
            --btn-border: rgba(196,162,75,0.3);
            --btn-hover: rgba(196,162,75,0.25);
            --sheet-bg: linear-gradient(145deg, #1e2a1a 0%, #0f180d 100%);
            --input-bg: rgba(20,30,18,0.9);
            --input-focus: rgba(25,38,22,0.95);
            --msg-bg: rgba(30,40,25,0.85);
            --msg-accent: #c4a24b;
            --robin-bg: rgba(50,70,40,0.9);
            --robin-accent: #e8c97a;
            --overlay-bg: rgba(0,0,0,0.6);
            --call-bg: linear-gradient(135deg, rgba(25,35,20,0.98), rgba(15,25,12,0.98));
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html,body { margin:0; padding:0; height:100%; overflow:hidden; -webkit-text-size-adjust:100%; font-family:'Segoe UI','Inter','Georgia',serif; }
        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text);
            display:flex; flex-direction:column;
            height:100vh; height:100dvh; position:relative;
        }
        body::before {
            content:""; position:fixed; top:0; left:0; width:100%; height:100%;
            background-image:url('assets/background.webp');
            background-size:cover; background-position:center 30%; background-repeat:no-repeat;
            z-index:0; opacity:0.4;
        }
        body::after {
            content:""; position:fixed; top:0; left:0; width:100%; height:100%;
            background:radial-gradient(circle at 20% 30%, rgba(30,40,25,0.65), rgba(10,20,8,0.85));
            z-index:0;
        }

        /* Шапка */
        .header {
            background:linear-gradient(135deg, rgba(25,35,20,0.96), rgba(15,25,12,0.98));
            border-bottom:2px solid var(--border);
            backdrop-filter:blur(8px);
            z-index:10;
            padding:8px 12px;
            display:flex;
            flex-direction:column;
            gap:4px;
            box-shadow:0 4px 20px rgba(0,0,0,0.3);
        }
        .header-row-1 {
            display:flex;
            align-items:center;
            gap:8px;
        }
        .header-title-text {
            font-size:1.2em;
            font-weight:bold;
            background:linear-gradient(135deg, var(--accent-light), var(--accent));
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
        }
        .header-shield { font-size:1em; filter:drop-shadow(0 0 3px var(--accent-glow)); }
        .header-version { font-size:0.6em; color:var(--text-dim); margin-left:auto; }
        .header-row-2 {
            display:flex;
            justify-content:space-around;
            align-items:center;
        }
        .header-btn {
            width:44px; height:44px;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer;
            border-radius:12px;
            font-size:22px;
            background:var(--btn-bg);
            border:1px solid var(--btn-border);
            transition:all 0.2s;
        }
        .header-btn:hover {
            background:var(--btn-hover);
            transform:scale(1.05);
            border-color:var(--accent);
        }
        .header-btn img {
            width:100%; height:100%;
            object-fit:contain;
            padding:6px;
        }
        .header-label {
            font-size:0.55em;
            color:var(--text-dim);
            text-align:center;
            width:44px;
            cursor:pointer;
            font-weight:bold;
            white-space:nowrap;
        }
        .header-avatar {
            width:34px; height:34px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid var(--border);
            box-shadow:0 2px 8px rgba(0,0,0,0.3);
        }
        .connection-dot {
            width:8px; height:8px;
            border-radius:50%;
            display:inline-block;
            margin-right:6px;
        }
        .connection-dot.online { background:#4caf50; box-shadow:0 0 6px #4caf50; }
        .connection-dot.offline { background:#f44336; }
        .connection-dot.connecting { background:#ff9800; animation:pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* Основная область */
        .main-area {
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            position:relative;
            z-index:1;
            padding:20px;
            gap:15px;
            overflow-y:auto;
        }

        /* Robin Hood */
        .robin-row {
            background:var(--robin-bg);
            border-left:3px solid var(--robin-accent);
            border-radius:16px;
            padding:10px 15px;
            display:flex;
            align-items:center;
            gap:10px;
            max-width:90%;
            box-shadow:0 2px 12px rgba(0,0,0,0.2);
            backdrop-filter:blur(8px);
        }
        .robin-avatar {
            width:44px; height:44px;
            border-radius:50%;
            border:2px solid var(--robin-accent);
            flex-shrink:0;
            object-fit:cover;
        }
        .robin-text {
            font-weight:700;
            font-size:0.85em;
            color:var(--text-bright);
            text-shadow:0 1px 3px rgba(0,0,0,0.6);
        }

        /* Кнопки */
        .btn-round {
            width:80px; height:80px;
            border-radius:50%;
            border:3px solid var(--border);
            cursor:pointer;
            font-size:35px;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:all 0.3s ease;
            background:var(--btn-bg);
            color:var(--text);
        }
        .btn-round:hover {
            background:var(--btn-hover);
            box-shadow:0 0 35px var(--accent-glow);
            transform:scale(1.08);
        }
        .btn-round:active { transform:scale(0.95); }
        .btn-round img {
            width:100%; height:100%;
            object-fit:contain;
            padding:12px;
        }
        
        .btn-arrow {
            width:70px; height:70px;
            border-radius:50%;
            border:3px solid #c4a24b;
            cursor:pointer;
            background:rgba(196,162,75,0.15);
            transition:all 0.3s;
            position:relative;
        }
        .btn-arrow:hover {
            background:rgba(196,162,75,0.35);
            box-shadow:0 0 30px rgba(196,162,75,0.5);
            transform:scale(1.1);
        }
        .btn-arrow img {
            width:100%; height:100%;
            object-fit:contain;
            padding:10px;
        }
        .btn-call { border-color:#4caf50; }
        .btn-call:hover { box-shadow:0 0 35px rgba(76,175,80,0.5); }
        .btn-hangup { border-color:#f44336; background:rgba(244,67,54,0.2); }
        .btn-hangup:hover { box-shadow:0 0 35px rgba(244,67,54,0.5); }
        .btn:disabled { opacity:0.3; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

        .hidden { display:none !important; }

        .controls-row {
            display:flex;
            gap:25px;
            align-items:center;
            justify-content:center;
            flex-wrap:wrap;
        }

        .status-text {
            font-size:1em;
            color:var(--accent-light);
            text-align:center;
            min-height:25px;
            max-width:90%;
        }

        .call-timer {
            font-size:1.5em;
            font-weight:bold;
            color:#4caf50;
            font-family:monospace;
        }

        /* Поле ввода ID */
        .input-row {
            display:flex;
            gap:8px;
            align-items:center;
            background:var(--input-bg);
            border:1px solid var(--border);
            border-radius:12px;
            padding:5px;
            max-width:90%;
        }
        .input-row input {
            flex:1;
            background:transparent;
            border:none;
            color:var(--text);
            font-size:14px;
            padding:10px;
            outline:none;
            font-family:monospace;
        }
        .input-row input:focus {
            box-shadow:0 0 8px var(--accent-glow);
        }
        .input-row button {
            padding:8px 14px;
            border-radius:8px;
            border:1px solid var(--border);
            background:var(--btn-bg);
            color:var(--text);
            cursor:pointer;
            font-size:12px;
            white-space:nowrap;
            font-weight:bold;
        }
        .input-row button:hover {
            background:var(--btn-hover);
            border-color:var(--accent);
        }

        /* Модальное окно ссылки */
        .modal-overlay {
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background:rgba(0,0,0,0.85);
            backdrop-filter:blur(8px);
            z-index:300;
            justify-content:center;
            align-items:center;
        }
        .modal-overlay.active { display:flex; }
        .modal-dialog {
            background:var(--sheet-bg);
            padding:24px;
            border-radius:24px;
            width:85%;
            max-width:380px;
            text-align:center;
            border:2px solid var(--border);
            box-shadow:0 12px 40px rgba(0,0,0,0.5);
        }
        .modal-dialog h3 {
            color:var(--accent-light);
            margin:0 0 16px;
            font-size:1.2em;
        }
        .modal-dialog button {
            width:100%;
            padding:12px;
            margin-top:8px;
            border:none;
            border-radius:12px;
            font-size:14px;
            font-weight:bold;
            cursor:pointer;
            transition:all 0.2s;
        }
        .btn-primary {
            background:linear-gradient(135deg, var(--accent), #b8903a);
            color:#1a1f0f;
        }
        .btn-dark { background:#4a3a2a; color:#eee; }
        .code-display {
            background:#0a1208;
            border:1px solid var(--border);
            color:var(--accent-light);
            border-radius:12px;
            padding:12px;
            font-size:0.75em;
            word-break:break-all;
            margin:16px 0;
            font-family:monospace;
            user-select:all;
        }

        /* Нижняя панель */
        .bottom-bar {
            background:linear-gradient(135deg, rgba(25,35,20,0.96), rgba(15,25,12,0.98));
            border-top:1px solid var(--border);
            backdrop-filter:blur(8px);
            z-index:10;
            padding:8px 12px;
            padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px));
            display:flex;
            gap:8px;
            align-items:center;
            justify-content:center;
        }
        .bottom-btn {
            width:40px; height:40px;
            border-radius:10px;
            border:1px solid var(--btn-border);
            background:var(--btn-bg);
            color:var(--text);
            cursor:pointer;
            font-size:18px;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:all 0.2s;
        }
        .bottom-btn:hover { background:var(--btn-hover); border-color:var(--accent); }
        .bottom-btn img { width:100%; height:100%; object-fit:contain; padding:6px; }

        .debug-text {
            color:#555;
            font-size:0.55em;
            max-width:120px;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }

        /* Анимации */
        .ripple { animation:ripple 1.5s infinite; }
        @keyframes ripple {
            0%{box-shadow:0 0 0 0 rgba(76,175,80,0.5)}
            70%{box-shadow:0 0 0 30px rgba(76,175,80,0)}
            100%{box-shadow:0 0 0 0 rgba(76,175,80,0)}
        }
        .bow-anim {
            position:fixed;
            bottom:50%;
            left:50%;
            transform:translate(-50%,50%);
            width:200px; height:200px;
            z-index:500;
            pointer-events:none;
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <div class="header">
        <div class="header-row-1">
            <span class="header-title-text">RobinCall</span>
            <span class="header-shield">🏹</span>
            <span style="flex:1;"></span>
            <span class="connection-dot connecting" id="connection-dot"></span>
            <span style="font-size:0.6em;color:var(--text-dim);" id="connection-label">Подключение...</span>
            <span class="header-version">v3.1</span>
        </div>
        <div class="header-row-2">
            <div class="header-btn" id="btn-avatar-menu">
                <img src="assets/avatars/001-.png" class="header-avatar" id="profile-avatar-small" alt="avatar">
            </div>
            <div class="header-btn" id="btn-arrow-create" title="Создать стрелу">
                <img src="assets/3.png" alt="arrow">
            </div>
            <div class="header-btn" id="btn-call-main" title="Позвонить">
                <img src="assets/phone-go.png" alt="call">
            </div>
            <div class="header-btn" id="btn-hangup-main" title="Завершить">
                <img src="assets/phone-stop.png" alt="hangup">
            </div>
            <div class="header-btn" id="btn-clear-reset" title="Новая сессия">
                <img src="assets/6.png" alt="clear">
            </div>
        </div>
        <div class="header-row-3">
            <span class="header-label">Аватар</span>
            <span class="header-label">Стрела</span>
            <span class="header-label">Звонок</span>
            <span class="header-label">Сброс</span>
            <span class="header-label">Новая</span>
        </div>
    </div>

    <!-- Основная область -->
    <div class="main-area" id="main-area">
        <div class="robin-row">
            <img src="assets/avatars/231-icon-11433690.png" class="robin-avatar" alt="Robin" id="robin-avatar">
            <div>
                <div style="font-weight:900;color:var(--text-bright);font-size:0.9em;">Robin Hood</div>
                <div class="robin-text" id="robin-message">Колчан готов, лучник!</div>
            </div>
        </div>

        <div class="status-text" id="call-status">🏹 Создайте стрелу чтобы начать</div>
        <div class="call-timer hidden" id="call-timer">00:00</div>

        <!-- Кнопка Создать стрелу / Позвонить -->
        <button class="btn-arrow ripple hidden" id="btn-main-action" title="Создать стрелу">
            <img src="assets/3.png" alt="arrow">
        </button>

        <!-- Входящий звонок -->
        <div class="controls-row hidden" id="incoming-row">
            <button class="btn-round btn-call" id="btn-answer" title="Принять">
                <img src="assets/phone-go.png" alt="accept">
            </button>
            <button class="btn-round btn-hangup" id="btn-reject" title="Отклонить">
                <img src="assets/phone-stop.png" alt="reject">
            </button>
        </div>

        <!-- Активный звонок -->
        <div class="controls-row hidden" id="active-row">
            <button class="btn-round btn-hangup" id="btn-end-call" title="Завершить">
                <img src="assets/phone-stop.png" alt="end">
            </button>
        </div>

        <!-- Кнопки микрофона и динамика -->
        <div class="controls-row hidden" id="audio-controls" style="gap:15px;">
            <button class="bottom-btn" id="btn-mic" title="Микрофон" style="width:50px;height:50px;font-size:24px;">🎤</button>
            <button class="bottom-btn" id="btn-speaker" title="Динамик" style="width:50px;height:50px;font-size:24px;">🔊</button>
        </div>

        <!-- Поле ввода ID -->
        <div class="input-row" id="join-row">
            <input type="text" id="join-input" placeholder="Вставьте ID колчана..." autocomplete="off">
            <button id="btn-join">🔗 Принять стрелу</button>
        </div>
    </div>

    <!-- Модальное окно ссылки -->
    <div class="modal-overlay" id="ref-modal">
        <div class="modal-dialog">
            <h3>🏹 Стрела готова!</h3>
            <div class="code-display" id="ref-link-display"></div>
            <button class="btn-primary" id="btn-copy-link-modal">📋 Копировать ссылку</button>
            <button class="btn-primary" id="btn-share-link" style="margin-top:4px;">📤 Поделиться</button>
            <button class="btn-dark" id="btn-close-modal">Закрыть</button>
        </div>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-bar">
        <button class="bottom-btn" id="btn-copy-link" title="Копировать ссылку">
            <img src="assets/1.png" alt="copy">
        </button>
        <button class="bottom-btn" id="btn-share" title="Поделиться">
            <span>📤</span>
        </button>
        <span style="flex:1;"></span>
        <span class="debug-text" id="debug-text"></span>
    </div>

    <!-- Скрытый iframe для P2PPong -->
    <iframe id="pong-frame" src="about:blank" style="display:none;" title="p2p engine"></iframe>

    <script>
        (function() {
            'use strict';

            // ==================== КОНФИГУРАЦИЯ ====================
            const P2PPONG_URL = 'https://stepweather-prog.github.io/P2PPong/';

            // ==================== DOM ====================
            const $ = (s) => document.getElementById(s);
            const pongFrame = $('pong-frame');
            const robinMessage = $('robin-message');
            const callStatus = $('call-status');
            const callTimer = $('call-timer');
            const connectionDot = $('connection-dot');
            const connectionLabel = $('connection-label');
            const debugText = $('debug-text');
            const profileAvatarSmall = $('profile-avatar-small');
            
            const btnMainAction = $('btn-main-action');
            const btnAnswer = $('btn-answer');
            const btnReject = $('btn-reject');
            const btnEndCall = $('btn-end-call');
            const btnMic = $('btn-mic');
            const btnSpeaker = $('btn-speaker');
            const btnArrowCreate = $('btn-arrow-create');
            const btnCallMain = $('btn-call-main');
            const btnHangupMain = $('btn-hangup-main');
            const btnClearReset = $('btn-clear-reset');
            const btnCopyLink = $('btn-copy-link');
            const btnShare = $('btn-share');
            const btnJoin = $('btn-join');
            const joinInput = $('join-input');
            
            const incomingRow = $('incoming-row');
            const activeRow = $('active-row');
            const audioControls = $('audio-controls');
            const joinRow = $('join-row');
            const refModal = $('ref-modal');
            const refLinkDisplay = $('ref-link-display');

            // ==================== ICE СЕРВЕРЫ ====================
            const ICE_SERVERS = [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                {
                    urls: ["turn:openrelay.metered.ca:80?transport=tcp", "turn:openrelay.metered.ca:443?transport=tcp"],
                    username: "openrelayproject",
                    credential: "openrelayproject"
                }
            ];

            // ==================== СОСТОЯНИЕ ====================
            let pc = null;
            let localStream = null;
            let handshakeSecret = null;
            let channelId = null;
            let sessionSecret = null;
            let currentSessionKey = null;
            let callActive = false;
            let callStartTime = null;
            let callTimerInterval = null;
            let micOn = true;
            let speakerOn = true;
            let pendingOffer = null;
            let currentLink = null;
            let quiverReady = false; // Флаг готовности колчана

            // ==================== УТИЛИТЫ ====================
            function log(msg) {
                console.log('[RobinCall]', msg);
                if (debugText) {
                    debugText.textContent = msg;
                }
            }

            function setRobinMsg(msg) {
                if (robinMessage) robinMessage.textContent = msg;
                log(msg);
            }

            function setConnectionState(state) {
                if (connectionDot) {
                    connectionDot.className = 'connection-dot ' + state;
                }
                if (connectionLabel) {
                    switch(state) {
                        case 'online': connectionLabel.textContent = 'Колчан открыт'; break;
                        case 'offline': connectionLabel.textContent = 'Нет связи'; break;
                        case 'connecting': connectionLabel.textContent = 'Подключение...'; break;
                    }
                }
            }

            function generateId() {
                return crypto.randomUUID ? crypto.randomUUID() : 
                    Math.random().toString(36).substring(2) + Date.now().toString(36);
            }

            async function sha256(text) {
                const data = new TextEncoder().encode(text);
                const hash = await crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
            }

            // ==================== P2PPong ВЗАИМОДЕЙСТВИЕ ====================
            function sendToPong(msg) {
                if (!msg) return;
                if (channelId && sessionSecret) {
                    msg.secret = sessionSecret;
                    msg.channelId = channelId;
                }
                if (handshakeSecret && msg.action === 'handshake') msg.handshake = handshakeSecret;
                if (pongFrame.contentWindow) {
                    pongFrame.contentWindow.postMessage(msg, '*');
                }
            }

            // ==================== АУДИО ====================
            async function getLocalStream() {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                        video: false
                    });
                    log('Микрофон получен');
                    return true;
                } catch (e) {
                    log('Ошибка микрофона: ' + e.message);
                    setRobinMsg('❌ Нет доступа к микрофону');
                    return false;
                }
            }

            // ==================== WEBRTC ====================
            function createPeerConnection() {
                if (pc) { pc.close(); pc = null; }
                pc = new RTCPeerConnection({ iceServers: ICE_SERVERS, iceTransportPolicy: 'all' });
                if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                
                pc.ontrack = (event) => {
                    log('Получен удалённый аудио');
                    const audio = new Audio();
                    audio.srcObject = event.streams[0];
                    audio.play().catch(e => log('Автовоспроизведение: ' + e.message));
                };
                
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        sendToPong({ action: 'send', text: '__ICE__' + JSON.stringify(event.candidate), channelId: channelId });
                    }
                };
                
                pc.onconnectionstatechange = () => {
                    log('Состояние: ' + pc.connectionState);
                    if (pc.connectionState === 'connected') {
                        if (callStatus) callStatus.textContent = '✅ Разговор';
                        callActive = true;
                        startCallTimer();
                        updateUIState('active');
                    } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                        if (callStatus) callStatus.textContent = '❌ Связь потеряна';
                        hangup(false);
                    }
                };
                
                return pc;
            }

            // ==================== ЗВОНКИ ====================
            function createQuiver() {
                if (!handshakeSecret) {
                    setRobinMsg('⚠ Сервер не готов');
                    return;
                }
                setRobinMsg('⚒ Куём стрелу...');
                btnMainAction.disabled = true;
                sendToPong({ action: 'create' });
            }

            async function startCall() {
                if (callActive) return;
                if (!quiverReady || !channelId) {
                    setRobinMsg('⚠ Сначала создайте стрелу!');
                    return;
                }

                if (callStatus) callStatus.textContent = '📞 Вызов...';
                updateUIState('calling');

                if (!await getLocalStream()) {
                    updateUIState('ready');
                    return;
                }

                createPeerConnection();

                try {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    sendToPong({ action: 'send', text: '__OFFER__' + JSON.stringify(offer), channelId: channelId });
                    log('Offer отправлен');
                } catch (e) {
                    log('Ошибка offer: ' + e.message);
                    setRobinMsg('❌ Ошибка вызова');
                    hangup(true);
                }
            }

            async function acceptCall() {
                if (callActive || !pendingOffer) return;
                if (callStatus) callStatus.textContent = '📞 Соединение...';
                updateUIState('active');

                if (!await getLocalStream()) {
                    updateUIState('ready');
                    return;
                }

                createPeerConnection();

                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(pendingOffer));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    sendToPong({ action: 'send', text: '__ANSWER__' + JSON.stringify(answer), channelId: channelId });
                    log('Answer отправлен');
                    pendingOffer = null;
                } catch (e) {
                    log('Ошибка answer: ' + e.message);
                    setRobinMsg('❌ Ошибка соединения');
                    hangup(true);
                }
            }

            function hangup(sendSignal = true) {
                callActive = false;
                stopCallTimer();

                if (sendSignal && channelId) {
                    sendToPong({ action: 'send', text: '__HANGUP__', channelId: channelId });
                }

                if (pc) { pc.close(); pc = null; }
                if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
                pendingOffer = null;
                if (callStatus) callStatus.textContent = '📞 Звонок завершён';
                updateUIState('ready');
            }

            function startCallTimer() {
                callStartTime = Date.now();
                if (callTimer) callTimer.classList.remove('hidden');
                callTimerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
                    const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                    const secs = (elapsed % 60).toString().padStart(2, '0');
                    if (callTimer) callTimer.textContent = mins + ':' + secs;
                }, 1000);
            }

            function stopCallTimer() {
                if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
                if (callTimer) { callTimer.classList.add('hidden'); callTimer.textContent = '00:00'; }
            }

            function acceptArrow(sessionId) {
                if (!sessionId) {
                    setRobinMsg('⚠ Введите ID колчана');
                    return;
                }
                if (!handshakeSecret) {
                    setRobinMsg('⚠ Сервер не готов');
                    return;
                }
                setRobinMsg('🔍 Ищу колчан...');
                sendToPong({ action: 'accept', id: sessionId, key: '' });
            }

            function resetSession() {
                if (callActive) hangup(true);
                channelId = null;
                sessionSecret = null;
                currentSessionKey = null;
                currentLink = null;
                quiverReady = false;
                pendingOffer = null;
                setConnectionState('connecting');
                updateUIState('idle');
                if (joinInput) joinInput.value = '';
                setRobinMsg('🏹 Колчан сброшен. Создайте новый.');
            }

            function copyLink() {
                if (currentLink) {
                    navigator.clipboard.writeText(currentLink).then(() => {
                        setRobinMsg('📋 Ссылка скопирована!');
                    }).catch(() => {});
                    refModal.classList.add('active');
                } else {
                    setRobinMsg('⚠ Сначала создайте стрелу');
                }
            }

            async function shareLink() {
                if (currentLink && navigator.share) {
                    try {
                        await navigator.share({
                            title: 'RobinCall',
                            text: 'Присоединяйтесь к звонку RobinCall!',
                            url: currentLink
                        });
                    } catch (e) {}
                } else {
                    copyLink();
                }
            }

            // ==================== UI ====================
            function updateUIState(state) {
                btnMainAction.classList.add('hidden');
                incomingRow.classList.add('hidden');
                activeRow.classList.add('hidden');
                audioControls.classList.add('hidden');
                btnMainAction.disabled = false;

                switch (state) {
                    case 'idle':
                        btnMainAction.classList.remove('hidden');
                        btnMainAction.querySelector('img').src = 'assets/3.png';
                        joinRow.classList.remove('hidden');
                        if (callStatus) callStatus.textContent = '🏹 Создайте стрелу чтобы начать';
                        break;
                        
                    case 'ready':
                        btnMainAction.classList.remove('hidden');
                        btnMainAction.querySelector('img').src = 'assets/phone-go.png';
                        btnMainAction.classList.add('ripple');
                        joinRow.classList.remove('hidden');
                        if (callStatus) callStatus.textContent = '📞 Колчан готов! Можно звонить';
                        break;
                        
                    case 'calling':
                        activeRow.classList.remove('hidden');
                        audioControls.classList.remove('hidden');
                        if (callStatus) callStatus.textContent = '📞 Вызов...';
                        break;
                        
                    case 'incoming':
                        incomingRow.classList.remove('hidden');
                        if (callStatus) callStatus.textContent = '📞 Входящий вызов!';
                        break;
                        
                    case 'active':
                        activeRow.classList.remove('hidden');
                        audioControls.classList.remove('hidden');
                        break;
                }
            }

            // ==================== ОБРАБОТЧИКИ ====================
            btnMainAction.addEventListener('click', () => {
                if (!quiverReady) {
                    createQuiver();
                } else {
                    startCall();
                }
            });

            btnArrowCreate.addEventListener('click', createQuiver);
            btnCallMain.addEventListener('click', startCall);
            btnHangupMain.addEventListener('click', () => hangup(true));
            btnClearReset.addEventListener('click', resetSession);

            btnAnswer.addEventListener('click', acceptCall);
            btnReject.addEventListener('click', () => {
                sendToPong({ action: 'send', text: '__HANGUP__', channelId: channelId });
                pendingOffer = null;
                updateUIState('ready');
                if (callStatus) callStatus.textContent = '📞 Вызов отклонён';
            });

            btnEndCall.addEventListener('click', () => hangup(true));

            btnMic.addEventListener('click', () => {
                if (localStream) {
                    micOn = !micOn;
                    localStream.getAudioTracks().forEach(t => t.enabled = micOn);
                    btnMic.textContent = micOn ? '🎤' : '🔇';
                }
            });

            btnSpeaker.addEventListener('click', () => {
                speakerOn = !speakerOn;
                btnSpeaker.textContent = speakerOn ? '🔊' : '🔈';
            });

            btnCopyLink.addEventListener('click', copyLink);
            btnShare.addEventListener('click', shareLink);

            btnJoin.addEventListener('click', () => {
                const id = joinInput.value.trim();
                if (id) acceptArrow(id);
            });

            joinInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const id = joinInput.value.trim();
                    if (id) acceptArrow(id);
                }
            });

            $('btn-copy-link-modal')?.addEventListener('click', () => {
                if (currentLink) {
                    navigator.clipboard.writeText(currentLink).catch(() => {});
                    setRobinMsg('📋 Скопировано!');
                }
            });

            $('btn-share-link')?.addEventListener('click', shareLink);

            $('btn-close-modal')?.addEventListener('click', () => {
                refModal.classList.remove('active');
            });

            // ==================== P2PPong СООБЩЕНИЯ ====================
            window.addEventListener('message', async (event) => {
                if (event.source !== pongFrame.contentWindow) return;
                const data = event.data;

                switch (data.type) {
                    case 'pong-ready':
                        handshakeSecret = data.handshake;
                        sendToPong({ action: 'handshake' });
                        setConnectionState('online');
                        updateUIState('idle');
                        setRobinMsg('🏹 Колчан готов к бою!');
                        break;

                    case 'handshake-ok':
                        const urlParams = new URLSearchParams(window.location.search);
                        const sid = urlParams.get('id');
                        if (sid) {
                            setRobinMsg('📨 Принимаю стрелу...');
                            acceptArrow(sid);
                        }
                        break;

                    case 'session-created':
                        channelId = data.sessionId;
                        currentSessionKey = data.key;
                        sessionSecret = data.secret;
                        currentLink = data.fullLink;
                        quiverReady = true;
                        
                        setRobinMsg('✅ Стрела готова! ID: ' + data.sessionId.substring(0, 10) + '...');
                        setConnectionState('online');
                        
                        if (refLinkDisplay) refLinkDisplay.textContent = data.fullLink;
                        refModal.classList.add('active');
                        
                        if (joinInput) joinInput.value = data.sessionId;
                        
                        updateUIState('ready');
                        
                        // Автокопирование
                        navigator.clipboard.writeText(currentLink).catch(() => {});
                        break;

                    case 'channel-open':
                        channelId = data.channelId;
                        sessionSecret = data.secret;
                        quiverReady = true;
                        
                        setRobinMsg('✅ Подключено к колчану!');
                        setConnectionState('online');
                        
                        if (joinInput) joinInput.value = data.channelId;
                        updateUIState('ready');
                        break;

                    case 'message':
                        if (!data.text || typeof data.text !== 'string') return;

                        if (data.text.startsWith('__OFFER__')) {
                            if (callActive || pc) {
                                sendToPong({ action: 'send', text: '__HANGUP__', channelId: channelId });
                                return;
                            }
                            try {
                                pendingOffer = JSON.parse(data.text.replace('__OFFER__', ''));
                                setRobinMsg('📞 Входящий вызов!');
                                updateUIState('incoming');
                            } catch (e) {}
                            return;
                        }

                        if (data.text.startsWith('__ANSWER__')) {
                            if (!pc) return;
                            try {
                                const answer = JSON.parse(data.text.replace('__ANSWER__', ''));
                                await pc.setRemoteDescription(new RTCSessionDescription(answer));
                                callActive = true;
                                if (callStatus) callStatus.textContent = '✅ Разговор';
                                startCallTimer();
                                updateUIState('active');
                            } catch (e) {}
                            return;
                        }

                        if (data.text.startsWith('__ICE__')) {
                            if (!pc) return;
                            try {
                                const candidate = JSON.parse(data.text.replace('__ICE__', ''));
                                await pc.addIceCandidate(new RTCIceCandidate(candidate));
                            } catch (e) {}
                            return;
                        }

                        if (data.text === '__HANGUP__') {
                            if (callActive || pc) {
                                setRobinMsg('📞 Собеседник завершил звонок');
                                hangup(false);
                            }
                            return;
                        }
                        break;

                    case 'error':
                        setRobinMsg('⚠ ' + data.text);
                        btnMainAction.disabled = false;
                        updateUIState('idle');
                        break;
                }
            });

            // ==================== ИНИЦИАЛИЗАЦИЯ ====================
            function init() {
                log('RobinCall v3.1 загружен');
                setConnectionState('connecting');
                
                pongFrame.src = P2PPONG_URL + '?v=' + Date.now();
                
                updateUIState('idle');
                setRobinMsg('🏹 Ждём колчан...');
            }

            window.addEventListener('beforeunload', () => {
                if (callActive) {
                    sendToPong({ action: 'send', text: '__HANGUP__', channelId: channelId });
                }
                if (pc) pc.close();
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                }
            });

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
