<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RobinCall</title>
    <link rel="manifest" href="manifest.json">
    <!-- ПРАВИЛЬНЫЕ ПУТИ: из ROBINHOOD-P2PCall/ поднимаемся в корень, затем в ROBINHOOD-P2P/assets/ -->
    <link rel="icon" type="image/png" sizes="192x192" href="../ROBINHOOD-P2P/assets/avatars/001-.png">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src * blob:; img-src 'self' data: blob:;">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html,body { height:100%; overflow:hidden; font-family:'Segoe UI','Inter','Georgia',serif; }
        body {
            background: linear-gradient(135deg, #1a2a1f 0%, #0d1a0c 100%);
            color:#e8e2c7;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            height:100dvh; position:relative;
        }
        /* Фон с правильным путем: ../ROBINHOOD-P2P/assets/background.webp */
        body::before {
            content:""; position:fixed; top:0; left:0; width:100%; height:100%;
            background-image:url('../ROBINHOOD-P2P/assets/background.webp');
            background-size:cover; background-position:center; background-repeat:no-repeat;
            z-index:0; opacity:0.3;
        }
        body::after {
            content:""; position:fixed; top:0; left:0; width:100%; height:100%;
            background:radial-gradient(circle at 50% 50%, rgba(30,40,25,0.6), rgba(10,20,8,0.9));
            z-index:0;
        }
        .container { position:relative; z-index:1; text-align:center; padding:20px; }
        h1 { font-size:2em; background:linear-gradient(135deg,#e8d5a3,#c4a24b); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:10px; }
        .status { color:#b8a87a; font-size:1em; margin:15px 0; min-height:30px; }
        .btn {
            width:80px; height:80px; border-radius:50%; border:3px solid #c4a24b;
            cursor:pointer; font-size:35px; display:flex; align-items:center; justify-content:center;
            margin:20px auto; transition:all 0.3s; background:rgba(196,162,75,0.15); color:#e8e2c7;
        }
        .btn:hover { background:rgba(196,162,75,0.35); box-shadow:0 0 30px rgba(196,162,75,0.4); transform:scale(1.1); }
        .btn-call { border-color:#4caf50; color:#4caf50; }
        .btn-hangup { border-color:#f44336; color:#f44336; }
        .btn-answer { border-color:#4caf50; color:#4caf50; }
        .btn-reject { border-color:#f44336; color:#f44336; }
        .btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
        .btn:disabled:hover { background:rgba(196,162,75,0.15); box-shadow:none; transform:none; }
        .hidden { display:none !important; }
        .controls { display:flex; gap:20px; justify-content:center; margin-top:20px; }
        .debug { color:#666; font-size:0.7em; margin-top:30px; word-break:break-all; max-height:80px; overflow-y:auto; }
        .ripple { animation:ripple 1.5s infinite; }
        @keyframes ripple { 0%{box-shadow:0 0 0 0 rgba(76,175,80,0.5)} 70%{box-shadow:0 0 0 30px rgba(76,175,80,0)} 100%{box-shadow:0 0 0 0 rgba(76,175,80,0)} }
        .fingerprint-info { font-family:monospace; font-size:0.65em; background:rgba(0,0,0,0.3); padding:6px 12px; border-radius:8px; margin:8px 0; word-break:break-all; color:#81c784; }
    </style>
</head>
<body>
<div class="container">
    <h1>RobinCall</h1>
    <div class="status" id="status">Загрузка...</div>
    <div class="fingerprint-info hidden" id="fingerprint-info"></div>
    <button class="btn btn-call hidden" id="btn-call"></button>
    <div class="controls hidden" id="incoming-controls">
        <button class="btn btn-answer" id="btn-answer"></button>
        <button class="btn btn-reject" id="btn-reject">✕</button>
    </div>
    <div class="controls hidden" id="active-controls">
        <button class="btn btn-hangup ripple" id="btn-hangup"></button>
    </div>
    <div class="debug" id="debug"></div>
</div>

<script>
(function(){
const $=s=>document.getElementById(s);
const statusDiv=$('status'),debugDiv=$('debug'),fingerprintInfo=$('fingerprint-info');
const btnCall=$('btn-call'),btnHangup=$('btn-hangup'),btnAnswer=$('btn-answer'),btnReject=$('btn-reject');
const incomingControls=$('incoming-controls'),activeControls=$('active-controls');

const ICE=[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},
  {urls:["turn:openrelay.metered.ca:80?transport=tcp","turn:openrelay.metered.ca:443?transport=tcp"],username:"openrelayproject",credential:"openrelayproject"}
];

let pc=null,stream=null,channelId=null,callActive=false,callTimer=null,initReceived=false;
const urlParams=new URLSearchParams(location.search);

function log(m){console.log('[RobinCall]',m);if(debugDiv){debugDiv.textContent+=m+'\n';debugDiv.scrollTop=debugDiv.scrollHeight}}

function notify(t,d={}){
  const m={type:t,...d};
  if(window.opener&&!window.opener.closed)try{window.opener.postMessage(m,'*')}catch(e){}
  if(window.parent&&window.parent!==window)try{window.parent.postMessage(m,'*')}catch(e){}
}

function sendSignal(t){notify('robinhood-call-signal',{text:t,channelId})}

async function getMedia(video=false){
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:!0,noiseSuppression:!0,autoGainControl:!0},video:video?{width:{ideal:640},height:{ideal:480},facingMode:'user'}:!1});
    log('Медиа получен');return!0
  }catch(e){log('Ошибка медиа: '+e.message);statusDiv.textContent='Нет доступа к микрофону';return!1}
}

function createPC(){
  if(pc)pc.close();
  pc=new RTCPeerConnection({iceServers:ICE,iceTransportPolicy:'all',iceCandidatePoolSize:2});
  if(stream)stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack=e=>{if(e.streams[0]){const a=new Audio();a.srcObject=e.streams[0];a.play().catch(()=>{})}};
  pc.onicecandidate=e=>{if(e.candidate)sendSignal('__ICE__'+JSON.stringify(e.candidate))};
  pc.onconnectionstatechange=()=>{
    log('Состояние: '+pc.connectionState);
    if(pc.connectionState==='connected'){statusDiv.textContent='Связь установлена';callActive=!0;clearTimeout(callTimer);notify('robinhood-call-connected',{})}
    if(pc.connectionState==='failed'){statusDiv.textContent='Соединение не удалось';hangup()}
  };
  pc.oniceconnectionstatechange=()=>{log('ICE: '+pc.iceConnectionState);if(pc.iceConnectionState==='failed'){statusDiv.textContent='P2P не удался';hangup()}};
  return pc
}

async function startCall(){
  if(callActive||!channelId)return;
  statusDiv.textContent='Вызов...';btnCall.classList.add('hidden');activeControls.classList.remove('hidden');
  if(!await getMedia(urlParams.get('mode')==='video')){resetUI();return}
  createPC();
  try{
    const offer=await pc.createOffer();await pc.setLocalDescription(offer);
    sendSignal('__OFFER__'+JSON.stringify(offer));log('Offer отправлен');
    callTimer=setTimeout(()=>{if(!callActive){statusDiv.textContent='Таймаут вызова';hangup()}},60000)
  }catch(e){log('Ошибка offer: '+e.message);hangup()}
}

async function acceptCall(){
  statusDiv.textContent='Соединение...';incomingControls.classList.add('hidden');activeControls.classList.remove('hidden');
  if(!await getMedia()){hangup();return}
  createPC()
}

function hangup(send=!0){
  callActive=!1;clearTimeout(callTimer);
  statusDiv.textContent='Звонок завершён';activeControls.classList.add('hidden');incomingControls.classList.add('hidden');btnCall.classList.remove('hidden');
  if(send&&channelId)sendSignal('__HANGUP__');
  notify('robinhood-call-ended',{channelId});
  if(pc){pc.close();pc=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  log('Ресурсы освобождены');
  setTimeout(()=>{try{window.close()}catch(e){statusDiv.textContent='Окно можно закрыть'}},2000)
}

function resetUI(){activeControls.classList.add('hidden');incomingControls.classList.add('hidden');btnCall.classList.remove('hidden');statusDiv.textContent='Готов к вызову'}

async function handleSignal(text){
  if(!text)return;
  if(text.startsWith('__OFFER__')){
    if(callActive||pc)return sendSignal('__HANGUP__');
    try{
      const offer=JSON.parse(text.replace('__OFFER__',''));
      statusDiv.textContent='Входящий вызов...';btnCall.classList.add('hidden');incomingControls.classList.remove('hidden');
      window._pendingOffer=offer
    }catch(e){log('Ошибка парсинга offer')}
    return
  }
  if(text.startsWith('__ANSWER__')){
    if(!pc)return;
    try{await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(text.replace('__ANSWER__',''))));log('Answer установлен')}catch(e){log('Ошибка answer')}
    return
  }
  if(text.startsWith('__ICE__')){
    if(!pc)return;
    try{await pc.addIceCandidate(new RTCIceCandidate(JSON.parse(text.replace('__ICE__',''))))}catch(e){}
    return
  }
  if(text==='__HANGUP__'){statusDiv.textContent='Собеседник завершил звонок';hangup(!1)}
}

window.addEventListener('message',e=>{
  const d=e.data;if(!d||!d.type)return;
  if(d.type==='robinhood-call-init'){
    channelId=d.channelId;initReceived=!0;
    log('Канал: '+channelId);
    if(d.fingerprint){fingerprintInfo.classList.remove('hidden');fingerprintInfo.textContent='Отпечаток: '+d.fingerprint.substring(0,16)+'...'}
    statusDiv.textContent='Готов к вызову';btnCall.classList.remove('hidden');
    notify('robinhood-call-ready',{channelId});
    return
  }
  if(d.type==='robinhood-call-signal'&&d.text){if(!initReceived&&!channelId)channelId=d.channelId;handleSignal(d.text);return}
  if(d.type==='robinhood-call-hangup'){if(callActive)hangup(!1)}
});

btnCall.addEventListener('click',startCall);
btnHangup.addEventListener('click',()=>hangup(!0));
btnAnswer.addEventListener('click',async()=>{
  await acceptCall();
  if(pc&&window._pendingOffer){
    try{
      await pc.setRemoteDescription(new RTCSessionDescription(window._pendingOffer));
      const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
      sendSignal('__ANSWER__'+JSON.stringify(answer));log('Answer отправлен');
      delete window._pendingOffer
    }catch(e){log('Ошибка ответа: '+e.message);hangup()}
  }
});
btnReject.addEventListener('click',()=>{sendSignal('__HANGUP__');delete window._pendingOffer;resetUI();setTimeout(()=>{try{window.close()}catch(e){}},2000)});

window.addEventListener('beforeunload',()=>{if(callActive){sendSignal('__HANGUP__');notify('robinhood-call-ended',{channelId})}if(stream)stream.getTracks().forEach(t=>t.stop());if(pc)pc.close()});

setInterval(()=>{if(window.opener&&window.opener.closed){if(callActive)hangup(!1);try{window.close()}catch(e){}}},3000);

(function init(){
  log('RobinCall v2.0 загружен');
  const urlChannel=urlParams.get('channel');
  if(urlChannel){channelId=urlChannel;log('Канал из URL: '+urlChannel);statusDiv.textContent='Ожидание параметров...';notify('robinhood-call-ready',{channelId:urlChannel})}
  else{statusDiv.textContent='Ожидание инициализации...';log('Канал: ожидание инициализации');setTimeout(()=>{if(!initReceived&&!channelId){statusDiv.textContent='Нет параметров звонка';btnCall.classList.remove('hidden')}},10000)}
  if(channelId)btnCall.classList.remove('hidden')
})();
})();
</script>
</body>
</html>
