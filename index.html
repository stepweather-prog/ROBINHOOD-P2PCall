<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RobinCall 🏹</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/phone-go.png">
    <style>
        :root {
            --bg-primary: #1a2a1f; --bg-secondary: #0d1a0c; --accent: #c4a24b; --accent-light: #e8d5a3;
            --text: #e8e2c7; --text-dim: #b8a87a; --border: #c4a24b;
            --btn-bg: rgba(196,162,75,0.1); --btn-border: rgba(196,162,75,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', 'Inter', 'Georgia', serif; }
        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text); display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100dvh; position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://stepweather-prog.github.io/ROBINHOOD-P2P/assets/background.webp');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 0; opacity: 0.3;
        }
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(30,40,25,0.6), rgba(10,20,8,0.9)); z-index: 0;
        }
        .container { position: relative; z-index: 1; text-align: center; padding: 20px; width: 100%; max-width: 400px; }
        h1 {
            font-size: 1.8em; background: linear-gradient(135deg, var(--accent-light), var(--accent));
            -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 10px;
        }
        .status { color: var(--text-dim); font-size: 0.9em; margin: 10px 0; min-height: 24px; }
        .btn-row { display: flex; justify-content: center; gap: 20px; margin: 15px 0; flex-wrap: wrap; }
        .btn {
            width: 80px; height: 80px; border-radius: 50%; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: all 0.3s;
            background: var(--btn-bg); border: 2px solid var(--btn-border); padding: 16px;
        }
        .btn:hover { background: rgba(196,162,75,0.35); box-shadow: 0 0 20px rgba(196,162,75,0.3); transform: scale(1.08); }
        .btn:active { transform: scale(0.95); }
        .btn img { width: 100%; height: 100%; object-fit: contain; }
        .btn-label { color: var(--text-dim); font-size: 0.65em; margin-top: 4px; text-align: center; width: 80px; }
        .hidden { display: none !important; }
        .invite-row { margin-top: 15px; }
        .code-display {
            background: #0a1208; border: 1px solid var(--border); color: var(--accent-light);
            border-radius: 10px; padding: 10px; font-size: 0.7em; word-break: break-all;
            margin: 10px 0; text-align: center; user-select: all; font-family: monospace;
        }
        .btn-invite {
            width: 100%; padding: 12px; background: linear-gradient(135deg, var(--accent), var(--accent));
            color: #1a1f0f; border: none; border-radius: 12px; font-size: 14px; font-weight: bold;
            cursor: pointer; margin-top: 8px; transition: all 0.2s;
        }
        .btn-invite:hover { transform: translateY(-2px); }
        .btn-dark { background: #4a3a2a; color: #eee; }
        .debug { color: #555; font-size: 0.6em; margin-top: 20px; word-break: break-all; max-width: 300px; }
        .call-panel { margin-top: 10px; }
        .call-btns { display: flex; gap: 15px; justify-content: center; align-items: center; }
        .ripple { animation: ripple 1.5s infinite; }
        @keyframes ripple {
            0% { box-shadow: 0 0 0 0 rgba(196,162,75,0.5); }
            70% { box-shadow: 0 0 0 20px rgba(196,162,75,0); }
            100% { box-shadow: 0 0 0 0 rgba(196,162,75,0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏹 RobinCall</h1>
        <div class="status" id="status">Пробуждение...</div>

        <div class="btn-row" id="main-btns">
            <div>
                <button class="btn" id="btn-arrow" title="Стрела"><span style="font-size:30px;">🏹</span></button>
                <div class="btn-label">Стрела</div>
            </div>
            <div>
                <button class="btn hidden" id="btn-call" title="Позвонить"><img src="assets/phone-go.png" alt="Вызов"></button>
                <div class="btn-label hidden" id="call-label-btn">Звонок</div>
            </div>
        </div>

        <div class="invite-row hidden" id="invite-panel">
            <div class="status">🏹 Стрела готова!</div>
            <div class="code-display" id="invite-link"></div>
            <button class="btn-invite" id="btn-share">📤 Поделиться ссылкой</button>
            <button class="btn-invite btn-dark" id="btn-close-invite">Закрыть</button>
        </div>

        <div class="call-panel hidden" id="call-panel">
            <div class="status" id="call-status">📞 Вызов...</div>
            <div class="call-btns">
                <button class="btn" id="call-accept" style="width:65px;height:65px;background:rgba(76,175,80,0.3);border-color:#4caf50;"><img src="assets/phone-go.png" alt="Принять"></button>
                <button class="btn" id="call-end" style="width:65px;height:65px;background:rgba(244,67,54,0.3);border-color:#f44336;"><img src="assets/phone-stop.png" alt="Завершить"></button>
                <button class="btn" id="call-speaker" style="width:50px;height:50px;font-size:22px;">🔊</button>
            </div>
        </div>

        <div class="debug" id="debug"></div>
    </div>
    <iframe id="pong-frame" src="" style="display:none;" title="p2p engine"></iframe>
    <script>
        (function() {
            const statusDiv = document.getElementById('status');
            const debugDiv = document.getElementById('debug');
            const btnArrow = document.getElementById('btn-arrow');
            const btnCall = document.getElementById('btn-call');
            const callLabelBtn = document.getElementById('call-label-btn');
            const invitePanel = document.getElementById('invite-panel');
            const inviteLink = document.getElementById('invite-link');
            const btnShare = document.getElementById('btn-share');
            const btnCloseInvite = document.getElementById('btn-close-invite');
            const callPanel = document.getElementById('call-panel');
            const callStatus = document.getElementById('call-status');
            const callAccept = document.getElementById('call-accept');
            const callEnd = document.getElementById('call-end');
            const callSpeaker = document.getElementById('call-speaker');
            const mainBtns = document.getElementById('main-btns');
            const pongFrame = document.getElementById('pong-frame');

            const iceServers = [
                { urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" },
                { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
                { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
            ];

            let peerConnection = null, localStream = null, handshakeSecret = null;
            let channelId = null, sessionSecret = null, callActive = false, speakerOn = true;
            let ringtoneAudio = null, ringbackAudio = null, inviteTimer = null;

            function log(msg) { console.log('[RobinCall]', msg); debugDiv.textContent += msg + '\n'; debugDiv.scrollTop = debugDiv.scrollHeight; }

            async function getLocalStream() {
                try { localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false }); return true; }
                catch (e) { statusDiv.textContent = '❌ Нет доступа к микрофону'; return false; }
            }

            function createPeerConn() {
                peerConnection = new RTCPeerConnection({ iceServers });
                if (localStream) localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
                peerConnection.ontrack = (e) => { const a = new Audio(); a.srcObject = e.streams[0]; a.play().catch(() => {}); };
                peerConnection.onicecandidate = (e) => { if (e.candidate && peerConnection.remoteDescription) { sendToPong({ action: 'send', text: '__ICE__' + JSON.stringify(e.candidate), channelId }); } };
                peerConnection.oniceconnectionstatechange = () => {
                    if (peerConnection.iceConnectionState === 'connected' || peerConnection.iceConnectionState === 'completed') { callStatus.textContent = '✅ Разговор'; }
                    if (peerConnection.iceConnectionState === 'disconnected' || peerConnection.iceConnectionState === 'failed') hangup();
                };
            }

            function sendToPong(msg) {
                if (sessionSecret) msg.secret = sessionSecret; if (channelId) msg.channelId = channelId;
                if (handshakeSecret && msg.action === 'handshake') msg.handshake = handshakeSecret;
                if (pongFrame.contentWindow) pongFrame.contentWindow.postMessage(msg, '*');
            }
            function sendCallSignal(text) { sendToPong({ action: 'send', text: text, channelId }); }

            function playRingtone() { stopRingtone(); ringtoneAudio = new Audio('assets/sounds/melodi.mp3'); ringtoneAudio.loop = true; ringtoneAudio.volume = 0.7; ringtoneAudio.play().catch(() => {}); }
            function stopRingtone() { if (ringtoneAudio) { ringtoneAudio.pause(); ringtoneAudio = null; } }
            function playRingback() { stopRingback(); ringbackAudio = new Audio('assets/sounds/Welk.mp3'); ringbackAudio.loop = true; ringbackAudio.volume = 0.5; ringbackAudio.play().catch(() => {}); }
            function stopRingback() { if (ringbackAudio) { ringbackAudio.pause(); ringbackAudio = null; } }
            function playCallStart() { const a = new Audio('assets/sounds/open.mp3'); a.volume = 0.7; a.play().catch(() => {}); }
            function playCallEnd() { const a = new Audio('assets/sounds/exet.mp3'); a.volume = 0.7; a.play().catch(() => {}); }

            async function startCall() {
                if (callActive) return;
                callPanel.classList.remove('hidden'); mainBtns.classList.add('hidden');
                callStatus.textContent = '📞 Вызов...'; callAccept.classList.add('hidden');
                playRingback(); if (!await getLocalStream()) { hangup(); return; }
                createPeerConn(); const offer = await peerConnection.createOffer(); await peerConnection.setLocalDescription(offer);
                sendCallSignal('__OFFER__' + JSON.stringify(offer)); callActive = true;
            }

            function hangup() {
                callActive = false; stopRingtone(); stopRingback(); playCallEnd(); sendCallSignal('__HANGUP__');
                if (peerConnection) { peerConnection.close(); peerConnection = null; }
                if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
                callPanel.classList.add('hidden'); mainBtns.classList.remove('hidden');
                callAccept.classList.remove('hidden'); statusDiv.textContent = '📞 Звонок завершён';
            }

            function toggleSpeaker() { speakerOn = !speakerOn; callSpeaker.textContent = speakerOn ? '🔊' : '🔇'; }

            btnArrow.addEventListener('click', () => {
                if (!handshakeSecret && !channelId) { statusDiv.textContent = '⏳ Ждите подключения к серверу...'; return; }
                statusDiv.textContent = '⚒ Крафт стрелы...'; invitePanel.classList.add('hidden');
                sendToPong({ action: 'create' });
                clearTimeout(inviteTimer);
                inviteTimer = setTimeout(() => {
                    if (invitePanel.classList.contains('hidden') && statusDiv.textContent === '⚒ Крафт стрелы...') {
                        statusDiv.textContent = '❌ Сервер не ответил. Попробуйте позже.';
                    }
                }, 30000);
            });

            btnCall.addEventListener('click', () => { if (callActive) { hangup(); return; } startCall(); });
            callEnd.addEventListener('click', hangup);
            callSpeaker.addEventListener('click', toggleSpeaker);
            btnShare.addEventListener('click', () => { const link = inviteLink.textContent; if (link && navigator.share) { navigator.share({ title: 'RobinCall', url: link }).catch(() => {}); } });
            btnCloseInvite.addEventListener('click', () => { invitePanel.classList.add('hidden'); mainBtns.classList.remove('hidden'); statusDiv.textContent = '🏹 Готов'; });

            window.addEventListener('message', async (event) => {
                if (event.source !== pongFrame.contentWindow) return;
                const data = event.data;
                switch (data.type) {
                    case 'pong-ready': handshakeSecret = data.handshake; sendToPong({ action: 'handshake' }); statusDiv.textContent = '🏹 Готов'; break;
                    case 'handshake-ok':
                        statusDiv.textContent = '🏹 Тетива натянута!';
                        const urlParams = new URLSearchParams(window.location.search);
                        if (urlParams.get('id') && urlParams.get('key')) { statusDiv.textContent = '📨 Принимаю стрелу...'; sendToPong({ action: 'accept', id: urlParams.get('id'), key: urlParams.get('key') }); }
                        break;
                    case 'session-created':
                        clearTimeout(inviteTimer); inviteLink.textContent = data.fullLink;
                        invitePanel.classList.remove('hidden'); mainBtns.classList.add('hidden');
                        statusDiv.textContent = '🏹 Стрела готова!'; navigator.clipboard.writeText(data.fullLink).catch(() => {});
                        break;
                    case 'channel-open':
                        channelId = data.channelId; sessionSecret = data.secret;
                        statusDiv.textContent = '✅ Канал открыт!'; btnCall.classList.remove('hidden'); callLabelBtn.classList.remove('hidden');
                        invitePanel.classList.add('hidden'); mainBtns.classList.remove('hidden'); log('Канал: ' + channelId);
                        break;
                    case 'message':
                        if (!data.text || typeof data.text !== 'string') return;
                        if (data.text.startsWith('__OFFER__')) {
                            if (callActive) return;
                            const offer = JSON.parse(data.text.replace('__OFFER__', ''));
                            callPanel.classList.remove('hidden'); mainBtns.classList.add('hidden');
                            callStatus.textContent = '📞 Входящий вызов...'; callAccept.classList.remove('hidden'); playRingtone();
                            callAccept.onclick = async () => {
                                stopRingtone(); callStatus.textContent = '📞 Соединение...'; callAccept.classList.add('hidden'); playCallStart();
                                if (!await getLocalStream()) { hangup(); return; }
                                createPeerConn(); await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                                const answer = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answer);
                                sendCallSignal('__ANSWER__' + JSON.stringify(answer)); callActive = true;
                            };
                            return;
                        }
                        if (data.text.startsWith('__ANSWER__')) { stopRingback(); callStatus.textContent = '✅ Разговор'; const answer = JSON.parse(data.text.replace('__ANSWER__', '')); if (peerConnection) peerConnection.setRemoteDescription(new RTCSessionDescription(answer)); return; }
                        if (data.text.startsWith('__ICE__')) { const candidate = JSON.parse(data.text.replace('__ICE__', '')); if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) { peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => {}); } return; }
                        if (data.text === '__HANGUP__') { if (callActive) { hangup(); statusDiv.textContent = '📞 Собеседник завершил звонок'; } else { stopRingtone(); callPanel.classList.add('hidden'); mainBtns.classList.remove('hidden'); statusDiv.textContent = '📞 Вызов отменён'; } return; }
                        break;
                }
            });

            async function init() {
                const params = new URLSearchParams(window.location.search);
                channelId = params.get('channel'); sessionSecret = params.get('secret');
                const pongUrl = 'https://stepweather-prog.github.io/P2PPong/?v=' + Date.now();
                if (params.get('id')) pongUrl += '&id=' + params.get('id') + '&key=' + params.get('key');
                pongFrame.src = pongUrl;
                statusDiv.textContent = '🏹 Пробуждение...';
            }
            window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
