<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RobinCall P2P</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/avatars/001-.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <style>
        :root, [data-theme="forest"] { --bg-primary: #1a2a1f; --bg-secondary: #0d1a0c; --accent: #c4a24b; --accent-light: #e8d5a3; --text: #e8e2c7; --text-bright: #f5e6b8; --text-dim: #b8a87a; --border: #c4a24b; --btn-bg: rgba(196,162,75,0.1); --btn-border: rgba(196,162,75,0.3); --btn-hover: rgba(196,162,75,0.25); --sheet-bg: linear-gradient(145deg, #1e2a1a 0%, #0f180d 100%); --input-bg: rgba(20,30,18,0.9); --msg-bg: rgba(30,40,25,0.85); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--bg-primary); color: var(--text); font-family: 'Segoe UI', sans-serif; height:100vh; display:flex; flex-direction:column; }
        .header { background: rgba(25,35,20,0.96); border-bottom:2px solid var(--border); padding:8px 12px; display:flex; justify-content:space-between; align-items:center; }
        .header-title { color: var(--accent-light); font-weight:bold; }
        .btn { padding:10px 16px; border-radius:12px; background: var(--btn-bg); border:1px solid var(--btn-border); color:var(--text); cursor:pointer; font-size:14px; transition:all 0.2s; }
        .btn:hover { background: var(--btn-hover); border-color:var(--accent); }
        .btn.hidden { display:none; }
        .content { flex:1; padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:15px; }
        #status { font-size:1.1em; color:var(--text-dim); text-align:center; }
        .call-panel { display:flex; flex-direction:column; align-items:center; gap:15px; }
        .call-panel.hidden { display:none; }
        .call-btn { width:70px; height:70px; border-radius:50%; border:none; cursor:pointer; font-size:28px; transition:all 0.2s; }
        .call-btn.accept { background:rgba(76,175,80,0.3); border:2px solid #4caf50; }
        .call-btn.reject { background:rgba(244,67,54,0.3); border:2px solid #f44336; }
        .call-btn.end { background:rgba(244,67,54,0.5); border:2px solid #f44336; }
        .call-btn.speaker { background:rgba(196,162,75,0.3); border:2px solid var(--border); }
        .video-container { display:none; width:100%; max-width:400px; }
        .video-container video { width:100%; border-radius:12px; border:2px solid var(--border); }
        .settings-modal, .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:200; justify-content:center; align-items:center; }
        .settings-modal.active, .modal-overlay.active { display:flex; }
        .modal-dialog { background:var(--sheet-bg); padding:20px; border-radius:20px; width:85%; max-width:340px; border:2px solid var(--border); text-align:center; }
        iframe { display:none; }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-title">🏹 RobinCall</span>
        <button class="btn" id="btn-settings">⚙️</button>
    </div>

    <div class="content">
        <div id="status">🏹 Пробуждение...</div>
        <div id="main-btns">
            <button class="btn" id="btn-arrow">🏹 Стрела</button>
            <button class="btn hidden" id="btn-call">📞 Звонок</button>
            <button class="btn hidden" id="btn-video">📹 Видео</button>
            <button class="btn hidden" id="btn-file-send">📎 Файл</button>
        </div>
        <div id="call-panel" class="call-panel hidden">
            <div id="call-status">📞 Вызов...</div>
            <div style="display:flex; gap:20px;">
                <button class="call-btn accept" id="call-accept">📞</button>
                <button class="call-btn reject" id="call-end">❌</button>
                <button class="call-btn speaker" id="call-speaker">🔊</button>
                <button class="call-btn speaker" id="call-camera">📸</button>
                <button class="call-btn speaker" id="call-mic">🎤</button>
            </div>
        </div>
        <div class="video-container" id="local-video-container">
            <video id="local-video" autoplay muted playsinline></video>
        </div>
        <div class="video-container" id="remote-video-container">
            <video id="remote-video" autoplay playsinline></video>
        </div>
    </div>

    <div class="modal-overlay" id="invite-modal">
        <div class="modal-dialog">
            <h3>🏹 Стрела готова</h3>
            <div id="invite-link" style="word-break:break-all;margin:10px 0;font-family:monospace;"></div>
            <div id="qr-code"></div>
            <button class="btn" id="btn-share">Поделиться</button>
            <button class="btn" id="btn-close-invite">Закрыть</button>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal-dialog">
            <h3>Настройки</h3>
            <div style="margin:10px 0;">
                <label>🌐 Сервер: <span id="server-label">Render</span></label>
                <label class="toggle-switch"><input type="checkbox" id="server-toggle"><span class="toggle-slider"></span></label>
            </div>
            <div style="margin:10px 0;">
                <label>🔔 Звук <input type="checkbox" id="toggle-sound" checked></label>
            </div>
            <button class="btn" id="btn-custom-css">🎨 CSS</button>
            <button class="btn" id="btn-close-settings">Закрыть</button>
        </div>
    </div>

    <div class="modal-overlay" id="custom-css-modal">
        <div class="modal-dialog">
            <h3>Пользовательский CSS</h3>
            <textarea id="custom-css-input" style="width:100%;height:120px;"></textarea>
            <button class="btn" id="btn-save-custom-css">Сохранить</button>
            <button class="btn" id="btn-cancel-custom-css">Отмена</button>
        </div>
    </div>

    <div class="modal-overlay" id="p2p-qr-modal">
        <div class="modal-dialog">
            <h3>P2P QR</h3>
            <div id="p2p-qr-code"></div>
            <div id="p2p-link-display"></div>
            <button class="btn" id="btn-close-p2p-qr">Закрыть</button>
        </div>
    </div>

    <input type="file" id="file-input" style="display:none;" multiple>
    <iframe id="pong-frame" src="" style="display:none;" title="p2p engine"></iframe>

    <script>
        (function() {
            const PONGPONG_ORIGIN = 'https://stepweather-prog.github.io';
            const WORKERS_URL = 'https://robincall.stephanclaps-491.workers.dev';
            const RENDER_URL = 'https://p2ppong.onrender.com';
            
            const pongFrame = document.getElementById('pong-frame');
            const statusDiv = document.getElementById('status');
            const btnArrow = document.getElementById('btn-arrow');
            const btnCall = document.getElementById('btn-call');
            const btnVideo = document.getElementById('btn-video');
            const btnFileSend = document.getElementById('btn-file-send');
            const callPanel = document.getElementById('call-panel');
            const callStatus = document.getElementById('call-status');
            const callAccept = document.getElementById('call-accept');
            const callEnd = document.getElementById('call-end');
            const callSpeaker = document.getElementById('call-speaker');
            const callCamera = document.getElementById('call-camera');
            const callMic = document.getElementById('call-mic');
            const inviteModal = document.getElementById('invite-modal');
            const inviteLink = document.getElementById('invite-link');
            const qrCodeDiv = document.getElementById('qr-code');
            const btnShare = document.getElementById('btn-share');
            const btnCloseInvite = document.getElementById('btn-close-invite');
            const btnSettings = document.getElementById('btn-settings');
            const settingsModal = document.getElementById('settings-modal');
            const serverToggle = document.getElementById('server-toggle');
            const serverLabel = document.getElementById('server-label');
            const toggleSound = document.getElementById('toggle-sound');
            const customCssModal = document.getElementById('custom-css-modal');
            const customCssInput = document.getElementById('custom-css-input');
            const p2pQrModal = document.getElementById('p2p-qr-modal');
            const p2pQrCode = document.getElementById('p2p-qr-code');
            const p2pLinkDisplay = document.getElementById('p2p-link-display');
            const fileInput = document.getElementById('file-input');
            const localVideo = document.getElementById('local-video');
            const remoteVideo = document.getElementById('remote-video');
            const localVideoContainer = document.getElementById('local-video-container');
            const remoteVideoContainer = document.getElementById('remote-video-container');

            let currentServer = localStorage.getItem('robinhood_server') || 'render';
            let handshakeSecret = null, channelId = null, sessionSecret = null;
            let audioPool = {}, peerConnections = {}, localStreams = {}, dataChannels = {};
            let callActive = false, videoCallActive = false, speakerOn = true, cameraOn = true, micOn = true;
            let ringtoneAudio = null, ringbackAudio = null;

            function getAudio(filename) {
                if (!audioPool[filename]) { audioPool[filename] = new Audio('assets/sounds/' + filename); audioPool[filename].volume = 0.5; }
                const a = audioPool[filename]; a.currentTime = 0; return a;
            }
            function playSound(filename) { if (toggleSound?.checked) { getAudio(filename).play().catch(()=>{}); } }
            function playRingtone() { stopRingtone(); ringtoneAudio = getAudio('melodi.mp3'); ringtoneAudio.loop = true; ringtoneAudio.play().catch(()=>{}); }
            function stopRingtone() { if (ringtoneAudio) { ringtoneAudio.pause(); ringtoneAudio.loop = false; ringtoneAudio = null; } }
            function playRingback() { stopRingback(); ringbackAudio = getAudio('Welk.mp3'); ringbackAudio.loop = true; ringbackAudio.play().catch(()=>{}); }
            function stopRingback() { if (ringbackAudio) { ringbackAudio.pause(); ringbackAudio.loop = false; ringbackAudio = null; } }
            function playCallStart() { getAudio('open.mp3').volume = 0.7; getAudio('open.mp3').play().catch(()=>{}); }
            function playCallEnd() { getAudio('exet.mp3').volume = 0.7; getAudio('exet.mp3').play().catch(()=>{}); }

            function getIceServers() {
                return [
                    { urls: "stun:stun.l.google.com:19302" },
                    { urls: "stun:stun1.l.google.com:19302" },
                    { urls: ["turn:openrelay.metered.ca:80?transport=tcp","turn:openrelay.metered.ca:443?transport=tcp"], username:"openrelayproject", credential:"openrelayproject" }
                ];
            }

            async function getMediaStream(enableVideo) {
                try {
                    return await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true },
                        video: enableVideo
                    });
                } catch(e) { statusDiv.textContent = '❌ Нет доступа к микрофону/камере'; return null; }
            }

            function createPeerConn(stream, callId) {
                const pc = new RTCPeerConnection({ iceServers: getIceServers(), iceTransportPolicy: 'all' });
                if (stream) stream.getTracks().forEach(t => pc.addTrack(t, stream));
                pc.ontrack = e => {
                    if (e.streams && e.streams[0]) {
                        if (videoCallActive && callId === 'main') {
                            if (remoteVideo) remoteVideo.srcObject = e.streams[0];
                            if (remoteVideoContainer) remoteVideoContainer.style.display = 'block';
                        } else {
                            const a = new Audio(); a.srcObject = e.streams[0]; a.play().catch(()=>{});
                        }
                    }
                };
                pc.onicecandidate = e => { if (e.candidate) sendCallSignal('__ICE__' + JSON.stringify({ candidate: e.candidate, callId })); };
                pc.oniceconnectionstatechange = () => {
                    if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                        if (callStatus) callStatus.textContent = '✅ Разговор';
                    }
                    if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                        cleanupPeer(callId); if (callId === 'main') hangup();
                    }
                };
                return pc;
            }

            function setupDataChannel(dc, callId) {
                dataChannels[callId] = dc;
                dc.onmessage = e => {
                    try {
                        const msg = JSON.parse(e.data);
                        if (msg.type === 'file') {
                            if (statusDiv) statusDiv.textContent = '📎 Получен файл: ' + msg.name;
                            const byteString = atob(msg.data);
                            const ab = new ArrayBuffer(byteString.length); const ia = new Uint8Array(ab);
                            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
                            const blob = new Blob([ab], { type: msg.mime }); const url = URL.createObjectURL(blob);
                            const a = document.createElement('a'); a.href = url; a.download = msg.name; a.click();
                            setTimeout(() => URL.revokeObjectURL(url), 10000);
                        }
                    } catch(err) {}
                };
            }

            function cleanupPeer(callId) {
                if (peerConnections[callId]) { peerConnections[callId].close(); delete peerConnections[callId]; }
                if (localStreams[callId]) { localStreams[callId].getTracks().forEach(t => t.stop()); delete localStreams[callId]; }
                if (dataChannels[callId]) { try { dataChannels[callId].close(); } catch(e) {} delete dataChannels[callId]; }
            }

            function sendToPong(msg) {
                if (sessionSecret) msg.secret = sessionSecret;
                if (channelId) msg.channelId = channelId;
                if (handshakeSecret && msg.action === 'handshake') msg.handshake = handshakeSecret;
                msg.server = currentServer;
                if (pongFrame?.contentWindow) pongFrame.contentWindow.postMessage(msg, PONGPONG_ORIGIN);
            }
            function sendCallSignal(text) { sendToPong({ action: 'send', text, channelId }); }

            async function startCall(enableVideo) {
                if (callActive || !channelId || !sessionSecret) return;
                videoCallActive = enableVideo;
                const stream = await getMediaStream(enableVideo);
                if (!stream) return;
                localStreams['main'] = stream;
                if (enableVideo) { if (localVideo) localVideo.srcObject = stream; if (localVideoContainer) localVideoContainer.style.display = 'block'; }
                if (callPanel) callPanel.classList.remove('hidden');
                if (callStatus) callStatus.textContent = enableVideo ? '📹 Видеовызов...' : '📞 Вызов...';
                playRingback();
                const pc = createPeerConn(stream, 'main'); peerConnections['main'] = pc;
                try {
                    const dc = pc.createDataChannel('sherwood', { ordered: true }); setupDataChannel(dc, 'main');
                } catch(e) {}
                pc.ondatachannel = e => setupDataChannel(e.channel, 'main');
                const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
                sendCallSignal('__OFFER__' + JSON.stringify({ sdp: offer, video: enableVideo }));
                callActive = true;
            }

            function hangup() {
                callActive = false; videoCallActive = false;
                stopRingtone(); stopRingback(); playCallEnd(); sendCallSignal('__HANGUP__');
                Object.keys(peerConnections).forEach(k => cleanupPeer(k));
                Object.keys(localStreams).forEach(k => { if (localStreams[k]) localStreams[k].getTracks().forEach(t => t.stop()); });
                localStreams = {}; peerConnections = {}; dataChannels = {};
                if (callPanel) callPanel.classList.add('hidden');
                if (remoteVideo) remoteVideo.srcObject = null;
                if (localVideo) localVideo.srcObject = null;
                if (statusDiv) statusDiv.textContent = '📞 Звонок завершён';
            }

            function toggleSpeaker() { speakerOn = !speakerOn; if (callSpeaker) callSpeaker.textContent = speakerOn ? '🔊' : '🔇'; }
            function toggleCamera() { if (localStreams['main']) { cameraOn = !cameraOn; localStreams['main'].getVideoTracks().forEach(t => t.enabled = cameraOn); if (callCamera) callCamera.textContent = cameraOn ? '📸' : '🚫'; } }
            function toggleMic() { if (localStreams['main']) { micOn = !micOn; localStreams['main'].getAudioTracks().forEach(t => t.enabled = micOn); if (callMic) callMic.textContent = micOn ? '🎤' : '🔇'; } }

            btnCall?.addEventListener('click', () => { if (callActive) { hangup(); return; } startCall(false); });
            btnVideo?.addEventListener('click', () => { if (callActive) { hangup(); return; } startCall(true); });
            callEnd?.addEventListener('click', hangup);
            callSpeaker?.addEventListener('click', toggleSpeaker);
            callCamera?.addEventListener('click', toggleCamera);
            callMic?.addEventListener('click', toggleMic);

            btnFileSend?.addEventListener('click', () => fileInput?.click());
            fileInput?.addEventListener('change', () => {
                Array.from(fileInput.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const base64 = reader.result.split(',')[1];
                        const dc = dataChannels['main'];
                        if (dc && dc.readyState === 'open') {
                            dc.send(JSON.stringify({ type:'file', name:file.name, size:file.size, mime:file.type, data:base64 }));
                            if (statusDiv) statusDiv.textContent = '📎 Файл отправлен: ' + file.name;
                        }
                    };
                    reader.readAsDataURL(file);
                });
                fileInput.value = '';
            });

            function restoreSession() {
                const sc = localStorage.getItem('robincall_channel'), ss = localStorage.getItem('robincall_secret');
                if (sc && ss) { channelId = sc; sessionSecret = ss; btnCall?.classList.remove('hidden'); btnVideo?.classList.remove('hidden'); btnFileSend?.classList.remove('hidden'); statusDiv.textContent = '🔄 Канал восстановлен'; return true; }
                return false;
            }

            window.addEventListener('message', async (event) => {
                if (event.origin !== PONGPONG_ORIGIN) return;
                const data = event.data; if (!data || !data.type) return;
                switch (data.type) {
                    case 'pong-ready': handshakeSecret = data.handshake; sendToPong({ action: 'handshake' }); statusDiv.textContent = '🏹 Готов'; break;
                    case 'handshake-ok':
                        statusDiv.textContent = '🏹 Тетива натянута!';
                        if (restoreSession()) { sendToPong({ action: 'restore-channels' }); break; }
                        const urlParams = new URLSearchParams(window.location.search);
                        if (urlParams.get('id') && urlParams.get('key')) {
                            currentServer = urlParams.get('server') || 'render';
                            if (serverToggle) serverToggle.checked = currentServer === 'workers';
                            if (serverLabel) serverLabel.textContent = currentServer === 'workers' ? 'Workers' : 'Render';
                            statusDiv.textContent = '📨 Принимаю стрелу...';
                            sendToPong({ action: 'accept', id: urlParams.get('id'), key: urlParams.get('key'), server: currentServer });
                        }
                        break;
                    case 'session-created':
                        if (inviteLink) inviteLink.textContent = data.fullLink;
                        if (qrCodeDiv) { qrCodeDiv.innerHTML = ''; if (typeof QRCode !== 'undefined') new QRCode(qrCodeDiv, { text: data.fullLink, width:120, height:120, colorDark:'#c4a24b', colorLight:'#0a1208' }); }
                        if (inviteModal) inviteModal.classList.add('active');
                        navigator.clipboard.writeText(data.fullLink).catch(()=>{}); break;
                    case 'channel-open':
                        channelId = data.channelId; sessionSecret = data.secret;
                        btnCall?.classList.remove('hidden'); btnVideo?.classList.remove('hidden'); btnFileSend?.classList.remove('hidden');
                        localStorage.setItem('robincall_channel', channelId); localStorage.setItem('robincall_secret', sessionSecret);
                        if (inviteModal) inviteModal.classList.remove('active');
                        statusDiv.textContent = '✅ Канал открыт!'; break;
                    case 'channel-restored':
                        channelId = data.channelId; sessionSecret = data.secret;
                        btnCall?.classList.remove('hidden'); btnVideo?.classList.remove('hidden'); btnFileSend?.classList.remove('hidden');
                        localStorage.setItem('robincall_channel', channelId); localStorage.setItem('robincall_secret', sessionSecret);
                        statusDiv.textContent = '🔄 Канал восстановлен'; break;
                    case 'restored-channels':
                        if (data.channels?.length) {
                            const ch = data.channels[0]; channelId = ch.channelId; sessionSecret = ch.secret;
                            btnCall?.classList.remove('hidden'); btnVideo?.classList.remove('hidden'); btnFileSend?.classList.remove('hidden');
                            localStorage.setItem('robincall_channel', channelId); localStorage.setItem('robincall_secret', sessionSecret);
                            statusDiv.textContent = '🔄 Канал восстановлен (' + data.channels.length + ')';
                        } break;
                    case 'message':
                        if (!data.text || typeof data.text !== 'string') return;
                        if (data.text.startsWith('__OFFER__')) {
                            if (callActive) return;
                            const parsed = JSON.parse(data.text.replace('__OFFER__','')); const offer = parsed.sdp || parsed;
                            videoCallActive = parsed.video || false;
                            if (callPanel) callPanel.classList.remove('hidden');
                            if (callStatus) callStatus.textContent = videoCallActive ? '📹 Входящий видеовызов...' : '📞 Входящий вызов...';
                            playRingtone();
                            callAccept.onclick = async () => {
                                stopRingtone(); callStatus.textContent = '📞 Соединение...'; playCallStart();
                                const stream = await getMediaStream(videoCallActive);
                                if (!stream) { hangup(); return; }
                                localStreams['main'] = stream;
                                if (videoCallActive) { if (localVideo) localVideo.srcObject = stream; if (localVideoContainer) localVideoContainer.style.display = 'block'; }
                                const pc = createPeerConn(stream, 'main'); peerConnections['main'] = pc;
                                pc.ondatachannel = e => setupDataChannel(e.channel, 'main');
                                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                                const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
                                sendCallSignal('__ANSWER__' + JSON.stringify(answer)); callActive = true;
                            };
                            return;
                        }
                        if (data.text.startsWith('__ANSWER__')) { stopRingback(); callStatus.textContent = '✅ Разговор';
                            const answer = JSON.parse(data.text.replace('__ANSWER__',''));
                            if (peerConnections['main']) peerConnections['main'].setRemoteDescription(new RTCSessionDescription(answer)).catch(()=>{}); return;
                        }
                        if (data.text.startsWith('__ICE__')) {
                            try {
                                const iceData = JSON.parse(data.text.replace('__ICE__',''));
                                const candidate = iceData.candidate || iceData;
                                if (peerConnections['main']) peerConnections['main'].addIceCandidate(new RTCIceCandidate(candidate)).catch(()=>{});
                            } catch(e) {} return;
                        }
                        if (data.text === '__HANGUP__') { if (callActive) { hangup(); statusDiv.textContent = '📞 Собеседник завершил звонок'; } else { stopRingtone(); if (callPanel) callPanel.classList.add('hidden'); statusDiv.textContent = '📞 Вызов отменён'; } return; }
                        break;
                }
            });

            btnArrow?.addEventListener('click', () => {
                if (!handshakeSecret && !channelId) { statusDiv.textContent = '⏳ Ждите подключения...'; return; }
                statusDiv.textContent = '⚒ Крафт стрелы...'; sendToPong({ action: 'create' });
            });

            btnShare?.addEventListener('click', () => { const link = inviteLink?.textContent; if (link && navigator.share) navigator.share({ title:'RobinCall', url:link }).catch(()=>{}); });
            btnCloseInvite?.addEventListener('click', () => { inviteModal?.classList.remove('active'); });
            btnSettings?.addEventListener('click', () => settingsModal?.classList.add('active'));
            document.getElementById('btn-close-settings')?.addEventListener('click', () => settingsModal?.classList.remove('active'));

            if (serverToggle) { serverToggle.checked = currentServer === 'workers'; if (serverLabel) serverLabel.textContent = currentServer === 'workers' ? 'Workers' : 'Render'; }
            serverToggle?.addEventListener('change', () => { currentServer = serverToggle.checked ? 'workers' : 'render'; localStorage.setItem('robinhood_server', currentServer); if (serverLabel) serverLabel.textContent = currentServer === 'workers' ? 'Workers' : 'Render'; });

            document.getElementById('btn-custom-css')?.addEventListener('click', () => { if (customCssInput) customCssInput.value = localStorage.getItem('robincall_custom_css')||''; customCssModal?.classList.add('active'); });
            document.getElementById('btn-save-custom-css')?.addEventListener('click', () => { const css = customCssInput?.value.trim(); localStorage.setItem('robincall_custom_css', css); customCssModal?.classList.remove('active'); });
            document.getElementById('btn-cancel-custom-css')?.addEventListener('click', () => customCssModal?.classList.remove('active'));
            document.getElementById('btn-close-p2p-qr')?.addEventListener('click', () => p2pQrModal?.classList.remove('active'));

            window.addEventListener('beforeunload', () => { if (callActive) sendCallSignal('__HANGUP__'); stopRingtone(); stopRingback(); });

            async function init() {
                const params = new URLSearchParams(window.location.search);
                channelId = params.get('channel'); sessionSecret = params.get('secret');
                if (!channelId || !sessionSecret) restoreSession();
                else { localStorage.setItem('robincall_channel', channelId); localStorage.setItem('robincall_secret', sessionSecret); }
                let pongUrl = 'https://stepweather-prog.github.io/P2PPong/?v=' + Date.now();
                if (params.get('id')) pongUrl += '&id=' + params.get('id') + '&key=' + params.get('key');
                if (pongFrame) pongFrame.src = pongUrl;
                statusDiv.textContent = '🏹 Пробуждение...';
            }
            window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
