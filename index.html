<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RobinCall 🏹</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', 'Inter', 'Georgia', serif; }
        body { background: linear-gradient(135deg, #1a2a1f 0%, #0d1a0c 100%); color: #e8e2c7; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; position: relative; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('../assets/background.webp'); background-size: cover; background-position: center; background-repeat: no-repeat; z-index: 0; opacity: 0.3; }
        body::after { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, rgba(30,40,25,0.6), rgba(10,20,8,0.9)); z-index: 0; }
        .container { position: relative; z-index: 1; text-align: center; padding: 20px; width: 100%; max-width: 400px; }
        h1 { font-size: 2em; background: linear-gradient(135deg, #e8d5a3, #c4a24b); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 10px; }
        .status { color: #b8a87a; font-size: 1em; margin: 15px 0; min-height: 30px; }
        .btn { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #c4a24b; cursor: pointer; font-size: 30px; display: flex; align-items: center; justify-content: center; margin: 15px auto; transition: all 0.3s; background: rgba(196, 162, 75, 0.15); color: #e8e2c7; }
        .btn:active { transform: scale(0.95); background: rgba(196, 162, 75, 0.3); }
        .btn-call { border-color: #4caf50; color: #4caf50; }
        .btn-hangup { border-color: #f44336; color: #f44336; }
        .btn-answer { border-color: #4caf50; color: #4caf50; }
        .btn-reject { border-color: #f44336; color: #f44336; }
        .hidden { display: none !important; }
        .controls { display: flex; gap: 25px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
        .ripple { animation: ripple 1.5s infinite; }
        @keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.5); } 70% { box-shadow: 0 0 0 25px rgba(76, 175, 80, 0); } 100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); } }
        .link-box { background: rgba(0,0,0,0.5); border: 1px solid #c4a24b; border-radius: 8px; padding: 8px 12px; margin: 10px 0; word-break: break-all; font-family: monospace; font-size: 0.8em; color: #e8d5a3; display: none; }
        .link-box.active { display: block; }
        .btn-small { width: auto; height: auto; padding: 10px 20px; border-radius: 8px; font-size: 0.9em; margin: 5px; cursor: pointer; background: rgba(196, 162, 75, 0.2); border: 1px solid #c4a24b; color: #e8e2c7; }
        .voice-btn { background: #4a3a2a; border-color: #c4a24b; color: #e8e2c7; width: 60px; height: 60px; border-radius: 50%; font-size: 24px; }
        .voice-btn.recording { background: #f44336; border-color: #b71c1c; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .server-toggle { margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏹 RobinCall</h1>
        <div class="status" id="status">Ожидание...</div>

        <button class="btn-small" id="btn-create-arrow">🏹 Создать стрелу</button>
        <div class="link-box" id="link-box">
            <div id="invite-link"></div>
            <button class="btn-small" id="btn-copy-link">📋 Копировать</button>
        </div>

        <button class="btn btn-call hidden" id="btn-call" title="Позвонить">📞</button>

        <div class="controls hidden" id="incoming-controls">
            <button class="btn btn-answer" id="btn-answer" title="Принять">📞</button>
            <button class="btn btn-reject" id="btn-reject" title="Отклонить">❌</button>
        </div>

        <div class="controls hidden" id="active-controls">
            <button class="btn btn-hangup ripple" id="btn-hangup" title="Завершить">📞</button>
        </div>

        <!-- Голосовые сообщения -->
        <div id="voice-controls" class="hidden">
            <button class="voice-btn" id="btn-voice-record" title="Записать голосовое">🎤</button>
        </div>

        <div class="server-toggle">
            <span>Сервер:</span>
            <select id="server-select">
                <option value="workers">Workers (Warp)</option>
                <option value="render">Render</option>
            </select>
        </div>

        <div class="debug" id="debug"></div>
    </div>

    <iframe id="pong-frame" src="" style="display:none;" title="p2p engine"></iframe>

    <script>
        (function() {
            const PONGPONG_ORIGIN = 'https://stepweather-prog.github.io';

            const statusDiv = document.getElementById('status');
            const btnCall = document.getElementById('btn-call');
            const btnCreateArrow = document.getElementById('btn-create-arrow');
            const linkBox = document.getElementById('link-box');
            const inviteLink = document.getElementById('invite-link');
            const btnCopyLink = document.getElementById('btn-copy-link');
            const btnHangup = document.getElementById('btn-hangup');
            const btnAnswer = document.getElementById('btn-answer');
            const btnReject = document.getElementById('btn-reject');
            const incomingControls = document.getElementById('incoming-controls');
            const activeControls = document.getElementById('active-controls');
            const pongFrame = document.getElementById('pong-frame');
            const voiceControls = document.getElementById('voice-controls');
            const btnVoiceRecord = document.getElementById('btn-voice-record');
            const serverSelect = document.getElementById('server-select');

            const iceServers = [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
                { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
            ];

            let peerConnection = null, localStream = null, handshakeSecret = null, channelId = null, sessionSecret = null;
            let callActive = false, pendingIceCandidates = {};
            let currentServer = 'workers'; // default Workers
            let voiceRecorder = null, voiceChunks = [], isRecording = false;

            // Инициализация сервера из localStorage, если есть
            try { const s = localStorage.getItem('robincall_server'); if (s === 'render' || s === 'workers') currentServer = s; } catch(e) {}
            serverSelect.value = currentServer;
            serverSelect.addEventListener('change', () => {
                currentServer = serverSelect.value;
                localStorage.setItem('robincall_server', currentServer);
                // переподключение не требуется, просто меняем флаг для следующих отправок
                statusDiv.textContent = '🌐 Сервер: ' + (currentServer === 'workers' ? 'Workers' : 'Render');
            });

            async function getLocalStream() {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
                    return true;
                } catch (e) { statusDiv.textContent = '❌ Нет доступа к микрофону'; return false; }
            }

            function createPeerConnection() {
                if (peerConnection) { peerConnection.close(); peerConnection = null; }
                peerConnection = new RTCPeerConnection({ iceServers });
                if (localStream) localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
                peerConnection.ontrack = e => {
                    const a = new Audio(); a.srcObject = e.streams[0]; a.play().catch(() => {});
                    statusDiv.textContent = '✅ Разговор';
                };
                peerConnection.onicecandidate = e => {
                    if (e.candidate) sendToPong({ action: 'send', text: '__ICE__' + JSON.stringify(e.candidate), channelId });
                };
                peerConnection.onconnectionstatechange = () => {
                    if (peerConnection.connectionState === 'failed' || peerConnection.connectionState === 'disconnected') hangup();
                };
            }

            function flushIceCandidates() {
                if (!peerConnection || !peerConnection.remoteDescription || !peerConnection.remoteDescription.type) return;
                const candidates = pendingIceCandidates[channelId] || [];
                for (const c of candidates) peerConnection.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
                delete pendingIceCandidates[channelId];
            }

            async function startOutgoingCall() {
                if (callActive) return;
                statusDiv.textContent = '📞 Вызов...'; btnCall.classList.add('hidden'); activeControls.classList.remove('hidden');
                if (!await getLocalStream()) return;
                createPeerConnection();
                const offer = await peerConnection.createOffer(); await peerConnection.setLocalDescription(offer);
                sendToPong({ action: 'send', text: '__OFFER__' + JSON.stringify(offer), channelId });
                callActive = true;
            }

            // Принятие входящего вызова
            async function acceptIncomingCall(incomingOffer) {
                if (callActive) return;
                statusDiv.textContent = '📞 Соединение...';
                incomingControls.classList.add('hidden');
                activeControls.classList.remove('hidden');
                if (!await getLocalStream()) { hangup(); return; }
                createPeerConnection();
                await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: incomingOffer.sdp || incomingOffer }));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                sendToPong({ action: 'send', text: '__ANSWER__' + JSON.stringify(answer), channelId });
                callActive = true;
                flushIceCandidates();
            }

            function hangup() {
                callActive = false;
                statusDiv.textContent = '📞 Звонок завершён';
                activeControls.classList.add('hidden');
                incomingControls.classList.add('hidden');
                btnCall.classList.remove('hidden');
                voiceControls.classList.add('hidden');
                sendToPong({ action: 'send', text: '__HANGUP__', channelId });
                if (peerConnection) { peerConnection.close(); peerConnection = null; }
                if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
                pendingIceCandidates = {};
            }

            function sendToPong(msg) {
                if (sessionSecret) msg.secret = sessionSecret;
                if (channelId) msg.channelId = channelId;
                if (handshakeSecret && msg.action === 'handshake') msg.handshake = handshakeSecret;
                msg.server = currentServer;
                if (pongFrame.contentWindow) pongFrame.contentWindow.postMessage(msg, PONGPONG_ORIGIN);
            }

            // Голосовые сообщения
            btnVoiceRecord.addEventListener('click', () => {
                if (isRecording) {
                    voiceRecorder.stop();
                    return;
                }
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    voiceRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm; codecs=opus' });
                    voiceChunks = [];
                    voiceRecorder.ondataavailable = e => voiceChunks.push(e.data);
                    voiceRecorder.onstop = () => {
                        const blob = new Blob(voiceChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = () => {
                            const base64 = reader.result.split(',')[1];
                            sendToPong({ action: 'send', text: '__FILE__' + JSON.stringify({
                                type: 'file', name: 'voice.webm', size: blob.size, mime: 'audio/webm', data: base64
                            }), channelId });
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(t => t.stop());
                        isRecording = false;
                        btnVoiceRecord.classList.remove('recording');
                        btnVoiceRecord.textContent = '🎤';
                    };
                    voiceRecorder.start();
                    isRecording = true;
                    btnVoiceRecord.classList.add('recording');
                    btnVoiceRecord.textContent = '⏺';
                    // Автостоп через 30 сек
                    setTimeout(() => { if (voiceRecorder && voiceRecorder.state === 'recording') voiceRecorder.stop(); }, 30000);
                }).catch(() => statusDiv.textContent = '❌ Нет доступа к микрофону');
            });

            window.addEventListener('message', async e => {
                if (e.origin !== PONGPONG_ORIGIN || e.source !== pongFrame.contentWindow) return;
                const data = e.data;
                switch (data.type) {
                    case 'pong-ready':
                        handshakeSecret = data.handshake;
                        sendToPong({ action: 'handshake' });
                        statusDiv.textContent = '🏹 Готов';
                        btnCreateArrow.classList.remove('hidden');
                        if (channelId && sessionSecret) {
                            btnCall.classList.remove('hidden');
                            voiceControls.classList.remove('hidden');
                        }
                        break;
                    case 'session-created':
                        inviteLink.textContent = data.fullLink;
                        linkBox.classList.add('active');
                        statusDiv.textContent = '🏹 Стрела готова!';
                        navigator.clipboard.writeText(data.fullLink).catch(() => {});
                        break;
                    case 'channel-open':
                        channelId = data.channelId;
                        sessionSecret = data.secret;
                        try { sessionStorage.setItem('robincall_channel', channelId); sessionStorage.setItem('robincall_secret', sessionSecret); } catch(e) {}
                        statusDiv.textContent = '✅ Канал открыт!';
                        btnCreateArrow.classList.add('hidden');
                        linkBox.classList.remove('active');
                        btnCall.classList.remove('hidden');
                        voiceControls.classList.remove('hidden');
                        break;
                    case 'message':
                        if (!data.text || typeof data.text !== 'string') return;
                        if (data.text.startsWith('__OFFER__')) {
                            if (callActive) return;
                            const offer = JSON.parse(data.text.replace('__OFFER__', ''));
                            statusDiv.textContent = '📞 Входящий вызов...';
                            btnCall.classList.add('hidden');
                            incomingControls.classList.remove('hidden');
                            voiceControls.classList.add('hidden');
                            // Сохраняем оффер для принятия
                            incomingOffer = offer;
                            break;
                        }
                        if (data.text.startsWith('__ANSWER__')) {
                            if (!peerConnection) return;
                            const answer = JSON.parse(data.text.replace('__ANSWER__', ''));
                            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                            statusDiv.textContent = '✅ Разговор';
                            voiceControls.classList.remove('hidden');
                            flushIceCandidates();
                            break;
                        }
                        if (data.text.startsWith('__ICE__')) {
                            if (!peerConnection) return;
                            try {
                                const c = JSON.parse(data.text.replace('__ICE__', ''));
                                if (!pendingIceCandidates[channelId]) pendingIceCandidates[channelId] = [];
                                pendingIceCandidates[channelId].push(c);
                                flushIceCandidates();
                            } catch(e) {}
                            break;
                        }
                        if (data.text === '__HANGUP__') {
                            statusDiv.textContent = '📞 Собеседник завершил звонок';
                            hangup();
                            break;
                        }
                        if (data.text.startsWith('__FILE__')) {
                            try {
                                const fileData = JSON.parse(data.text.replace('__FILE__', ''));
                                if (fileData.mime && fileData.mime.startsWith('audio/')) {
                                    const audio = new Audio(`data:${fileData.mime};base64,${fileData.data}`);
                                    audio.play().catch(() => {});
                                    statusDiv.textContent = '🔊 Голосовое сообщение';
                                }
                            } catch(e) {}
                            break;
                        }
                        break;
                    case 'error':
                        statusDiv.textContent = '⚠ ' + data.text;
                        break;
                }
            });

            btnCall.addEventListener('click', startOutgoingCall);
            btnHangup.addEventListener('click', hangup);
            btnAnswer.addEventListener('click', () => {
                if (incomingOffer) acceptIncomingCall(incomingOffer);
            });
            btnReject.addEventListener('click', () => {
                sendToPong({ action: 'send', text: '__HANGUP__', channelId });
                hangup();
            });
            btnCreateArrow.addEventListener('click', () => {
                statusDiv.textContent = '⚒ Создание стрелы...';
                sendToPong({ action: 'create' });
            });
            btnCopyLink.addEventListener('click', () => {
                navigator.clipboard.writeText(inviteLink.textContent).then(() => statusDiv.textContent = '📋 Ссылка скопирована!').catch(() => {});
            });

            let incomingOffer = null; // хранит входящий оффер до принятия

            async function init() {
                const p = new URLSearchParams(location.search);
                channelId = p.get('channel');
                sessionSecret = p.get('secret');
                // сервер из URL или localStorage или дефолт
                const urlServer = p.get('server');
                if (urlServer === 'workers' || urlServer === 'render') currentServer = urlServer;
                if (!channelId || !sessionSecret) {
                    try {
                        channelId = sessionStorage.getItem('robincall_channel');
                        sessionSecret = sessionStorage.getItem('robincall_secret');
                    } catch(e) {}
                }
                const url = new URL('https://stepweather-prog.github.io/P2PPong/');
                url.searchParams.set('v', Date.now());
                if (p.get('id')) {
                    url.searchParams.set('id', p.get('id'));
                    url.searchParams.set('key', p.get('key'));
                }
                pongFrame.src = url.toString();
                statusDiv.textContent = '🏹 Пробуждение...';
            }
            window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
