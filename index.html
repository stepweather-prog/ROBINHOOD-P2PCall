<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RobinCall v3.4</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/avatars/001-.png">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self' https://p2ppong.onrender.com https://robincall.stephanclaps-491.workers.dev https://stepweather-prog.github.io blob:; img-src 'self' data: blob:;">
    <style>
        :root { --bg-primary: #1a2a1f; --bg-secondary: #0d1a0c; --accent: #c4a24b; --accent-light: #e8d5a3; --text: #e8e2c7; --text-bright: #f5e6b8; --text-dim: #b8a87a; --border: #c4a24b; --btn-bg: rgba(196,162,75,0.1); --btn-border: rgba(196,162,75,0.3); --btn-hover: rgba(196,162,75,0.25); --sheet-bg: linear-gradient(145deg, #1e2a1a 0%, #0f180d 100%); --input-bg: rgba(20,30,18,0.9); --robin-bg: rgba(50,70,40,0.9); --robin-accent: #e8c97a; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html,body { height:100%; overflow:hidden; font-family:'Segoe UI','Inter','Georgia',serif; }
        body { background:linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%); color:var(--text); display:flex; flex-direction:column; height:100dvh; position:relative; }
        body::before { content:""; position:fixed; top:0; left:0; width:100%; height:100%; background-image:url('assets/background.webp'); background-size:cover; background-position:center; background-repeat:no-repeat; z-index:0; opacity:0.35; }
        body::after { content:""; position:fixed; top:0; left:0; width:100%; height:100%; background:radial-gradient(circle at 50% 50%, rgba(30,40,25,0.6), rgba(10,20,8,0.9)); z-index:0; }

        .header { background:linear-gradient(135deg, rgba(25,35,20,0.96), rgba(15,25,12,0.98)); border-bottom:2px solid var(--border); backdrop-filter:blur(8px); z-index:10; padding:6px 10px; display:flex; flex-direction:column; gap:4px; }
        .header-top { display:flex; align-items:center; gap:8px; }
        .header-title { font-size:1.1em; font-weight:bold; background:linear-gradient(135deg, var(--accent-light), var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .header-status { margin-left:auto; display:flex; align-items:center; gap:4px; font-size:0.6em; color:var(--text-dim); }
        .connection-dot { width:7px; height:7px; border-radius:50%; }
        .connection-dot.online { background:#4caf50; box-shadow:0 0 5px #4caf50; }
        .connection-dot.offline { background:#f44336; }
        .connection-dot.checking { background:#ff9800; animation:pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .header-btns { display:flex; justify-content:space-around; align-items:center; }
        .header-btn { width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:10px; background:var(--btn-bg); border:1px solid var(--btn-border); transition:all 0.2s; }
        .header-btn:hover { background:var(--btn-hover); }
        .header-btn img { width:100%; height:100%; object-fit:contain; padding:5px; }
        .header-labels { display:flex; justify-content:space-around; }
        .header-label { font-size:0.5em; color:var(--text-dim); text-align:center; width:38px; }
        .header-avatar { width:26px; height:26px; border-radius:50%; object-fit:cover; border:2px solid var(--border); }

        .main-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; z-index:1; padding:15px; gap:12px; }
        .robin-row { background:var(--robin-bg); border-left:3px solid var(--robin-accent); border-radius:14px; padding:10px 14px; display:flex; align-items:center; gap:10px; max-width:90%; }
        .robin-avatar { width:40px; height:40px; border-radius:50%; border:2px solid var(--robin-accent); object-fit:cover; }
        .robin-text { font-weight:700; font-size:0.8em; color:var(--text-bright); }
        .status-text { font-size:0.85em; color:var(--accent-light); text-align:center; min-height:22px; }
        .call-timer { font-size:1.4em; font-weight:bold; color:#4caf50; font-family:monospace; }
        .btn-round { width:75px; height:75px; border-radius:50%; border:3px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.3s; background:var(--btn-bg); }
        .btn-round:hover { background:var(--btn-hover); box-shadow:0 0 30px rgba(196,162,75,0.4); transform:scale(1.08); }
        .btn-round img { width:100%; height:100%; object-fit:contain; padding:12px; }
        .btn-call { border-color:#4caf50; }
        .btn-hangup { border-color:#f44336; background:rgba(244,67,54,0.2); }
        .btn-main { width:85px; height:85px; border-radius:50%; border:3px solid var(--accent); cursor:pointer; background:var(--btn-bg); display:flex; align-items:center; justify-content:center; transition:all 0.3s; }
        .btn-main:hover { background:var(--btn-hover); box-shadow:0 0 35px rgba(196,162,75,0.5); transform:scale(1.08); }
        .btn-main img { width:100%; height:100%; object-fit:contain; padding:14px; }
        .hidden { display:none!important; }
        .controls-row { display:flex; gap:20px; align-items:center; justify-content:center; }

        .avatar-selector { position:fixed; top:0; left:0; width:min(85%, 340px); height:100%; background:var(--sheet-bg); border-right:2px solid var(--border); z-index:200; transform:translateX(-100%); transition:transform 0.3s ease; overflow-y:auto; backdrop-filter:blur(16px); box-shadow:8px 0 30px rgba(0,0,0,0.5); }
        .avatar-selector.show { transform:translateX(0); }
        .avatar-selector p { color:var(--accent-light); margin:16px; font-size:1em; text-align:center; }
        #avatar-list { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; padding:10px; }
        .avatar-option { width:50px; height:50px; border-radius:50%; object-fit:cover; margin:3px; cursor:pointer; border:2px solid transparent; transition:all 0.2s; }
        .avatar-option:hover { border-color:var(--accent-light); transform:scale(1.1); }
        .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); display:none; z-index:190; }
        .overlay.show { display:block; }

        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); z-index:300; justify-content:center; align-items:center; }
        .modal-overlay.active { display:flex; }
        .modal-dialog { background:var(--sheet-bg); padding:20px; border-radius:20px; width:85%; max-width:340px; text-align:center; border:2px solid var(--border); }
        .modal-dialog h3 { color:var(--accent-light); margin:0 0 12px; }
        .modal-dialog input { width:100%; padding:10px; margin-bottom:10px; background:var(--input-bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; outline:none; }
        .modal-dialog .modal-btns { display:flex; gap:8px; }
        .modal-dialog .modal-btns button { flex:1; padding:10px; border:none; border-radius:10px; font-size:13px; font-weight:bold; cursor:pointer; }
        .btn-primary { background:linear-gradient(135deg, var(--accent), #b8903a); color:#1a1f0f; }
        .btn-dark { background:#4a3a2a; color:#eee; }

        .code-display { background:#0a1208; border:1px solid var(--border); color:var(--accent-light); border-radius:10px; padding:10px; font-size:0.7em; word-break:break-all; margin:12px 0; font-family:monospace; user-select:all; }

        #pong-frame { display:none !important; position:fixed !important; top:-9999px !important; left:-9999px !important; width:1px !important; height:1px !important; opacity:0 !important; pointer-events:none !important; visibility:hidden !important; border:none !important; z-index:-1 !important; }
    </style>
</head>
<body>
<div class="header">
    <div class="header-top">
        <span class="header-title">RobinCall</span>
        <div class="header-status"><span class="connection-dot checking" id="connection-dot"></span><span id="connection-label">Проверка...</span></div>
    </div>
    <div class="header-btns">
        <div class="header-btn" id="btn-avatar-menu"><img src="assets/avatars/001-.png" class="header-avatar" id="profile-avatar-small" alt="avatar" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><span style="display:none;">🏹</span></div>
        <div class="header-btn" id="btn-arrow-create"><img src="assets/3.png" alt="arrow" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><span style="display:none;">🏹</span></div>
        <div class="header-btn" id="btn-call-main"><img src="assets/phone-go.png" alt="call" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><span style="display:none;">📞</span></div>
        <div class="header-btn" id="btn-video-circle"><span style="font-size:18px;">📹</span></div>
        <div class="header-btn" id="btn-clear-reset"><img src="assets/6.png" alt="clear" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><span style="display:none;">🔄</span></div>
    </div>

</div>
<div class="main-area">
    <div class="robin-row"><img src="assets/avatars/231-icon-11433690.png" class="robin-avatar" alt="Robin" onerror="this.src='assets/avatars/001-.png';"><div><div style="font-weight:900;font-size:0.85em;">Robin Hood</div><div class="robin-text" id="robin-message">Колчан готов!</div></div></div>
    <div class="status-text" id="call-status"></div>

    <div class="controls-row hidden" id="incoming-row"><button class="btn-round btn-call" id="btn-answer"><img src="assets/phone-go.png" alt="accept" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><span style="display:none;">📞</span></button><button class="btn-round btn-hangup" id="btn-reject"><img src="assets/phone-stop.png" alt="reject" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><span style="display:none;">✕</span></button></div>
    <div class="controls-row hidden" id="active-row"><button class="btn-round btn-hangup" id="btn-end-call"><img src="assets/phone-stop.png" alt="end" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><span style="display:none;">📞</span></button></div>
    <div class="controls-row hidden" id="audio-controls" style="gap:12px;"><button class="header-btn" id="btn-mic" style="width:44px;height:44px;font-size:20px;">🎤</button><button class="header-btn" id="btn-speaker" style="width:44px;height:44px;font-size:20px;">🔊</button></div>
</div>
<div class="modal-overlay" id="ref-modal"><div class="modal-dialog"><h3>🏹 Стрела готова!</h3><div class="code-display" id="ref-link-display"></div><button class="btn-primary" id="btn-copy-link-modal">📋 Копировать</button><button class="btn-primary" id="btn-share-link">📤 Поделиться</button><button class="btn-dark" id="btn-close-modal">Закрыть</button></div></div>
<div class="modal-overlay" id="nick-modal"><div class="modal-dialog"><h3>🏷 Сменить ник</h3><input type="text" id="nick-input" placeholder="Ваш ник (макс. 12 символов)" maxlength="12" autocomplete="off"><div class="modal-btns"><button class="btn-dark" id="btn-nick-cancel">Отмена</button><button class="btn-primary" id="btn-nick-save">✓ Сохранить</button></div></div></div>
<div class="avatar-selector" id="avatar-selector"><p>🏹 Выбери лучника 🏹</p><div id="avatar-list"></div></div>
<div class="overlay" id="overlay"></div>
<iframe id="pong-frame" src="about:blank" style="display:none;position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;visibility:hidden;border:none;z-index:-1;" title="p2p"></iframe>

<script>
(function(){'use strict';
const P2PPONG_URL='https://stepweather-prog.github.io/P2PPong/';
const RENDER_SERVER='https://p2ppong.onrender.com';
const WORKERS_URL='https://robincall.stephanclaps-491.workers.dev';
const $=s=>document.getElementById(s);
const pongFrame=$('pong-frame'),robinMessage=$('robin-message'),callStatus=$('call-status'),callTimer=$('call-timer');
const connectionDot=$('connection-dot'),connectionLabel=$('connection-label');
const btnMainAction=$('btn-main-action'),btnAnswer=$('btn-answer'),btnReject=$('btn-reject'),btnEndCall=$('btn-end-call');
const btnMic=$('btn-mic'),btnSpeaker=$('btn-speaker'),btnArrowCreate=$('btn-arrow-create'),btnCallMain=$('btn-call-main');
const btnVideoCircle=$('btn-video-circle'),btnClearReset=$('btn-clear-reset');
const incomingRow=$('incoming-row'),activeRow=$('active-row'),audioControls=$('audio-controls');
const refModal=$('ref-modal'),refLinkDisplay=$('ref-link-display');
const avatarSelector=$('avatar-selector'),avatarList=$('avatar-list'),overlay=$('overlay');
const profileAvatarSmall=$('profile-avatar-small'),nickLabel=$('nick-label');
const nickModal=$('nick-modal'),nickInput=$('nick-input');
const btnAvatarMenu=$('btn-avatar-menu');

const ICE=[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:["turn:openrelay.metered.ca:80?transport=tcp","turn:openrelay.metered.ca:443?transport=tcp"],username:"openrelayproject",credential:"openrelayproject"}];

let pc=null,stream=null,handshake=null,chId=null,sec=null,srv='render',active=!1,tStart=null,tInt=null,mic=!0,spk=!0,offer=null,link=null,ready=!1,online=!1;
let videoCircleRecorder=null,videoCircleChunks=[],autoConnectDone=!1;
const MAX_VIDEO_CIRCLE_DURATION=30,MAX_NICK_LENGTH=12;
try{srv=localStorage.getItem('robinhood_server')||'render'}catch(e){}

// Аудиопул
let audioPool={};
function getAudio(filename){if(!audioPool[filename]){audioPool[filename]=new Audio('assets/sounds/'+filename);audioPool[filename].volume=0.5}const a=audioPool[filename];a.currentTime=0;return a}
function playSound(filename){try{getAudio(filename).play().catch(()=>{})}catch(e){}}

function log(m){console.log('[RC]',m)}
function rMsg(m){if(robinMessage)robinMessage.textContent=m;log(m)}
function conn(s){if(connectionDot)connectionDot.className='connection-dot '+s;if(connectionLabel)connectionLabel.textContent=s==='online'?'Готов':s==='offline'?'Нет связи':'Проверка...'}

async function api(m,p,b){const url=srv==='workers'?WORKERS_URL:RENDER_SERVER;const c=new AbortController(),t=setTimeout(()=>c.abort(),srv==='workers'?5000:10000);try{const o={method:m,headers:{'Content-Type':'application/json'},signal:c.signal};if(b)o.body=JSON.stringify(b);const r=await fetch(url+p,o);clearTimeout(t);return r.ok?await r.json():null}catch(e){clearTimeout(t);return null}}
async function chkSrv(){conn('checking');online=(await api('GET','/ping'))!==null;conn(online?'online':'offline');return online}
function swSrv(s){if(s===srv)return;srv=s;try{localStorage.setItem('robinhood_server',srv)}catch(e){}rMsg('🔄 Сервер: '+(s==='workers'?'Workers':'Render'))}

function send(m){if(!m)return;if(chId&&sec){m.secret=sec;m.channelId=chId}if(handshake&&m.action==='handshake')m.handshake=handshake;pongFrame.contentWindow?.postMessage(m,'*')}
async function getStream(video=false){try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:!0,noiseSuppression:!0,autoGainControl:!0},video:video});return!0}catch(e){rMsg('❌ Нет доступа к микрофону/камере');return!1}}
function mkPC(){if(pc){pc.close();pc=null}pc=new RTCPeerConnection({iceServers:ICE,iceTransportPolicy:'all'});if(stream)stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{if(e.streams[0]){const a=new Audio();a.srcObject=e.streams[0];a.play().catch(()=>{})}};pc.onicecandidate=e=>{if(e.candidate)send({action:'send',text:'__ICE__'+JSON.stringify(e.candidate),channelId:chId})};pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){active=!0;tStart=Date.now();timer();ui('active');if(callStatus)callStatus.textContent='✅ Разговор';playSound('open.mp3')}else if(pc.connectionState==='disconnected'||pc.connectionState==='failed')hang(!1)};return pc}

function mkQ(){if(!online){rMsg('⚠ Сервер офлайн');return}rMsg('⚒ Куём стрелу...');btnMainAction.disabled=!0;send({action:'create'})}
async function call(){if(!ready||!chId){rMsg('⚠ Создайте стрелу');return}if(callStatus)callStatus.textContent='📞 Вызов...';ui('calling');if(!await getStream(!1)){ui('ready');return}mkPC();try{const o=await pc.createOffer();await pc.setLocalDescription(o);send({action:'send',text:'__OFFER__'+JSON.stringify(o),channelId:chId});playSound('Welk.mp3')}catch(e){hang(!0)}}
async function accept(){if(!offer)return;ui('active');if(!await getStream(!1)){ui('ready');return}mkPC();try{await pc.setRemoteDescription(new RTCSessionDescription(offer));const a=await pc.createAnswer();await pc.setLocalDescription(a);send({action:'send',text:'__ANSWER__'+JSON.stringify(a),channelId:chId});offer=null}catch(e){hang(!0)}}
function hang(sig=!0){active=!1;if(tInt){clearInterval(tInt);tInt=null}if(callTimer){callTimer.classList.add('hidden');callTimer.textContent='00:00'}if(sig&&chId)send({action:'send',text:'__HANGUP__',channelId:chId});if(pc){pc.close();pc=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}offer=null;if(callStatus)callStatus.textContent='';ui('ready');playSound('exet.mp3')}
function timer(){if(callTimer)callTimer.classList.remove('hidden');tInt=setInterval(()=>{const e=Math.floor((Date.now()-tStart)/1000);if(callTimer)callTimer.textContent=Math.floor(e/60).toString().padStart(2,'0')+':'+(e%60).toString().padStart(2,'0')},1000)}
function accArrow(id,key){if(!id){rMsg('⚠ ID колчана');return}rMsg('🔍 Поиск...');send({action:'accept',id:id,key:key||''})}

// Сброс канала (сохраняет аватар и ник)
function resetSession(){if(active)hang(!0);chId=null;sec=null;link=null;ready=!1;offer=null;autoConnectDone=!1;ui('idle');rMsg('🏹 Канал сброшен')}

function cp(){if(link){navigator.clipboard.writeText(link).then(()=>rMsg('📋 Скопировано')).catch(()=>{});refModal.classList.add('active')}else rMsg('⚠ Создайте стрелу')}
async function shr(){if(link&&navigator.share)try{await navigator.share({title:'RobinCall',text:'Звонок!',url:link})}catch(e){}else cp()}

function sendVideoCircle(videoData){if(!chId||!sec)return;const payload={type:'video-circle',name:'video_circle.webm',size:videoData.size,mime:'video/webm',data:videoData.data};send({action:'send',text:'__FILE__'+JSON.stringify(payload),channelId:chId});rMsg('📹 Кружок отправлен')}
function startVideoCircle(){if(videoCircleRecorder?.state==='recording'){videoCircleRecorder.stop();btnVideoCircle.style.background='';return}navigator.mediaDevices.getUserMedia({video:!0,audio:!0}).then(st=>{videoCircleRecorder=new MediaRecorder(st,{mimeType:'video/webm; codecs=vp8,opus'});videoCircleChunks=[];videoCircleRecorder.ondataavailable=e=>videoCircleChunks.push(e.data);videoCircleRecorder.onstop=()=>{const blob=new Blob(videoCircleChunks,{type:'video/webm'});const reader=new FileReader();reader.onload=()=>{sendVideoCircle({size:blob.size,data:reader.result.split(',')[1]})};reader.readAsDataURL(blob);st.getTracks().forEach(t=>t.stop());videoCircleRecorder=null;btnVideoCircle.style.background=''};videoCircleRecorder.start();btnVideoCircle.style.background='#f44336';setTimeout(()=>{if(videoCircleRecorder?.state==='recording')videoCircleRecorder.stop()},MAX_VIDEO_CIRCLE_DURATION*1000)}).catch(()=>rMsg('❌ Нет камеры'))}

function ui(s){btnMainAction.classList.add('hidden');incomingRow.classList.add('hidden');activeRow.classList.add('hidden');audioControls.classList.add('hidden');btnMainAction.disabled=!1;if(s==='idle'){btnMainAction.classList.remove('hidden');if(callStatus)callStatus.textContent='🏹 Создайте стрелу'}else if(s==='ready'){btnMainAction.classList.remove('hidden');if(callStatus)callStatus.textContent='📞 Готово!'}else if(s==='calling'){activeRow.classList.remove('hidden');audioControls.classList.remove('hidden')}else if(s==='incoming'){incomingRow.classList.remove('hidden');if(callStatus)callStatus.textContent='📞 Входящий!'}else if(s==='active'){activeRow.classList.remove('hidden');audioControls.classList.remove('hidden')}}

window.addEventListener('message',async e=>{
    if(e.source!==pongFrame.contentWindow)return;const d=e.data;
    if(d.type==='pong-ready'){handshake=d.handshake;send({action:'handshake'});conn('online');if(!autoConnectDone){ui('idle');rMsg('🏹 Готов!')}}
    else if(d.type==='handshake-ok'){
        if(!autoConnectDone){const urlParams=new URLSearchParams(location.search);const sid=urlParams.get('id');const key=urlParams.get('key');if(sid){const refServer=urlParams.get('server')||srv;if(refServer!==srv){srv=refServer;localStorage.setItem('robinhood_server',srv)}autoConnectDone=true;accArrow(sid,key)}else{ui('idle')}}
    }
    else if(d.type==='session-created'){chId=d.sessionId;sec=d.secret;link=d.fullLink;ready=!0;rMsg('✅ Стрела!');conn('online');if(refLinkDisplay)refLinkDisplay.textContent=d.fullLink;refModal.classList.add('active');ui('ready');navigator.clipboard.writeText(link).catch(()=>{})}
    else if(d.type==='channel-open'){chId=d.channelId;sec=d.secret;ready=!0;rMsg('✅ Подключено!');conn('online');ui('ready')}
    else if(d.type==='message'&&d.text){
        if(d.text.startsWith('__OFFER__')){if(active||pc){send({action:'send',text:'__HANGUP__',channelId:chId});return}try{offer=JSON.parse(d.text.replace('__OFFER__',''));ui('incoming');playSound('melodi.mp3')}catch(e){}}
        else if(d.text.startsWith('__ANSWER__')&&pc){try{await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(d.text.replace('__ANSWER__',''))));active=!0;tStart=Date.now();timer();ui('active')}catch(e){}}
        else if(d.text.startsWith('__ICE__')&&pc){try{await pc.addIceCandidate(new RTCIceCandidate(JSON.parse(d.text.replace('__ICE__',''))))}catch(e){}}
        else if(d.text==='__HANGUP__'){if(active||pc){rMsg('📞 Собеседник завершил');hang(!1)}}
        else if(d.text.startsWith('__FILE__')){try{const fd=JSON.parse(d.text.replace('__FILE__',''));if(fd.type==='video-circle')rMsg('📹 Видео-кружок получен')}catch(e){}}
    }else if(d.type==='error'){rMsg('⚠ '+d.text);btnMainAction.disabled=!1;ui('idle')}
});

async function init(){
    log('RobinCall v3.4');conn('checking');
    const savedServer=localStorage.getItem('robinhood_server');if(savedServer){srv=savedServer}
    await chkSrv();pongFrame.src=P2PPONG_URL+'?v='+Date.now();pongFrame.style.display='none';
    if(online){ui('idle');rMsg('🏹 Готов!')}else{rMsg('⚠ Сервер офлайн')}
}
window.addEventListener('beforeunload',()=>{if(active)send({action:'send',text:'__HANGUP__',channelId:chId});if(pc)pc.close();if(stream)stream.getTracks().forEach(t=>t.stop())});
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init();
})();
