<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2a">
    <title>RobinCall — Звонки</title>
    <link rel="icon" type="image/png" href="assets/icons/16icon.png">
    <script src="lottie.min.js"></script>
    <style>
        :root {
            --bg: #1a1a2a;
            --bg2: #0d0d1a;
            --accent: #4caf50;
            --accent2: #6b7db3;
            --danger: #f44336;
            --text: #c8d0f0;
            --text2: #8090b0;
            --gold: #c4a24b;
            --btn: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { height:100%; overflow:hidden; font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }
        
        /* Экран ожидания */
        #idle-screen {
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            height:100dvh; gap:30px; padding:20px;
        }
        .logo-text {
            font-size:2em; font-weight:bold;
            background:linear-gradient(135deg, var(--gold), var(--accent2));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .status-text {
            font-size:0.9em; color:var(--text2); text-align:center;
            background:rgba(0,0,0,0.3); padding:12px 20px; border-radius:20px;
            max-width:300px;
        }
        
        /* Кнопки */
        .btn {
            width:70px; height:70px; border-radius:50%; border:2px solid var(--border);
            background:var(--btn); cursor:pointer; display:flex;
            align-items:center; justify-content:center; font-size:30px;
            transition:all 0.15s; backdrop-filter:blur(8px);
        }
        .btn:active { transform:scale(0.9); }
        .btn-call {
            width:90px; height:90px; border-color:var(--accent);
            background:rgba(76,175,80,0.15); box-shadow:0 0 30px rgba(76,175,80,0.2);
        }
        .btn-end {
            width:80px; height:80px; border-color:var(--danger);
            background:rgba(244,67,54,0.15); box-shadow:0 0 30px rgba(244,67,54,0.2);
        }
        .btn-accept {
            width:80px; height:80px; border-color:var(--accent);
            background:rgba(76,175,80,0.2); box-shadow:0 0 30px rgba(76,175,80,0.3);
        }
        .btn-reject {
            width:80px; height:80px; border-color:var(--danger);
            background:rgba(244,67,54,0.2); box-shadow:0 0 30px rgba(244,67,54,0.3);
        }
        
        /* Экран звонка */
        #call-screen {
            display:none; flex-direction:column; align-items:center; justify-content:center;
            height:100dvh; gap:20px; padding:20px;
        }
        #call-screen.active { display:flex; }
        .call-avatar {
            width:100px; height:100px; border-radius:50%; object-fit:cover;
            border:3px solid var(--gold); animation:pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow:0 0 20px rgba(196,162,75,0.3); }
            50% { box-shadow:0 0 40px rgba(196,162,75,0.6); }
        }
        .call-name { font-size:1.2em; font-weight:bold; }
        .call-timer { font-size:1.5em; font-family:monospace; color:var(--accent2); }
        .call-status { font-size:0.9em; color:var(--text2); }
        
        .row { display:flex; gap:30px; align-items:center; }
        .hidden { display:none !important; }
        
        /* Модалки */
        .modal {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center;
        }
        .modal.active { display:flex; }
        .modal-box {
            background:linear-gradient(145deg, #1a1a28, #0d0d18);
            padding:20px; border-radius:20px; width:85%; max-width:350px;
            text-align:center; border:2px solid var(--border);
        }
        .modal-box h3 { color:var(--gold); margin-bottom:12px; }
        .modal-box button {
            width:100%; padding:12px; margin:4px 0; border:none; border-radius:10px;
            font-weight:bold; cursor:pointer; font-size:0.9em;
        }
        .btn-primary { background:var(--accent2); color:#fff; }
        .btn-dark { background:#4a3a2a; color:#eee; }
        .code {
            background:rgba(0,0,0,0.3); border:1px solid var(--border);
            color:var(--gold); border-radius:10px; padding:10px;
            font-size:0.8em; word-break:break-all; margin:8px 0; font-family:monospace;
        }
        input[type="text"] {
            width:100%; padding:10px; background:rgba(0,0,0,0.3);
            border:1px solid var(--border); color:var(--text);
            border-radius:10px; font-size:0.9em; margin:4px 0; outline:none;
        }
        input[type="text"]:focus { border-color:var(--accent2); }
        .toggle-row { display:flex; align-items:center; justify-content:space-between; padding:10px; }
        .toggle {
            width:44px; height:24px; background:rgba(128,128,128,0.2);
            border-radius:12px; cursor:pointer; position:relative; border:2px solid var(--border);
        }
        .toggle.on { background:var(--accent); }
        .toggle::after {
            content:''; position:absolute; width:16px; height:16px; background:white;
            border-radius:50%; top:2px; left:2px; transition:0.2s;
        }
        .toggle.on::after { left:22px; }
        
        .verify-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-width:200px; margin:10px auto; }
        .verify-btn { width:55px; height:55px; font-size:1.4em; border-radius:12px; border:none; background:rgba(255,255,255,0.1); color:var(--text); cursor:pointer; }
        .verify-btn:active { background:rgba(255,255,255,0.2); }
        .verify-display { font-size:2em; font-family:monospace; letter-spacing:6px; color:var(--gold); margin:8px 0; }
    </style>
</head>
<body>

<!-- ЭКРАН ОЖИДАНИЯ -->
<div id="idle-screen">
    <div class="logo-text">🏹 RobinCall</div>
    <div class="status-text" id="status-text">Создайте канал или подключитесь к другу</div>
    <button class="btn btn-call" id="btn-main" onclick="handleMainAction()">📞</button>
    <div style="font-size:0.7em; color:var(--text2);">Нажмите чтобы создать канал</div>
</div>

<!-- ЭКРАН ЗВОНКА -->
<div id="call-screen">
    <img class="call-avatar" id="call-avatar" src="assets/icons/01icon.png">
    <div class="call-name" id="call-name">Лучник</div>
    <div class="call-status" id="call-status"></div>
    <div class="call-timer hidden" id="call-timer">00:00</div>
    
    <!-- Входящий -->
    <div class="row hidden" id="incoming-buttons">
        <button class="btn btn-reject" onclick="hangup(true)">✕</button>
        <button class="btn btn-accept" onclick="acceptCall()">📞</button>
    </div>
    
    <!-- Исходящий -->
    <div class="row hidden" id="outgoing-button">
        <button class="btn btn-end" onclick="hangup(true)">✕</button>
    </div>
    
    <!-- Активный разговор -->
    <div class="row hidden" id="active-buttons">
        <button class="btn" id="btn-mic" onclick="toggleMic()">🎤</button>
        <button class="btn btn-end" onclick="hangup(true)">✕</button>
        <button class="btn" id="btn-speaker" onclick="toggleSpeaker()">🔊</button>
    </div>
</div>

<!-- МОДАЛКА СОЗДАНИЯ КАНАЛА -->
<div class="modal" id="craft-modal">
    <div class="modal-box">
        <h3>🏹 Создать канал</h3>
        <button class="btn-primary" onclick="craftChannel()">Создать стрелу</button>
        <div class="code" id="craft-id"></div>
        <div class="code hidden" id="craft-code" style="font-size:1.5em;letter-spacing:6px;"></div>
        <button class="btn-dark" onclick="copyCraft()">📋 Копировать</button>
        <input type="text" id="join-input" placeholder="ID друга...">
        <button class="btn-primary" onclick="joinChannel()">Подключиться</button>
        <button class="btn-dark" onclick="closeModal('craft-modal')">Закрыть</button>
    </div>
</div>

<!-- МОДАЛКА ВЕРИФИКАЦИИ -->
<div class="modal" id="verify-modal">
    <div class="modal-box">
        <h3>🔐 Подтверждение</h3>
        <div>Сравните код с собеседником</div>
        <div class="verify-display" id="verify-display">_______</div>
        <div class="verify-grid" id="verify-grid"></div>
        <button class="btn-primary" onclick="confirmVerify()">✅ Подтвердить</button>
        <button class="btn-dark" onclick="closeModal('verify-modal')">Закрыть</button>
    </div>
</div>

<!-- СКРИПТЫ -->
<script src="firebase-config.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, off } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    const app = initializeApp(window.FIREBASE_CONFIG || {});
    const db = getDatabase(app);
    signInAnonymously(getAuth(app)).then(() => console.log('🔥 Firebase OK'));
    window.firebaseDB = db; window.firebaseRef = ref; window.firebaseSet = set;
    window.firebaseGet = get; window.firebaseOnValue = onValue; window.firebaseOff = off;
</script>
<script src="crypto-worker.js"></script>
<script src="p2ppong.js"></script>
<script src="robincall-ui.js"></script>
</body>
</html>
