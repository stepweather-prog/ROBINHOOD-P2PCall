async function sha256(text){const data=new TextEncoder().encode(text);const hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('')}

async function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('P2PPongSecure',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('identity'))req.result.createObjectStore('identity',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}

const fp=[navigator.userAgent,screen.width,screen.height,navigator.hardwareConcurrency||2].join('|');let salt=localStorage.getItem('robinhood_salt');if(!salt){salt=crypto.randomUUID?.()||Math.random().toString(36).substring(2)+Date.now().toString(36);localStorage.setItem('robinhood_salt',salt)}
const raw=fp+'|'+salt;const hash=await sha256(raw);peerId=hash.substring(0,16);try{const db=await openDB();db.transaction('identity','readwrite').objectStore('identity').put({id:'peerId',value:peerId})}catch(e){}return peerId}
async function deriveKey(secret){const hash=await sha256(secret);const keyBytes=new TextEncoder().encode(hash.substring(0,32));return await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function encryptPacket(plaintext,secret){try{const key=await deriveKey(secret);const iv=crypto.getRandomValues(new Uint8Array(12));const encoded=new TextEncoder().encode(plaintext);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,encoded);const combined=new Uint8Array(iv.length+new Uint8Array(ct).length);combined.set(iv);combined.set(new Uint8Array(ct),iv.length);return '🔐'+btoa(String.fromCharCode(...combined))}catch(e){return plaintext}}
async function decryptPacket(enc,secret){if(!enc||!enc.startsWith('🔐'))return null;try{const key=await deriveKey(secret);const combined=Uint8Array.from(atob(enc.substring(2)),c=>c.charCodeAt(0));const iv=combined.slice(0,12);const ct=combined.slice(12);const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);return new TextDecoder().decode(dec)}catch(e){return null}}
async function apiCall(serverId,method,path,body=null){const server=SERVERS.find(s=>s.id===serverId);if(!server)return null;const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),serverId==='workers'?5000:10000);try{const opts={method,headers:{'Content-Type':'application/json'},signal:ctrl.signal};if(body)opts.body=JSON.stringify(body);const res=await fetch(server.url+path,opts);clearTimeout(t);if(!res.ok)return null;return await res.json()}catch(e){clearTimeout(t);return null}}
function startPolling(sid,serverId){if(pollIntervals[sid])return;let lastTime=Date.now();const poll=async()=>{const srv=serverId||channels[sid]?.server;const res=await apiCall(srv,'GET','/message?id='+sid+'&since='+lastTime);if(!res?.messages)return;for(const m of res.messages){const ch=channels[sid];if(!ch)continue;let dec=await decryptPacket(m.packet,ch.sessionSecret);if(!dec){try{dec=JSON.parse(m.packet).text||m.packet}catch(e){dec=m.packet}}let sender=null,text=dec;try{const p=JSON.parse(dec);sender=p.sender;text=p.text||dec}catch(e){}if(sender===sessionId){lastTime=Math.max(lastTime,m.time>9999999999?m.time:m.time*1000);continue}if(callbacks.onMessage)callbacks.onMessage({text,channelId:sid,sender});lastTime=Math.max(lastTime,m.time>9999999999?m.time:m.time*1000)}};poll();pollIntervals[sid]=setInterval(poll,4000)}
function stopPolling(sid){if(pollIntervals[sid]){clearInterval(pollIntervals[sid]);delete pollIntervals[sid]}}
async function createArrow(){await ensureInit();const tempKey=generateToken();const tempKeyHash=await sha256(tempKey);const secret=tempKey;const results=[];for(const s of SERVERS){const body=s.id==='workers'?{tempKeyHash,publicId:peerId}:{tempKey:tempKey,tempKeyHash,publicId:peerId};const res=await apiCall(s.id,'POST','/beacon',body);if(res?.sessionId)results.push({sessionId:res.sessionId,server:s.id})}if(!results.length){if(callbacks.onError)callbacks.onError({text:'Серверы не отвечают'});return}const primary=results[0];const sid=primary.sessionId;channels[sid]={status:'waiting',sessionSecret:secret,server:primary.server,peerId,allServers:results.map(r=>r.server),lastActivity:Date.now()};const serversParam=results.map(r=>r.server).join(',');const fullLink=`https://stepweather-prog.github.io/ROBINHOOD-P2P/?id=${sid}&servers=${serversParam}&peer=${peerId}&key=${tempKey}`;if(callbacks.onSessionCreated)callbacks.onSessionCreated({fullLink,peerId,key:tempKey,sessionId:sid,secret});let matched=!1;const start=Date.now();while(Date.now()-start<90000){const checks=await Promise.all(results.map(r=>apiCall(r.server,'GET','/beacon?id='+r.sessionId)));if(checks.some(c=>c?.matched)){matched=!0;break}await new Promise(r=>setTimeout(r,5000))}if(!matched){delete channels[sid];if(callbacks.onError)callbacks.onError({text:'Таймаут ожидания'});return}channels[sid].status='open';channels[sid].lastActivity=Date.now();startPolling(sid,channels[sid].server);if(callbacks.onChannelOpen)callbacks.onChannelOpen({channelId:sid,role:'creator',peerId,secret})}
async function acceptArrow(peerIdFromLink,tempKey){await ensureInit();const keyHash=await sha256(tempKey);const secret=tempKey;const params=new URLSearchParams(window.location.search);const serversList=(params.get('servers')||'render,workers').split(',');const sid=params.get('id');for(const srvId of serversList){const body=srvId==='workers'?{tempKeyHash:keyHash}:{tempKey};const res=await apiCall(srvId,'POST','/find',body);if(res?.status==='matched'){const cid=res.sessionId||sid;channels[cid]={status:'open',sessionSecret:secret,server:srvId,peerId:peerIdFromLink,lastActivity:Date.now()};startPolling(cid,srvId);if(callbacks.onChannelOpen)callbacks.onChannelOpen({channelId:cid,role:'receiver',peerId:peerIdFromLink,secret});return}}if(callbacks.onError)callbacks.onError({text:'Маяк не найден'})}
async function sendMessage(channelId,text){await ensureInit();const ch=channels[channelId];if(!ch){if(callbacks.onError)callbacks.onError({text:'Канал не найден',channelId});return}const payload=JSON.stringify({text,sender:sessionId,time:Date.now()});const encrypted=await encryptPacket(payload,ch.sessionSecret);const res=await apiCall(ch.server,'POST','/message',{sessionId:channelId,packet:encrypted});if(!res){delete channels[channelId];stopPolling(channelId);if(callbacks.onError)callbacks.onError({text:'session_not_found',channelId})}else{ch.lastActivity=Date.now()}}
function on(event,cb){callbacks[event]=cb}
function getPeerId(){return peerId}
function getSessionId(){return sessionId}
function getChannels(){return channels}
async function ensureInit(){if(!isInitialized)await init()}
async function init(){if(isInitialized)return;sessionId=generateToken();await getOrCreatePeerId();isInitialized=!0;log('P2PPong готов. PeerId: '+peerId.substring(0,10)+'...');if(callbacks.onReady)callbacks.onReady({peerId})}
if(typeof window!=='undefined')init().catch(e=>console.error('[P2PPong]',e));
window.P2PPong={init,createArrow,acceptArrow,sendMessage,on,getPeerId,getSessionId,getChannels};

(function(){
const MAX_VOICE_DURATION=60,MAX_VIDEO_DURATION=30;
let robinMessage,callTimerEl,connectionDot,connectionLabel,btnMainAction,btnAnswer,btnReject,btnEndCall,btnMic,btnSpeaker,btnCallMain,btnVideoCircle,btnVoice,incomingRow,activeRow,audioControls,refModal,refLinkDisplay,avatarSelector,avatarList,overlay,profileAvatarSmall,nickLabel,nickModal,nickInput,contactsSheet,contactsListInner,settingsSheet,toggleSound,themeIcon,themeName,voiceTimerOverlay,videoCirclePlayer,videoCircleVideo,videoCircleClose,peerIdInput,btnConnectPeer,safetyCode,recentMsgs;
let activeChannelId=null,activeSecret=null,pc=null,stream=null,callActive=!1,callStartTime=null,callTimerInterval=null,micOn=!0,speakerOn=!0,incomingOffer=null,currentLink=null,toggleSoundState=!0;
let voiceRecorder=null,voiceChunks=[],voiceStream=null,voiceRecording=!1,voiceSeconds=0,voiceTimerInterval=null;
let videoCircleRecorder=null,videoCircleChunks=[],audioPool={};

function $(s){return document.getElementById(s)}
function rMsg(m,t=0){if(robinMessage){robinMessage.textContent=m;if(t>0)setTimeout(()=>{if(robinMessage.textContent===m)robinMessage.textContent='Колчан готов!'},t)}}
function conn(s,pc){if(connectionDot)connectionDot.className='connection-dot '+s;if(connectionLabel)connectionLabel.textContent=s==='online'?'Готов':s==='offline'?'Нет связи':'Проверка...';const pi=$('peer-indicator');if(pi&&pc!==undefined)pi.textContent='🏹×'+pc}
function getAudio(f){if(!audioPool[f]){audioPool[f]=new Audio('assets/sounds/'+f);audioPool[f].volume=0.5}const a=audioPool[f];a.currentTime=0;return a}
function playSound(f){if(toggleSoundState)try{getAudio(f).play().catch(()=>{})}catch(e){}}
function playRingtone(){playSound('melodi.mp3')}
function playRingback(){playSound('Welk.mp3')}

function ui(s){
    btnMainAction?.classList.add('hidden');incomingRow?.classList.add('hidden');activeRow?.classList.add('hidden');audioControls?.classList.add('hidden');
    btnMainAction?.classList.remove('ringing');
    if(s==='idle'){btnMainAction?.classList.remove('hidden');btnMainAction.querySelector('span').textContent='🏹'}
    else if(s==='ready'){btnMainAction?.classList.remove('hidden');btnMainAction.querySelector('span').textContent='📞'}
    else if(s==='calling'){activeRow?.classList.remove('hidden');audioControls?.classList.remove('hidden');btnMainAction.querySelector('span').textContent='📞'}
    else if(s==='active'){activeRow?.classList.remove('hidden');audioControls?.classList.remove('hidden');btnMainAction.querySelector('span').textContent='📞'}

async function getMediaStream(){try{return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:!0,noiseSuppression:!0}})}catch(e){rMsg('❌ Нет доступа',4000);return null}}

function createPC(){if(pc){pc.close();pc=null}pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});if(stream)stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{if(e.streams[0]){const a=new Audio();a.srcObject=e.streams[0];a.play().catch(()=>{})}};pc.onicecandidate=e=>{if(e.candidate&&activeChannelId)P2PPong.sendMessage(activeChannelId,'__ICE__'+JSON.stringify(e.candidate))};pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){callActive=!0;callStartTime=Date.now();startCallTimer();ui('active');playSound('open.mp3');rMsg('✅ Разговор',0)}if(pc.connectionState==='disconnected'||pc.connectionState==='failed'){hang(!1)}};return pc}

function startCallTimer(){callTimerEl.classList.remove('hidden');callTimerInterval=setInterval(()=>{const e=Math.floor((Date.now()-callStartTime)/1000);callTimerEl.textContent=Math.floor(e/60).toString().padStart(2,'0')+':'+(e%60).toString().padStart(2,'0')},1000)}
function stopCallTimer(){if(callTimerInterval)clearInterval(callTimerInterval);callTimerEl.classList.add('hidden');callTimerEl.textContent='00:00'}

async function startCall(){
    if(callActive)return;
    if(!activeChannelId||!P2PPong.getChannels()[activeChannelId]){rMsg('⚠ Создайте стрелу (кнопка 🏹)',4000);return}
    ui('calling');playRingback();
    const s=await getMediaStream();if(!s){ui('ready');return}
    stream=s;createPC();
    try{const o=await pc.createOffer();await pc.setLocalDescription(o);P2PPong.sendMessage(activeChannelId,'__OFFER__'+JSON.stringify(o))}catch(e){hang(!0)}
}
async function acceptCall(){
    if(!incomingOffer)return;
    ui('active');const s=await getMediaStream();if(!s){ui('ready');return}
    stream=s;createPC();
    try{await pc.setRemoteDescription(new RTCSessionDescription(incomingOffer));const a=await pc.createAnswer();await pc.setLocalDescription(a);P2PPong.sendMessage(activeChannelId,'__ANSWER__'+JSON.stringify(a));incomingOffer=null;callActive=!0;callStartTime=Date.now();startCallTimer();playSound('open.mp3')}catch(e){hang(!0)}
}
function hang(sendSignal=!0){
    callActive=!1;stopCallTimer();
    if(sendSignal&&activeChannelId)P2PPong.sendMessage(activeChannelId,'__HANGUP__');
    if(pc){pc.close();pc=null}
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    incomingOffer=null;ui('ready');playSound('exet.mp3');rMsg('📞 Звонок завершён',3000)
}

function startVoiceTimer(){voiceSeconds=0;$('voice-timer-overlay').style.display='block';voiceTimerInterval=setInterval(()=>{voiceSeconds++;const m=Math.floor(voiceSeconds/60),s=(voiceSeconds%60).toString().padStart(2,'0');$('voice-timer-overlay').textContent='🎤 '+m+':'+s;if(voiceSeconds>=MAX_VOICE_DURATION)stopVoiceRecording()},1000)}
function stopVoiceTimer(){if(voiceTimerInterval)clearInterval(voiceTimerInterval);$('voice-timer-overlay').style.display='none'}
function startVoiceRecording(){
    if(voiceRecording)return;
    navigator.mediaDevices.getUserMedia({audio:!0}).then(st=>{
        voiceStream=st;voiceRecorder=new MediaRecorder(st,{mimeType:'audio/webm',audioBitsPerSecond:16000});voiceChunks=[];
        voiceRecorder.ondataavailable=e=>voiceChunks.push(e.data);
        voiceRecorder.onstop=()=>{const blob=new Blob(voiceChunks,{type:'audio/webm'});stopVoiceTimer();if(blob.size>100&&blob.size<50000&&activeChannelId){const r=new FileReader();r.onload=()=>P2PPong.sendMessage(activeChannelId,'__FILE__'+JSON.stringify({type:'audio',data:r.result.split(',')[1],mime:'audio/webm'}));r.readAsDataURL(blob)}if(voiceStream){voiceStream.getTracks().forEach(t=>t.stop());voiceStream=null}voiceRecorder=null;voiceRecording=!1;if(btnVoice)btnVoice.style.background=''};
        voiceRecorder.start();voiceRecording=!0;startVoiceTimer();if(btnVoice)btnVoice.style.background='#f44336'
    }).catch(()=>rMsg('❌ Нет микрофона',3000))
}
function stopVoiceRecording(){if(voiceRecorder?.state==='recording'){voiceRecorder.stop();stopVoiceTimer()}}
function startVideoCircle(){
    if(videoCircleRecorder?.state==='recording'){videoCircleRecorder.stop();if(btnVideoCircle)btnVideoCircle.style.background='';return}
    navigator.mediaDevices.getUserMedia({video:!0,audio:!0}).then(st=>{
        videoCircleRecorder=new MediaRecorder(st,{mimeType:'video/webm; codecs=vp8,opus',videoBitsPerSecond:50000});videoCircleChunks=[];
        videoCircleRecorder.ondataavailable=e=>videoCircleChunks.push(e.data);
        videoCircleRecorder.onstop=()=>{const blob=new Blob(videoCircleChunks,{type:'video/webm'});if(blob.size<50000&&activeChannelId){const r=new FileReader();r.onload=()=>P2PPong.sendMessage(activeChannelId,'__FILE__'+JSON.stringify({type:'video-circle',data:r.result.split(',')[1],mime:'video/webm'}));r.readAsDataURL(blob)}st.getTracks().forEach(t=>t.stop());videoCircleRecorder=null;if(btnVideoCircle)btnVideoCircle.style.background=''};
        videoCircleRecorder.start();if(btnVideoCircle)btnVideoCircle.style.background='#f44336';setTimeout(()=>{if(videoCircleRecorder?.state==='recording')videoCircleRecorder.stop()},MAX_VIDEO_DURATION*1000)
    }).catch(()=>rMsg('❌ Нет камеры',3000))
}

        if(!d.text)return;
        if(d.text.startsWith('__OFFER__')){if(callActive||pc){P2PPong.sendMessage(d.channelId,'__HANGUP__');return}try{incomingOffer=JSON.parse(d.text.replace('__OFFER__',''));ui('incoming');playRingtone();rMsg('📞 Входящий звонок!',0)}catch(e){}return}
        if(d.text.startsWith('__ANSWER__')&&pc){try{await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(d.text.replace('__ANSWER__',''))));callActive=!0;callStartTime=Date.now();startCallTimer();ui('active');playSound('open.mp3');rMsg('✅ Разговор',0)}catch(e){}return}
        if(d.text.startsWith('__ICE__')&&pc){try{pc.addIceCandidate(new RTCIceCandidate(JSON.parse(d.text.replace('__ICE__','')))).catch(()=>{})}catch(e){}return}
        if(d.text==='__HANGUP__'){if(callActive||pc){rMsg('📞 Собеседник завершил',3000);hang(!1)}return}
        if(d.text.startsWith('__FILE__')){try{const fd=JSON.parse(d.text.replace('__FILE__',''));if(fd.type==='video-circle'&&fd.data)playVideoCircle(fd.data);if(fd.type==='audio'&&fd.data){const a=new Audio('data:audio/webm;base64,'+fd.data);a.play().catch(()=>{})}rMsg('📹 Сообщение получено',3000)}catch(e){}return}
        activeChannelId=d.channelId;addMsg('Друг',d.text);if(toggleSoundState)playSound('bow_shot.mp3')
    });
    P2PPong.on('onError',d=>{rMsg('⚠ '+(d.text||'Ошибка'),4000);conn('offline',Object.keys(P2PPong.getChannels()).length)});

    // Кнопки
    btnMainAction?.addEventListener('click',()=>{const chs=P2PPong.getChannels();const keys=Object.keys(chs);if(!keys.length){P2PPong.createArrow()}else{if(!activeChannelId||!chs[activeChannelId]){activeChannelId=keys[0];activeSecret=chs[activeChannelId]?.sessionSecret}if(callActive)hang(!0);else startCall()}});
    btnCallMain?.addEventListener('click',()=>callActive?hang(!0):startCall());
    $('btn-arrow')?.addEventListener('click',()=>P2PPong.createArrow());
    btnAnswer?.addEventListener('click',acceptCall);
    btnReject?.addEventListener('click',()=>{if(incomingOffer){P2PPong.sendMessage(activeChannelId,'__HANGUP__');incomingOffer=null;ui('ready');rMsg('📞 Отклонено',3000)}});
    btnEndCall?.addEventListener('click',()=>hang(!0));
    btnMic?.addEventListener('click',()=>{if(stream){micOn=!micOn;stream.getAudioTracks().forEach(t=>t.enabled=micOn);btnMic.textContent=micOn?'🎤':'🔇'}});
    btnSpeaker?.addEventListener('click',()=>{speakerOn=!speakerOn;btnSpeaker.textContent=speakerOn?'🔊':'🔈'});
    btnVoice?.addEventListener('pointerdown',e=>{e.preventDefault();startVoiceRecording()});
    btnVoice?.addEventListener('pointerup',e=>{e.preventDefault();stopVoiceRecording()});
    btnVoice?.addEventListener('pointerleave',stopVoiceRecording);
    btnVideoCircle?.addEventListener('click',startVideoCircle);
    videoCircleClose?.addEventListener('click',()=>{videoCirclePlayer.style.display='none';if(videoCircleVideo)videoCircleVideo.pause()});

    $('btn-avatar-menu')?.addEventListener('click',()=>{avatarSelector?.classList.toggle('show');overlay?.classList.toggle('show');if(avatarSelector?.classList.contains('show'))loadAvatars()});
    overlay?.addEventListener('click',closeSheets);
    nickLabel?.addEventListener('click',()=>{nickInput.value=nickLabel.textContent;nickModal?.classList.add('active')});
    $('btn-nick-cancel')?.addEventListener('click',()=>nickModal?.classList.remove('active'));
    $('btn-nick-save')?.addEventListener('click',()=>{const n=nickInput.value.trim().substring(0,12);if(n){nickLabel.textContent=n;localStorage.setItem('robinhood_nick',n)}nickModal?.classList.remove('active')});
    $('btn-settings')?.addEventListener('click',()=>{settingsSheet?.classList.toggle('open');overlay?.classList.toggle('show')});
    $('settings-close')?.addEventListener('click',()=>{settingsSheet?.classList.remove('open');overlay?.classList.remove('show')});
    $('setting-contacts')?.addEventListener('click',()=>{settingsSheet?.classList.remove('open');loadContacts();contactsSheet?.classList.add('open');overlay?.classList.add('show')});
    $('contacts-close')?.addEventListener('click',()=>{contactsSheet?.classList.remove('open');overlay?.classList.remove('show')});
    $('setting-theme')?.addEventListener('click',()=>{const ct=localStorage.getItem('robinhood_theme')||'forest';const idx=themes.findIndex(t=>t.id===ct);applyTheme(themes[(idx+1)%themes.length].id)});
    $('setting-clear')?.addEventListener('click',()=>{if(confirm('⚠ Все данные будут удалены!')){hang(!1);Object.keys(P2PPong.getChannels()).forEach(k=>delete P2PPong.getChannels()[k]);activeChannelId=null;activeSecret=null;rMsg('🚬 Всё сожжено!',5000);localStorage.clear();indexedDB.deleteDatabase('RobinCallContacts');loadContacts()}});
    if(toggleSound){toggleSound.addEventListener('change',function(){toggleSoundState=this.checked;localStorage.setItem('robinhood_sound',toggleSoundState)})}
    $('btn-copy-link-modal')?.addEventListener('click',()=>{if(currentLink)navigator.clipboard.writeText(currentLink).catch(()=>{});rMsg('📋 Скопировано!',2000)});
    $('btn-share-link')?.addEventListener('click',()=>{if(currentLink&&navigator.share)navigator.share({title:'RobinCall',text:'Присоединяйтесь!',url:currentLink}).catch(()=>{});else if(currentLink)navigator.clipboard.writeText(currentLink).catch(()=>{})});
    $('btn-close-modal')?.addEventListener('click',()=>refModal?.classList.remove('active'));
    btnConnectPeer?.addEventListener('click',()=>{const val=peerIdInput?.value.trim();if(!val){rMsg('⚠ Введите PeerID или ссылку',3000);return}let p=val,k='';if(val.includes('peer=')){try{const u=new URL(val);p=u.searchParams.get('peer')||p;k=u.searchParams.get('key')||''}catch(e){}}if(k)P2PPong.acceptArrow(p,k);else rMsg('⚠ Нужен ключ из ссылки',3000);refModal?.classList.remove('active')});

    window.addEventListener('online',()=>conn('online',Object.keys(P2PPong.getChannels()).length));
    window.addEventListener('offline',()=>conn('offline',Object.keys(P2PPong.getChannels()).length));

    if(window._pendingRef){const{id,key}=window._pendingRef;window._pendingRef=null;setTimeout(()=>P2PPong.acceptArrow(null,key),500)}
    ui('idle');rMsg('🏹 Готов!',3000);
    const chs=P2PPong.getChannels();if(Object.keys(chs).length>0){activeChannelId=Object.keys(chs)[0];activeSecret=chs[activeChannelId]?.sessionSecret;ui('ready')}
}
initApp();
})();
</script>
</body>
</html>
