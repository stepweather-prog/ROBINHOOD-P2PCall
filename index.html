<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RobinCall 🏹</title>
    <link rel="manifest" href="manifest.json">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src * blob:;">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', 'Inter', 'Georgia', serif; }
        body {
            background: linear-gradient(135deg, #1a2a1f 0%, #0d1a0c 100%);
            color: #e8e2c7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('../assets/background.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            opacity: 0.3;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(30,40,25,0.6), rgba(10,20,8,0.9));
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2em;
            background: linear-gradient(135deg, #e8d5a3, #c4a24b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        .status {
            color: #b8a87a;
            font-size: 1em;
            margin: 15px 0;
            min-height: 30px;
        }
        .btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #c4a24b;
            cursor: pointer;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            transition: all 0.3s;
            background: rgba(196, 162, 75, 0.15);
            color: #e8e2c7;
        }
        .btn:hover { background: rgba(196, 162, 75, 0.35); box-shadow: 0 0 30px rgba(196, 162, 75, 0.4); transform: scale(1.1); }
        .btn-call { border-color: #4caf50; color: #4caf50; }
        .btn-hangup { border-color: #f44336; color: #f44336; }
        .btn-answer { border-color: #4caf50; color: #4caf50; }
        .btn-reject { border-color: #f44336; color: #f44336; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn:disabled:hover { background: rgba(196, 162, 75, 0.15); box-shadow: none; transform: none; }
        .hidden { display: none !important; }
        .controls { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
        .debug { color: #666; font-size: 0.7em; margin-top: 30px; word-break: break-all; max-height: 100px; overflow-y: auto; }
        .ripple { animation: ripple 1.5s infinite; }
        @keyframes ripple {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.5); }
            70% { box-shadow: 0 0 0 30px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
        .fingerprint-display {
            font-family: monospace;
            font-size: 0.7em;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 8px;
            margin: 8px 0;
            word-break: break-all;
            color: #81c784;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏹 RobinCall</h1>
        <div class="status" id="status">Ожидание...</div>
        <div class="fingerprint-display hidden" id="fingerprint-info"></div>

        <button class="btn btn-call hidden" id="btn-call" title="Позвонить">📞</button>

        <div class="controls hidden" id="incoming-controls">
            <button class="btn btn-answer" id="btn-answer" title="Принять">📞</button>
            <button class="btn btn-reject" id="btn-reject" title="Отклонить">❌</button>
        </div>

        <div class="controls hidden" id="active-controls">
            <button class="btn btn-hangup ripple" id="btn-hangup" title="Завершить">📞</button>
        </div>

        <div class="debug" id="debug"></div>
    </div>

    <script>
        (function() {
            // ==================== DOM ====================
            const statusDiv = document.getElementById('status');
            const debugDiv = document.getElementById('debug');
            const fingerprintInfo = document.getElementById('fingerprint-info');
            const btnCall = document.getElementById('btn-call');
            const btnHangup = document.getElementById('btn-hangup');
            const btnAnswer = document.getElementById('btn-answer');
            const btnReject = document.getElementById('btn-reject');
            const incomingControls = document.getElementById('incoming-controls');
            const activeControls = document.getElementById('active-controls');

            // ==================== ICE СЕРВЕРЫ ====================
            const iceServers = [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                {
                    urls: ["turn:openrelay.metered.ca:80?transport=tcp", "turn:openrelay.metered.ca:443?transport=tcp"],
                    username: "openrelayproject",
                    credential: "openrelayproject"
                }
            ];

            // ==================== СОСТОЯНИЕ ====================
            let peerConnection = null;
            let localStream = null;
            let channelId = null;
            let sessionSecret = null;
            let ecdhPubKey = null;
            let peerFingerprint = null;
            let callActive = false;
            let parentWindow = null;

            // ==================== АУДИО ====================
            async function getLocalStream(enableVideo = false) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        },
                        video: enableVideo
                    });
                    return true;
                } catch (e) {
                    log('Ошибка микрофона: ' + e.message);
                    statusDiv.textContent = '❌ Нет доступа к микрофону';
                    notifyParent('robinhood-call-error', { error: 'microphone-denied' });
                    return false;
                }
            }

            // ==================== WEBRTC ====================
            function createPeerConnection() {
                if (peerConnection) {
                    peerConnection.close();
                }
                peerConnection = new RTCPeerConnection({ iceServers });

                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        peerConnection.addTrack(track, localStream);
                    });
                }

                peerConnection.ontrack = (event) => {
                    log('Получен удалённый аудио/видео');
                    const audio = new Audio();
                    audio.srcObject = event.streams[0];
                    audio.play().catch(e => log('Автовоспроизведение заблокировано'));
                };

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        sendSignal('__ICE__' + JSON.stringify(event.candidate));
                    }
                };

                peerConnection.onconnectionstatechange = () => {
                    log('Состояние: ' + peerConnection.connectionState);
                    if (peerConnection.connectionState === 'connected') {
                        statusDiv.textContent = '✅ Связь установлена';
                        callActive = true;
                        notifyParent('robinhood-call-connected', {});
                    } else if (peerConnection.connectionState === 'disconnected' ||
                        peerConnection.connectionState === 'failed') {
                        statusDiv.textContent = '❌ Связь потеряна';
                        hangup();
                    }
                };

                peerConnection.oniceconnectionstatechange = () => {
                    log('ICE: ' + peerConnection.iceConnectionState);
                };

                // Обработка ошибок
                peerConnection.onicecandidateerror = (event) => {
                    log('ICE ошибка: ' + (event.errorText || 'неизвестно'));
                };
            }

            // ==================== ЗВОНОК ====================
            async function startCall() {
                if (callActive || !channelId) {
                    statusDiv.textContent = '❌ Нет канала для звонка';
                    return;
                }
                
                statusDiv.textContent = '📞 Вызов...';
                btnCall.classList.add('hidden');
                activeControls.classList.remove('hidden');

                if (!await getLocalStream(urlParams.get('mode') === 'video')) {
                    hangup();
                    return;
                }
                
                createPeerConnection();

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                sendSignal('__OFFER__' + JSON.stringify(offer));
                log('Offer отправлен');
            }

            async function acceptCall() {
                if (callActive) return;
                statusDiv.textContent = '📞 Соединение...';
                incomingControls.classList.add('hidden');
                activeControls.classList.remove('hidden');

                if (!await getLocalStream()) {
                    hangup();
                    return;
                }
                createPeerConnection();
            }

            function hangup() {
                callActive = false;
                statusDiv.textContent = '📞 Звонок завершён';
                activeControls.classList.add('hidden');
                incomingControls.classList.add('hidden');
                btnCall.classList.remove('hidden');
                
                sendSignal('__HANGUP__');
                notifyParent('robinhood-call-ended', {});

                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                
                // Закрываем окно через 3 секунды
                setTimeout(() => {
                    if (window.opener || window.parent !== window) {
                        window.close();
                    }
                }, 3000);
            }

            // ==================== КОММУНИКАЦИЯ ====================
            function sendSignal(text) {
                // Отправляем в родительское окно (RobinHood)
                notifyParent('robinhood-call-signal', { text, channelId });
            }

            function notifyParent(type, data) {
                const msg = { type, ...data };
                
                // Пробуем через window.opener
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage(msg, '*');
                }
                
                // Пробуем через parent (для iframe)
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(msg, '*');
                }
            }

            // Получение параметров от RobinHood
            window.addEventListener('message', (event) => {
                const data = event.data;
                
                // Принимаем параметры инициализации
                if (data.type === 'robinhood-call-init') {
                    channelId = data.channelId;
                    sessionSecret = data.sessionSecret;
                    ecdhPubKey = data.ecdhPubKey;
                    peerFingerprint = data.fingerprint;
                    
                    log('Канал инициализирован: ' + channelId);
                    if (peerFingerprint) {
                        fingerprintInfo.classList.remove('hidden');
                        fingerprintInfo.textContent = '🔐 Отпечаток: ' + 
                            peerFingerprint.substring(0, 16) + '...';
                    }
                    
                    statusDiv.textContent = '🏹 Готов к вызову';
                    btnCall.classList.remove('hidden');
                    notifyParent('robinhood-call-ready', { channelId });
                }
                
                // Обработка сигналов звонка (проброшенных из основного приложения)
                if (data.type === 'robinhood-call-signal' && data.text) {
                    handleSignal(data.text);
                }
            });

            // Обработка сигналов звонка
            async function handleSignal(text) {
                if (text.startsWith('__OFFER__')) {
                    if (callActive) return;
                    const offer = JSON.parse(text.replace('__OFFER__', ''));
                    statusDiv.textContent = '📞 Входящий вызов...';
                    btnCall.classList.add('hidden');
                    incomingControls.classList.remove('hidden');

                    await acceptCall();
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    sendSignal('__ANSWER__' + JSON.stringify(answer));
                    log('Answer отправлен');
                }
                else if (text.startsWith('__ANSWER__')) {
                    if (!peerConnection) return;
                    const answer = JSON.parse(text.replace('__ANSWER__', ''));
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                    log('Answer получен');
                }
                else if (text.startsWith('__ICE__')) {
                    if (!peerConnection) return;
                    try {
                        const candidate = JSON.parse(text.replace('__ICE__', ''));
                        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                    } catch(e) {
                        log('Ошибка ICE: ' + e.message);
                    }
                }
                else if (text === '__HANGUP__') {
                    if (callActive) {
                        statusDiv.textContent = '📞 Собеседник завершил звонок';
                        hangup();
                    }
                }
            }

            // ==================== КНОПКИ ====================
            btnCall.addEventListener('click', startCall);
            btnHangup.addEventListener('click', hangup);
            btnAnswer.addEventListener('click', async () => {
                await startCall();
            });
            btnReject.addEventListener('click', () => {
                sendSignal('__HANGUP__');
                hangup();
            });

            // ==================== ДЕБАГ ====================
            function log(msg) {
                console.log('[RobinCall]', msg);
                debugDiv.textContent += msg + '\n';
                debugDiv.scrollTop = debugDiv.scrollHeight;
            }

            // ==================== ПАРАМЕТРЫ ИЗ URL ====================
            const urlParams = new URLSearchParams(window.location.search);

            // ==================== ИНИЦИАЛИЗАЦИЯ ====================
            async function init() {
                channelId = urlParams.get('channel');
                
                // Сообщаем родительскому окну о готовности
                if (channelId) {
                    statusDiv.textContent = '🏹 Ожидание параметров...';
                    notifyParent('robinhood-call-ready', { channelId });
                } else {
                    statusDiv.textContent = '🏹 Ожидание канала...';
                    // Ждем инициализации от родителя
                }
                
                log('RobinCall v2.0 загружен');
                log('Канал: ' + (channelId || 'ожидание инициализации'));
            }

            // Закрытие окна при потере связи с родителем
            window.addEventListener('beforeunload', () => {
                if (callActive) {
                    hangup();
                }
            });

            // Периодическая проверка родительского окна
            setInterval(() => {
                if (window.opener && window.opener.closed) {
                    if (callActive) hangup();
                    window.close();
                }
            }, 5000);

            window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
